# ==============================================================================
# 5. SCRIPTS (RESET/SAFETY HELPERS)
# ==============================================================================
script:
  zendure_set_u1_outputlimit_zero:
    alias: "Zendure: U1 OutputLimit -> 0W"
    mode: restart
    sequence:
      - variables:
          generation_invalidate: "{{ ((as_timestamp(now()) * 1000000) | int) % 1000000000 }}"
      - action: input_number.set_value
        target: { entity_id: input_number.zendure_dispatch_generation }
        data: { value: "{{ generation_invalidate }}" }
      - action: script.zendure_dispatch_u1_output
        data:
          power: 0
          ensure_output_mode: false
          force: true

  zendure_set_u2_outputlimit_zero:
    alias: "Zendure: U2 OutputLimit -> 0W"
    mode: restart
    sequence:
      - variables:
          generation_invalidate: "{{ ((as_timestamp(now()) * 1000000) | int) % 1000000000 }}"
      - action: input_number.set_value
        target: { entity_id: input_number.zendure_dispatch_generation }
        data: { value: "{{ generation_invalidate }}" }
      - action: script.zendure_dispatch_u2_output
        data:
          power: 0
          ensure_output_mode: false
          force: true

  zendure_dispatch_u1_output:
    alias: "Zendure: Dispatch U1 Output Command"
    mode: queued
    max: 20
    fields:
      power:
        description: "Target output power in W"
      ensure_output_mode:
        description: "If true, enforce output mode before sending output limit"
      force:
        description: "Send command immediately (ignore cooldown/check)"
      reassert_output_mode:
        description: "Publish Output mode even if the readback already reports it"
      generation:
        description: "Optional dispatch generation; stale generations are dropped"
    sequence:
      - variables:
          unit_output_limit: >-
            {{ [[states('input_number.zendure_conf_max_output_per_unit') | int(800), 0] | max, 800] | min }}
          configured_system_limit: "{{ [[states('input_number.zendure_conf_max_output') | int(900), 0] | max, 1000] | min }}"
          system_output_limit: >-
            {{ [configured_system_limit | int(900), (unit_output_limit | int(800)) * 2] | min }}
          other_desired: >-
            {{ [[states('input_number.zendure_last_sent_2') | int(0), 0] | max,
                 unit_output_limit | int(800)] | min }}
          remaining_system_capacity: >-
            {{ [system_output_limit | int(0) - other_desired | int(0), 0] | max }}
          target: >-
            {{ [0, [power | int(0), unit_output_limit | int(800),
                     remaining_system_capacity | int(0)] | min] | max }}
          ensure_mode: "{{ ensure_output_mode | default(true) | bool }}"
          force_mode: "{{ force | default(false) | bool }}"
          reassert_mode: "{{ reassert_output_mode | default(false) | bool }}"
          generation_value: "{{ generation | default(-1) | int(-1) }}"
          generation_current: "{{ states('input_number.zendure_dispatch_generation') | int(0) }}"
          generation_ok: "{{ generation_value < 0 or generation_value == generation_current }}"
          desired_before: "{{ states('input_number.zendure_last_sent_1') | int(0) }}"
          dispatched_before: "{{ states('input_number.zendure_last_dispatched_1') | int(0) }}"
          confirmed: "{{ states('input_number.zendure_confirmed_output_1') | int(0) }}"
          confirmed_ts: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_limit_ts'), 0) }}"
          confirmed_age: "{{ as_timestamp(now()) - confirmed_ts }}"
          confirmed_recent: "{{ confirmed_ts > 1 and confirmed_age < 30 }}"
          last_dispatch_ts: "{{ as_timestamp(states('input_datetime.zendure_last_dispatch_ts_u1'), 0) }}"
          new_command: "{{ target != dispatched_before }}"
          confirmed_after_last_dispatch: "{{ last_dispatch_ts <= 1 or confirmed_ts >= last_dispatch_ts }}"
          ack_needed: >-
            {{ new_command or target != confirmed or not confirmed_recent or not confirmed_after_last_dispatch }}
          since_dispatch: "{{ as_timestamp(now()) - last_dispatch_ts }}"
          cmd_ok: "{{ since_dispatch > 1.2 }}"
          ts_mode: "{{ as_timestamp(states('input_datetime.zendure_last_ac_mode_dispatch_ts_u1'), 0) }}"
          since_mode: "{{ as_timestamp(now()) - ts_mode }}"
          mode_ok: "{{ since_mode > 10 }}"
          mode_mismatch: "{{ states('sensor.solarflow_1_ac_mode') != 'Output mode' or states('input_text.zendure_ac_mode_u1') != 'Output mode' }}"
          publish_needed: "{{ ack_needed or target != dispatched_before or force_mode }}"
      - if:
          - condition: template
            value_template: "{{ not generation_ok }}"
        then:
          - stop: "Stale U1 dispatch generation dropped."
      - if:
          - condition: template
            value_template: "{{ target != desired_before }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_last_sent_1 }
            data: { value: "{{ target }}" }
      - if:
          - condition: template
            value_template: >
              {{ ack_needed and
                 (target != desired_before or as_timestamp(states('input_datetime.zendure_output_pending_since_u1'), 0) <= 1) }}
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_output_pending_since_u1 }
            data: { timestamp: "{{ now().timestamp() }}" }
      - if:
          - condition: template
            value_template: "{{ ensure_mode and (mode_mismatch or reassert_mode) and (mode_ok or force_mode or reassert_mode) }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_ac_mode_u1 }
            data: { value: "Output mode" }
          - action: mqtt.publish
            data: { topic: !secret zendure_topic_u1_select_acMode_set, payload: "Output mode", qos: 1 }
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_ac_mode_dispatch_ts_u1 }
            data: { timestamp: "{{ now().timestamp() }}" }
      - if:
          - condition: template
            value_template: "{{ publish_needed and (cmd_ok or force_mode) }}"
        then:
          # Mark the attempt before publishing so only a readback received after
          # this point can acknowledge the command.
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_dispatch_ts_u1 }
            data: { timestamp: "{{ now().timestamp() }}" }
          - if:
              - condition: template
                value_template: "{{ target != dispatched_before }}"
            then:
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_last_dispatched_1 }
                data: { value: "{{ target }}" }
          - action: mqtt.publish
            data: { topic: !secret zendure_topic_u1_number_outputLimit_set, payload: "{{ target }}", qos: 1 }

  zendure_dispatch_u2_output:
    alias: "Zendure: Dispatch U2 Output Command"
    mode: queued
    max: 20
    fields:
      power:
        description: "Target output power in W"
      ensure_output_mode:
        description: "If true, enforce output mode before sending output limit"
      force:
        description: "Send command immediately (ignore cooldown/check)"
      reassert_output_mode:
        description: "Publish Output mode even if the readback already reports it"
      generation:
        description: "Optional dispatch generation; stale generations are dropped"
    sequence:
      - variables:
          unit_output_limit: >-
            {{ [[states('input_number.zendure_conf_max_output_per_unit') | int(800), 0] | max, 800] | min }}
          configured_system_limit: "{{ [[states('input_number.zendure_conf_max_output') | int(900), 0] | max, 1000] | min }}"
          system_output_limit: >-
            {{ [configured_system_limit | int(900), (unit_output_limit | int(800)) * 2] | min }}
          other_desired: >-
            {{ [[states('input_number.zendure_last_sent_1') | int(0), 0] | max,
                 unit_output_limit | int(800)] | min }}
          remaining_system_capacity: >-
            {{ [system_output_limit | int(0) - other_desired | int(0), 0] | max }}
          target: >-
            {{ [0, [power | int(0), unit_output_limit | int(800),
                     remaining_system_capacity | int(0)] | min] | max }}
          ensure_mode: "{{ ensure_output_mode | default(true) | bool }}"
          force_mode: "{{ force | default(false) | bool }}"
          reassert_mode: "{{ reassert_output_mode | default(false) | bool }}"
          generation_value: "{{ generation | default(-1) | int(-1) }}"
          generation_current: "{{ states('input_number.zendure_dispatch_generation') | int(0) }}"
          generation_ok: "{{ generation_value < 0 or generation_value == generation_current }}"
          desired_before: "{{ states('input_number.zendure_last_sent_2') | int(0) }}"
          dispatched_before: "{{ states('input_number.zendure_last_dispatched_2') | int(0) }}"
          confirmed: "{{ states('input_number.zendure_confirmed_output_2') | int(0) }}"
          confirmed_ts: "{{ as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_limit_ts'), 0) }}"
          confirmed_age: "{{ as_timestamp(now()) - confirmed_ts }}"
          confirmed_recent: "{{ confirmed_ts > 1 and confirmed_age < 30 }}"
          last_dispatch_ts: "{{ as_timestamp(states('input_datetime.zendure_last_dispatch_ts_u2'), 0) }}"
          new_command: "{{ target != dispatched_before }}"
          confirmed_after_last_dispatch: "{{ last_dispatch_ts <= 1 or confirmed_ts >= last_dispatch_ts }}"
          ack_needed: >-
            {{ new_command or target != confirmed or not confirmed_recent or not confirmed_after_last_dispatch }}
          since_dispatch: "{{ as_timestamp(now()) - last_dispatch_ts }}"
          cmd_ok: "{{ since_dispatch > 1.2 }}"
          ts_mode: "{{ as_timestamp(states('input_datetime.zendure_last_ac_mode_dispatch_ts_u2'), 0) }}"
          since_mode: "{{ as_timestamp(now()) - ts_mode }}"
          mode_ok: "{{ since_mode > 20 }}"
          mode_mismatch: "{{ states('sensor.solarflow_2_ac_mode') != 'Output mode' or states('input_text.zendure_ac_mode_u2') != 'Output mode' }}"
          publish_needed: "{{ ack_needed or target != dispatched_before or force_mode }}"
      - if:
          - condition: template
            value_template: "{{ not generation_ok }}"
        then:
          - stop: "Stale U2 dispatch generation dropped."
      - if:
          - condition: template
            value_template: "{{ target != desired_before }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_last_sent_2 }
            data: { value: "{{ target }}" }
      - if:
          - condition: template
            value_template: >
              {{ ack_needed and
                 (target != desired_before or as_timestamp(states('input_datetime.zendure_output_pending_since_u2'), 0) <= 1) }}
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_output_pending_since_u2 }
            data: { timestamp: "{{ now().timestamp() }}" }
      - if:
          - condition: template
            value_template: "{{ ensure_mode and (mode_mismatch or reassert_mode) and (mode_ok or force_mode or reassert_mode) }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_ac_mode_u2 }
            data: { value: "Output mode" }
          - action: mqtt.publish
            data: { topic: !secret zendure_topic_u2_select_acMode_set, payload: "Output mode", qos: 1 }
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_ac_mode_dispatch_ts_u2 }
            data: { timestamp: "{{ now().timestamp() }}" }
      - if:
          - condition: template
            value_template: "{{ publish_needed and (cmd_ok or force_mode) }}"
        then:
          # Mark the attempt before publishing so only a readback received after
          # this point can acknowledge the command.
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_dispatch_ts_u2 }
            data: { timestamp: "{{ now().timestamp() }}" }
          - if:
              - condition: template
                value_template: "{{ target != dispatched_before }}"
            then:
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_last_dispatched_2 }
                data: { value: "{{ target }}" }
          - action: mqtt.publish
            data: { topic: !secret zendure_topic_u2_number_outputLimit_set, payload: "{{ target }}", qos: 1 }

  zendure_dispatch_output_pair:
    alias: "Zendure: Dispatch Output Pair Break-Before-Make"
    mode: restart
    max_exceeded: silent
    fields:
      target_1: { description: "Final U1 output target" }
      target_2: { description: "Final U2 output target" }
      send_1: { description: "Dispatch U1" }
      send_2: { description: "Dispatch U2" }
      force_1: { description: "Force U1 dispatch" }
      force_2: { description: "Force U2 dispatch" }
      ensure_mode_1: { description: "Ensure U1 Output mode" }
      ensure_mode_2: { description: "Ensure U2 Output mode" }
      reassert_mode_1: { description: "Re-assert U1 Output mode" }
      reassert_mode_2: { description: "Re-assert U2 Output mode" }
      generation: { description: "Dispatch generation" }
    sequence:
      - variables:
          unit_dispatch_limit: >-
            {{ [[states('input_number.zendure_conf_max_output_per_unit') | int(800), 0] | max, 800] | min }}
          configured_global_dispatch_limit: "{{ [[states('input_number.zendure_conf_max_output') | int(900), 0] | max, 1000] | min }}"
          global_dispatch_limit: >-
            {{ [configured_global_dispatch_limit | int(900), (unit_dispatch_limit | int(800)) * 2] | min }}
          requested_t1: >-
            {{ [0, [target_1 | int(0), unit_dispatch_limit | int(800)] | min] | max }}
          requested_t2: >-
            {{ [0, [target_2 | int(0), unit_dispatch_limit | int(800)] | min] | max }}
          requested_do1: "{{ send_1 | default(false) | bool }}"
          requested_do2: "{{ send_2 | default(false) | bool }}"
          desired_now1: "{{ [states('input_number.zendure_last_sent_1') | int(0), 0] | max }}"
          desired_now2: "{{ [states('input_number.zendure_last_sent_2') | int(0), 0] | max }}"
          desired_reserved1: "{{ [desired_now1 | int(0), unit_dispatch_limit | int(800)] | min }}"
          desired_reserved2: "{{ [desired_now2 | int(0), unit_dispatch_limit | int(800)] | min }}"
          requested_sum: "{{ (requested_t1 | int(0)) + (requested_t2 | int(0)) }}"
          dispatch_scale: >-
            {{ (global_dispatch_limit | float(900)) / (requested_sum | float(1))
               if requested_do1|bool and requested_do2|bool
                  and (requested_sum | int(0)) > (global_dispatch_limit | int(900))
                  and (requested_sum | int(0)) > 0
               else 1 }}
          # Final invariant: a paired positive dispatch stays inside the configured
          # system ceiling. If only one unit is being changed, the other unit's
          # current desired value is reserved instead of being silently rescaled.
          t1: >-
            {% set limit = global_dispatch_limit | int(900) %}
            {% if requested_do1|bool and requested_do2|bool %}
              {{ (requested_t1 | int(0) * dispatch_scale | float(1)) | int(0) }}
            {% elif requested_do1|bool %}
              {{ [requested_t1 | int(0), [limit - desired_reserved2 | int(0), 0] | max] | min }}
            {% else %}
              {{ [desired_reserved1 | int(0), limit] | min }}
            {% endif %}
          t2: >-
            {% set limit = global_dispatch_limit | int(900) %}
            {% if requested_do1|bool and requested_do2|bool %}
              {{ [
                   (requested_t2 | int(0) * dispatch_scale | float(1)) | int(0),
                   limit - (t1 | int(0))
                 ] | min | int(0) }}
            {% elif requested_do2|bool %}
              {{ [requested_t2 | int(0), [limit - desired_reserved1 | int(0), 0] | max] | min }}
            {% else %}
              {{ [desired_reserved2 | int(0), [limit - (t1 | int(0)), 0] | max] | min }}
            {% endif %}
          desired_pair_over_limit: >-
            {{ (desired_now1 | int(0)) > (unit_dispatch_limit | int(800))
               or (desired_now2 | int(0)) > (unit_dispatch_limit | int(800))
               or (desired_now1 | int(0)) + (desired_now2 | int(0)) > (global_dispatch_limit | int(900)) }}
          do1: >-
            {{ requested_do1|bool or
               (desired_pair_over_limit|bool and (t1 | int(0)) < (desired_now1 | int(0))) }}
          do2: >-
            {{ requested_do2|bool or
               (desired_pair_over_limit|bool and (t2 | int(0)) < (desired_now2 | int(0))) }}
          f1: "{{ force_1 | default(false) | bool }}"
          f2: "{{ force_2 | default(false) | bool }}"
          em1: "{{ ensure_mode_1 | default(true) | bool }}"
          em2: "{{ ensure_mode_2 | default(true) | bool }}"
          rm1: "{{ reassert_mode_1 | default(false) | bool }}"
          rm2: "{{ reassert_mode_2 | default(false) | bool }}"
          gen: "{{ generation | int(-1) }}"
          # A pre-command output-power sample must not make a restarted pair run
          # believe that the already acknowledged reduction is still pending.
          output_ts_before1: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_power_ts'), 0) }}"
          output_ts_before2: "{{ as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_power_ts'), 0) }}"
          last_dispatch_before1: "{{ as_timestamp(states('input_datetime.zendure_last_dispatch_ts_u1'), 0) }}"
          last_dispatch_before2: "{{ as_timestamp(states('input_datetime.zendure_last_dispatch_ts_u2'), 0) }}"
          actual_current1: >-
            {% set age = as_timestamp(now()) - (output_ts_before1 | float(0)) %}
            {{ states('sensor.solarflow_1_output_power') | int(0)
               if age < 10
                  and is_number(states('sensor.solarflow_1_output_power'))
                  and ((last_dispatch_before1 | float(0)) <= 1
                       or (output_ts_before1 | float(0)) >= (last_dispatch_before1 | float(0)))
               else 0 }}
          actual_current2: >-
            {% set age = as_timestamp(now()) - (output_ts_before2 | float(0)) %}
            {{ states('sensor.solarflow_2_output_power') | int(0)
               if age < 10
                  and is_number(states('sensor.solarflow_2_output_power'))
                  and ((last_dispatch_before2 | float(0)) <= 1
                       or (output_ts_before2 | float(0)) >= (last_dispatch_before2 | float(0)))
               else 0 }}
          current1: >
            {{ [states('input_number.zendure_last_dispatched_1') | int(0),
                states('input_number.zendure_confirmed_output_1') | int(0),
                actual_current1 | int(0)] | max }}
          current2: >
            {{ [states('input_number.zendure_last_dispatched_2') | int(0),
                states('input_number.zendure_confirmed_output_2') | int(0),
                actual_current2 | int(0)] | max }}
          needs_lower1: "{{ t1 < current1 }}"
          needs_lower2: "{{ t2 < current2 }}"
          lower1: "{{ do1 and needs_lower1 }}"
          lower2: "{{ do2 and needs_lower2 }}"
          raise1_requested: "{{ do1 and not needs_lower1 }}"
          raise2_requested: "{{ do2 and not needs_lower2 }}"
          # Never raise one unit while an opposing reduction is required but was
          # not selected/allowed in this generation.
          raise1: "{{ raise1_requested and not (needs_lower2 and not lower2) }}"
          raise2: "{{ raise2_requested and not (needs_lower1 and not lower1) }}"
          paired_transfer: "{{ (lower1 and raise2) or (lower2 and raise1) }}"
          # Amount that phase 2 would add. A fresh post-command grid reading may
          # confirm sufficient import headroom before Zendure's ACK arrives.
          raise_delta1: >-
            {% if raise1 %}{{ [(t1 | int(0)) - (current1 | int(0)), 0] | max }}{% else %}0{% endif %}
          raise_delta2: >-
            {% if raise2 %}{{ [(t2 | int(0)) - (current2 | int(0)), 0] | max }}{% else %}0{% endif %}
          raise_delta_total: "{{ (raise_delta1 | int(0)) + (raise_delta2 | int(0)) }}"
          transfer_grid_margin: >-
            {{ [states('input_number.zendure_conf_grid_bias') | int(10), 10] | max }}
      - if:
          - condition: template
            value_template: "{{ gen != states('input_number.zendure_dispatch_generation') | int(0) }}"
        then:
          - stop: "Stale pair generation dropped before phase 1."
      - parallel:
          - if:
              - condition: template
                value_template: "{{ lower1 }}"
            then:
              - action: script.zendure_dispatch_u1_output
                data:
                  power: "{{ t1 }}"
                  ensure_output_mode: "{{ em1 }}"
                  force: "{{ f1 or paired_transfer }}"
                  reassert_output_mode: "{{ rm1 }}"
                  generation: "{{ gen }}"
          - if:
              - condition: template
                value_template: "{{ lower2 }}"
            then:
              - action: script.zendure_dispatch_u2_output
                data:
                  power: "{{ t2 }}"
                  ensure_output_mode: "{{ em2 }}"
                  force: "{{ f2 or paired_transfer }}"
                  reassert_output_mode: "{{ rm2 }}"
                  generation: "{{ gen }}"
      - if:
          - condition: template
            # Pure reductions are complete after phase 1. Hold the pair script
            # open only when an opposing increase must follow the reduction.
            value_template: "{{ paired_transfer }}"
        then:
          - wait_template: >
              {% set now_ts = as_timestamp(now()) %}
              {% set out_ts1 = as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_power_ts'), 0) %}
              {% set out_ts2 = as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_power_ts'), 0) %}
              {% set ack_ts1 = as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_limit_ts'), 0) %}
              {% set ack_ts2 = as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_limit_ts'), 0) %}
              {% set cmd_ts1 = as_timestamp(states('input_datetime.zendure_last_dispatch_ts_u1'), 0) %}
              {% set cmd_ts2 = as_timestamp(states('input_datetime.zendure_last_dispatch_ts_u2'), 0) %}
              {% set confirmed1_ok = ack_ts1 >= cmd_ts1 and states('input_number.zendure_confirmed_output_1') | int(0) <= t1 + 30 %}
              {% set confirmed2_ok = ack_ts2 >= cmd_ts2 and states('input_number.zendure_confirmed_output_2') | int(0) <= t2 + 30 %}
              {# Direct MQTT sensor readback avoids waiting for the helper-sync automation. #}
              {% set direct_ts1 = as_timestamp(states.sensor.solarflow_1_output_limit.last_updated, 0) %}
              {% set direct_ts2 = as_timestamp(states.sensor.solarflow_2_output_limit.last_updated, 0) %}
              {% set direct1_ok = direct_ts1 >= cmd_ts1 and is_number(states('sensor.solarflow_1_output_limit')) and states('sensor.solarflow_1_output_limit') | int(9999) <= t1 + 30 %}
              {% set direct2_ok = direct_ts2 >= cmd_ts2 and is_number(states('sensor.solarflow_2_output_limit')) and states('sensor.solarflow_2_output_limit') | int(9999) <= t2 + 30 %}
              {% set actual1_ok = out_ts1 >= cmd_ts1 and (now_ts - out_ts1) < 10 and is_number(states('sensor.solarflow_1_output_power')) and states('sensor.solarflow_1_output_power')|float(9999) <= t1 + 30 %}
              {% set actual2_ok = out_ts2 >= cmd_ts2 and (now_ts - out_ts2) < 10 and is_number(states('sensor.solarflow_2_output_power')) and states('sensor.solarflow_2_output_power')|float(9999) <= t2 + 30 %}
              {% set grid_raw = states('sensor.zendure_grid_power') %}
              {% set grid_ts = as_timestamp(states.sensor.zendure_grid_power.last_updated, 0) %}
              {% set lower_cmd_ts1 = cmd_ts1 if lower1 else 0 %}
              {% set lower_cmd_ts2 = cmd_ts2 if lower2 else 0 %}
              {% set lower_cmd_ts = [lower_cmd_ts1, lower_cmd_ts2] | max %}
              {% set grid_headroom_ok = paired_transfer
                   and (raise_delta_total | int(0)) > 0
                   and is_number(grid_raw)
                   and grid_ts >= lower_cmd_ts
                   and (grid_raw | float(0)) >=
                       ((raise_delta_total | float(0)) + (transfer_grid_margin | float(10))) %}
              {{ gen != states('input_number.zendure_dispatch_generation') | int(0)
                 or grid_headroom_ok
                 or ((not lower1 or confirmed1_ok or direct1_ok or actual1_ok)
                     and (not lower2 or confirmed2_ok or direct2_ok or actual2_ok)) }}
            timeout: "00:00:03"
            continue_on_timeout: true
      - variables:
          lower_phase_confirmed: >
            {{ not paired_transfer or (wait is defined and wait.completed) }}
      - if:
          - condition: template
            value_template: "{{ gen != states('input_number.zendure_dispatch_generation') | int(0) }}"
        then:
          - stop: "Stale pair generation dropped before phase 2."
      - parallel:
          - if:
              - condition: template
                value_template: "{{ raise1 and (not lower2 or lower_phase_confirmed) }}"
            then:
              - action: script.zendure_dispatch_u1_output
                data:
                  power: "{{ t1 }}"
                  ensure_output_mode: "{{ em1 }}"
                  force: "{{ f1 }}"
                  reassert_output_mode: "{{ rm1 }}"
                  generation: "{{ gen }}"
          - if:
              - condition: template
                value_template: "{{ raise2 and (not lower1 or lower_phase_confirmed) }}"
            then:
              - action: script.zendure_dispatch_u2_output
                data:
                  power: "{{ t2 }}"
                  ensure_output_mode: "{{ em2 }}"
                  force: "{{ f2 }}"
                  reassert_output_mode: "{{ rm2 }}"
                  generation: "{{ gen }}"

  zendure_dispatch_u1_ac_mode:
    alias: "Zendure: Dispatch U1 AC Mode"
    mode: queued
    fields:
      mode:
        description: "Input mode oder Output mode"
      force:
        description: "Ignoriere Cooldown bei Notfällen"
    sequence:
      - variables:
          target_mode: "{{ mode | default('Output mode') }}"
          force_mode: "{{ force | default(false) }}"
          ts_mode: "{{ as_timestamp(states('input_datetime.zendure_last_ac_mode_dispatch_ts_u1'), 0) }}"
          since_mode: "{{ as_timestamp(now()) - ts_mode }}"
          mode_ok: "{{ since_mode > 20 }}"
          mode_mismatch: "{{ states('sensor.solarflow_1_ac_mode') != target_mode or states('input_text.zendure_ac_mode_u1') != target_mode }}"
      - if:
          - condition: template
            value_template: "{{ mode_mismatch and (force_mode or mode_ok) }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_ac_mode_u1 }
            data: { value: "{{ target_mode }}" }
          - action: mqtt.publish
            data: { topic: !secret zendure_topic_u1_select_acMode_set, payload: "{{ target_mode }}", qos: 1 }
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_ac_mode_dispatch_ts_u1 }
            data: { timestamp: "{{ now().timestamp() }}" }

  zendure_dispatch_u2_ac_mode:
    alias: "Zendure: Dispatch U2 AC Mode"
    mode: queued
    fields:
      mode:
        description: "Input mode oder Output mode"
      force:
        description: "Ignoriere Cooldown bei Notfällen"
    sequence:
      - variables:
          target_mode: "{{ mode | default('Output mode') }}"
          force_mode: "{{ force | default(false) }}"
          ts_mode: "{{ as_timestamp(states('input_datetime.zendure_last_ac_mode_dispatch_ts_u2'), 0) }}"
          since_mode: "{{ as_timestamp(now()) - ts_mode }}"
          mode_ok: "{{ since_mode > 20 }}"
          mode_mismatch: "{{ states('sensor.solarflow_2_ac_mode') != target_mode or states('input_text.zendure_ac_mode_u2') != target_mode }}"
      - if:
          - condition: template
            value_template: "{{ mode_mismatch and (force_mode or mode_ok) }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_ac_mode_u2 }
            data: { value: "{{ target_mode }}" }
          - action: mqtt.publish
            data: { topic: !secret zendure_topic_u2_select_acMode_set, payload: "{{ target_mode }}", qos: 1 }
