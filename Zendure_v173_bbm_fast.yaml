                  {{ online and fresh and last > 0 }}
            then:
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_last_sent_2 }
                data: { value: 0 }

# ==============================================================================
# 6. AUTOMATISIERUNGEN
# ==============================================================================
automation:
  # --- 5.0 INPUT-LIMIT ACK SYNC ---
  - alias: "Zendure: Sync U1 InputLimit Memory from MQTT"
    id: "zendure_sync_u1_inputlimit_memory_from_mqtt"
    mode: queued
    initial_state: true
    triggers:
      - trigger: state
        entity_id: sensor.solarflow_1_input_limit
        id: "u1_inputlimit_changed"
        for: "00:00:02"
      - trigger: homeassistant
        event: start
        id: "startup"
    conditions:
      - condition: template
        value_template: >
          {% set real = states('sensor.solarflow_1_input_limit') %}
          {% set mem = states('input_number.zendure_last_inputlimit_u1') | int(-1) %}
          {% set hb = states.sensor.solarflow_1_status_raw %}
          {% set hb_ok = hb is not none and hb.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(hb.last_reported, default=0)) < 300 %}
          {{ hb_ok and is_number(real) and (real | int(0)) != mem }}
    actions:
      - action: input_number.set_value
        target: { entity_id: input_number.zendure_last_inputlimit_u1 }
        data:
          value: "{{ [[states('sensor.solarflow_1_input_limit') | int(0),0]|max,800]|min }}"


  - alias: "Zendure: Sync U2 InputLimit Memory from MQTT"
    id: "zendure_sync_u2_inputlimit_memory_from_mqtt"
    mode: queued
    initial_state: true
    triggers:
      - trigger: state
        entity_id: sensor.solarflow_2_input_limit
        id: "u2_inputlimit_changed"
        for: "00:00:02"
      - trigger: homeassistant
        event: start
        id: "startup"
    conditions:
      - condition: template
        value_template: >
          {% set real = states('sensor.solarflow_2_input_limit') %}
          {% set mem = states('input_number.zendure_last_inputlimit_u2') | int(-1) %}
          {% set hb = states.sensor.solarflow_2_status_raw %}
          {% set hb_ok = hb is not none and hb.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(hb.last_reported, default=0)) < 300 %}
          {{ hb_ok and is_number(real) and (real | int(0)) != mem }}
    actions:
      - action: input_number.set_value
        target: { entity_id: input_number.zendure_last_inputlimit_u2 }
        data:
          value: "{{ [[states('sensor.solarflow_2_input_limit') | int(0),0]|max,800]|min }}"

  # --- 5.1 KILL SWITCH ---
  - alias: "Zendure: Safety Kill Switch (Auto-Mode OFF)"
    id: "zendure_safety_kill_switch"
    mode: restart
    initial_state: true
    triggers:
      - trigger: state
        entity_id: input_boolean.zendure_auto_mode
        to: "off"
        id: "off"
      - trigger: state
        entity_id: input_boolean.zendure_auto_mode
        to: "on"
        id: "on"
    actions:
      - if:
          - condition: template
            value_template: "{{ trigger.id == 'on' }}"
        then:
          - stop: "Auto-Mode switched ON. Kill-Switch cancelled."

      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.zendure_emergency_u1
            - input_boolean.zendure_emergency_u2
            - input_boolean.zendure_calib_mode_u1
            - input_boolean.zendure_calib_mode_u2
            - input_boolean.zendure_vguard_u1
            - input_boolean.zendure_vguard_u2
            - input_boolean.zendure_calib_discharge_u1
            - input_boolean.zendure_calib_discharge_u2
            - input_boolean.zendure_force_calib_u1
            - input_boolean.zendure_force_calib_u2

      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.zendure_natural_full_hold_start_u1 }
        data: { timestamp: 0 }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.zendure_natural_balance_start_u1 }
        data: { timestamp: 0 }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.zendure_natural_full_hold_start_u2 }
        data: { timestamp: 0 }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.zendure_natural_balance_start_u2 }
        data: { timestamp: 0 }

      - repeat:
          count: 3
          sequence:
            - condition: state
              entity_id: input_boolean.zendure_auto_mode
              state: "off"

            - parallel:
                - action: script.zendure_reset_u1_output_safe
                - action: script.zendure_reset_u2_output_safe
            - delay: "00:00:01"

# --- 6.0 INITIALIZATION ---
  - alias: "Zendure: Initialize Calibration Timer"
    id: "zendure_init_calib_timer"
    mode: single
    initial_state: true
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - variables:
          ts_now: "{{ as_timestamp(now()) | int(0) }}"
      - if:
          - condition: template
            value_template: >
              {{ states('input_datetime.zendure_last_full_charge_1') in ['unknown', 'unavailable', 'none'] }}
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_full_charge_1 }
            data: { timestamp: "{{ ts_now }}" }
      - if:
          - condition: template
            value_template: >
              {{ states('input_datetime.zendure_last_full_charge_2') in ['unknown', 'unavailable', 'none'] }}
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_full_charge_2 }
            data: { timestamp: "{{ ts_now }}" }
      - if:
          - condition: template
            value_template: >
              {{ as_timestamp(states('input_datetime.zendure_last_full_charge_1'), default=0) < 946684800 }}
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_full_charge_1 }
            data: { timestamp: "{{ ts_now }}" }
      - if:
          - condition: template
            value_template: >
              {{ as_timestamp(states('input_datetime.zendure_last_full_charge_2'), default=0) < 946684800 }}
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_full_charge_2 }
            data: { timestamp: "{{ ts_now }}" }
      - variables:
          soc_off: "{{ states('input_number.zendure_conf_soc_off') | float(20) }}"
          min_out: "{{ states('input_number.zendure_conf_vguard_set_min_output') | float(30) }}"
      - if:
          - condition: state
            entity_id: input_boolean.zendure_vguard_u1
            state: "on"
        then:
          - action: script.zendure_set_u1_outputlimit_zero
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_last_sent_1 }
            data: { value: 0 }
      - if:
          - condition: state
            entity_id: input_boolean.zendure_vguard_u2
            state: "on"
        then:
          - action: script.zendure_set_u2_outputlimit_zero
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_last_sent_2 }
            data: { value: 0 }
      - if:
          - condition: template
            value_template: >
              {% set vmin = states('sensor.solarflow_1_cell_min_vol')|float(99) %}
              {% set soc = states('sensor.solarflow_1_battery_level')|float(100) %}
              {% set out_pwr = states('sensor.solarflow_1_output_power')|float(0) %}
              {% set normal_set = (soc <= (soc_off + 8) and vmin <= 3.02 and out_pwr > min_out) %}
              {% set hard_set = (soc <= (soc_off + 4) and vmin > 2.0 and vmin <= 2.95) %}
              {{ is_state('input_boolean.zendure_auto_mode','on')
                 and is_state('input_boolean.zendure_calib_discharge_u1','off')
                 and is_state('input_boolean.zendure_calib_mode_u1','off')
                 and is_state('input_boolean.zendure_emergency_u1','off')
                 and states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
                 and (normal_set or hard_set) }}
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_vguard_u1 }
          - action: script.zendure_set_u1_outputlimit_zero
      - if:
          - condition: template
            value_template: >
              {% set vmin = states('sensor.solarflow_2_cell_min_vol')|float(99) %}
              {% set soc = states('sensor.solarflow_2_battery_level')|float(100) %}
              {% set out_pwr = states('sensor.solarflow_2_output_power')|float(0) %}
              {% set normal_set = (soc <= (soc_off + 8) and vmin <= 3.02 and out_pwr > min_out) %}
              {% set hard_set = (soc <= (soc_off + 4) and vmin > 2.0 and vmin <= 2.95) %}
              {{ is_state('input_boolean.zendure_auto_mode','on')
                 and is_state('input_boolean.zendure_calib_discharge_u2','off')
                 and is_state('input_boolean.zendure_calib_mode_u2','off')
                 and is_state('input_boolean.zendure_emergency_u2','off')
                 and states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
                 and (normal_set or hard_set) }}
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_vguard_u2 }
          - action: script.zendure_set_u2_outputlimit_zero

  # --- 6.1 CONFIRMED OUTPUT SYNC ON STARTUP ---
  - alias: "Zendure: Sync Confirmed Output on Start"
    id: "zendure_sync_confirmed_on_start"
    initial_state: true
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: "00:00:10"
      - if:
          - condition: template
            value_template: >
              {{ is_number(states('sensor.solarflow_1_output_limit'))
                 and states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
                 and (as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','status_ts'), 0)) < 300
                 and (as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_limit_ts'), 0)) < 30 }}
        then:
          - variables:
              readback_u1: "{{ [[states('sensor.solarflow_1_output_limit')|int(0),0]|max,800]|min }}"
              desired_u1: "{{ states('input_number.zendure_last_sent_1') | int(0) }}"
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_confirmed_output_1 }
            data: { value: "{{ readback_u1 }}" }
          - if:
              - condition: state
                entity_id: input_boolean.zendure_auto_mode
                state: "off"
              - condition: template
                value_template: "{{ readback_u1 != desired_u1 }}"
            then:
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_last_sent_1 }
                data: { value: "{{ readback_u1 }}" }
          - if:
              - condition: template
                value_template: "{{ readback_u1 == desired_u1 or is_state('input_boolean.zendure_auto_mode','off') }}"
            then:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_output_pending_since_u1 }
                data: { datetime: "1970-01-01 00:00:00" }
            else:
              - if:
                  - condition: state
                    entity_id: input_boolean.zendure_auto_mode
                    state: "on"
                  - condition: template
                    value_template: >
                      {{ desired_u1 == 0 or
                         (is_state('input_boolean.zendure_emergency_u1','off') and
                          is_state('input_boolean.zendure_calib_mode_u1','off')) }}
                then:
                  - action: input_datetime.set_datetime
                    target: { entity_id: input_datetime.zendure_output_pending_since_u1 }
                    data: { timestamp: "{{ now().timestamp() }}" }
      - if:
          - condition: template
            value_template: >
              {{ is_number(states('sensor.solarflow_2_output_limit'))
                 and states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
                 and (as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','status_ts'), 0)) < 300
                 and (as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_limit_ts'), 0)) < 30 }}
        then:
          - variables:
              readback_u2: "{{ [[states('sensor.solarflow_2_output_limit')|int(0),0]|max,800]|min }}"
              desired_u2: "{{ states('input_number.zendure_last_sent_2') | int(0) }}"
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_confirmed_output_2 }
            data: { value: "{{ readback_u2 }}" }
          - if:
              - condition: state
                entity_id: input_boolean.zendure_auto_mode
                state: "off"
              - condition: template
                value_template: "{{ readback_u2 != desired_u2 }}"
            then:
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_last_sent_2 }
                data: { value: "{{ readback_u2 }}" }
          - if:
              - condition: template
                value_template: "{{ readback_u2 == desired_u2 or is_state('input_boolean.zendure_auto_mode','off') }}"
            then:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_output_pending_since_u2 }
                data: { datetime: "1970-01-01 00:00:00" }
            else:
              - if:
                  - condition: state
                    entity_id: input_boolean.zendure_auto_mode
                    state: "on"
                  - condition: template
                    value_template: >
                      {{ desired_u2 == 0 or
                         (is_state('input_boolean.zendure_emergency_u2','off') and
                          is_state('input_boolean.zendure_calib_mode_u2','off')) }}
                then:
                  - action: input_datetime.set_datetime
                    target: { entity_id: input_datetime.zendure_output_pending_since_u2 }
                    data: { timestamp: "{{ now().timestamp() }}" }

  # --- 6.2 CONFIRMED OUTPUT READBACK SYNC ---
  - alias: "Zendure: Sync Confirmed Output from MQTT"
    id: "zendure_sync_confirmed_output_from_mqtt"
    mode: queued
    max: 20
    initial_state: true
    triggers:
      - trigger: mqtt
        topic: !secret zendure_topic_u1_number_outputLimit
        id: u1
      - trigger: mqtt
        topic: !secret zendure_topic_u2_number_outputLimit
        id: u2
    conditions:
      - condition: template
        value_template: "{{ trigger.payload is defined and is_number(trigger.payload) }}"
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'u1' }}"
            sequence:
              - variables:
                  readback: "{{ [[trigger.payload|int(0),0]|max,800]|min }}"
                  desired: "{{ states('input_number.zendure_last_sent_1') | int(0) }}"
                  pending_ts: "{{ as_timestamp(states('input_datetime.zendure_output_pending_since_u1'), 0) }}"
                  auto_on: "{{ is_state('input_boolean.zendure_auto_mode','on') }}"
                  status_age: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','status_ts'), 0) }}"
                  status_ok: "{{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and status_age < 300 }}"
              - condition: template
                value_template: "{{ status_ok }}"
              - if:
                  - condition: template
                    value_template: "{{ readback != states('input_number.zendure_confirmed_output_1') | int(-1) }}"
                then:
                  - action: input_number.set_value
                    target: { entity_id: input_number.zendure_confirmed_output_1 }
                    data: { value: "{{ readback }}" }
              - if:
                  - condition: template
                    value_template: "{{ not auto_on }}"
                then:
                  - if:
                      - condition: template
                        value_template: "{{ readback != desired }}"
                    then:
                      - action: input_number.set_value
                        target: { entity_id: input_number.zendure_last_sent_1 }
                        data: { value: "{{ readback }}" }
                  - if:
                      - condition: template
                        value_template: "{{ pending_ts > 1 }}"
                    then:
                      - action: input_datetime.set_datetime
                        target: { entity_id: input_datetime.zendure_output_pending_since_u1 }
                        data: { datetime: "1970-01-01 00:00:00" }
                else:
                  - if:
                      - condition: template
                        value_template: "{{ readback == desired }}"
                    then:
                      - if:
                          - condition: template
                            value_template: "{{ pending_ts > 1 }}"
                        then:
                          - action: input_datetime.set_datetime
                            target: { entity_id: input_datetime.zendure_output_pending_since_u1 }
                            data: { datetime: "1970-01-01 00:00:00" }
                    else:
                      - if:
                          - condition: template
                            value_template: >
                              {{ desired == 0 or
                                 (is_state('input_boolean.zendure_emergency_u1','off') and
                                  is_state('input_boolean.zendure_calib_mode_u1','off')) }}
                          - condition: template
                            value_template: "{{ pending_ts <= 1 }}"
                        then:
                          - action: input_datetime.set_datetime
                            target: { entity_id: input_datetime.zendure_output_pending_since_u1 }
                            data: { timestamp: "{{ now().timestamp() }}" }
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'u2' }}"
            sequence:
              - variables:
                  readback: "{{ [[trigger.payload|int(0),0]|max,800]|min }}"
                  desired: "{{ states('input_number.zendure_last_sent_2') | int(0) }}"
                  pending_ts: "{{ as_timestamp(states('input_datetime.zendure_output_pending_since_u2'), 0) }}"
                  auto_on: "{{ is_state('input_boolean.zendure_auto_mode','on') }}"
                  status_age: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','status_ts'), 0) }}"
                  status_ok: "{{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and status_age < 300 }}"
              - condition: template
                value_template: "{{ status_ok }}"
              - if:
                  - condition: template
                    value_template: "{{ readback != states('input_number.zendure_confirmed_output_2') | int(-1) }}"
                then:
                  - action: input_number.set_value
                    target: { entity_id: input_number.zendure_confirmed_output_2 }
                    data: { value: "{{ readback }}" }
              - if:
                  - condition: template
                    value_template: "{{ not auto_on }}"
                then:
                  - if:
                      - condition: template
                        value_template: "{{ readback != desired }}"
                    then:
                      - action: input_number.set_value
                        target: { entity_id: input_number.zendure_last_sent_2 }
                        data: { value: "{{ readback }}" }
                  - if:
                      - condition: template
                        value_template: "{{ pending_ts > 1 }}"
                    then:
                      - action: input_datetime.set_datetime
                        target: { entity_id: input_datetime.zendure_output_pending_since_u2 }
                        data: { datetime: "1970-01-01 00:00:00" }
                else:
                  - if:
                      - condition: template
                        value_template: "{{ readback == desired }}"
                    then:
                      - if:
                          - condition: template
                            value_template: "{{ pending_ts > 1 }}"
                        then:
                          - action: input_datetime.set_datetime
                            target: { entity_id: input_datetime.zendure_output_pending_since_u2 }
                            data: { datetime: "1970-01-01 00:00:00" }
                    else:
                      - if:
                          - condition: template
                            value_template: >
                              {{ desired == 0 or
                                 (is_state('input_boolean.zendure_emergency_u2','off') and
                                  is_state('input_boolean.zendure_calib_mode_u2','off')) }}
                          - condition: template
                            value_template: "{{ pending_ts <= 1 }}"
                        then:
                          - action: input_datetime.set_datetime
                            target: { entity_id: input_datetime.zendure_output_pending_since_u2 }
                            data: { timestamp: "{{ now().timestamp() }}" }

  # --- 6.2b TRAFFIC-AWARE ACK / EXPORT RECOVERY ---
  - alias: "Zendure: Output ACK Recovery"
    id: "zendure_output_ack_recovery"
    mode: single
    max_exceeded: silent
    initial_state: true
    triggers:
      - trigger: time_pattern
        seconds: "/2"
        id: periodic
      - trigger: state
        entity_id: binary_sensor.solarflow_persistent_export_guard
        to: "on"
        id: persistent_export
      - trigger: state
        entity_id:
          - sensor.solarflow_1_output_limit
          - sensor.solarflow_2_output_limit
        id: readback
    conditions:
      - condition: state
        entity_id: input_boolean.zendure_auto_mode
        state: "on"
    actions:
      - variables:
          now_ts: "{{ as_timestamp(now()) }}"
          export_active: "{{ is_state('binary_sensor.solarflow_persistent_export_guard','on') }}"
          export_episode_ts: "{{ as_timestamp(states.binary_sensor.solarflow_persistent_export_guard.last_changed, 0) }}"
          desired1: "{{ states('input_number.zendure_last_sent_1') | int(0) }}"
          desired2: "{{ states('input_number.zendure_last_sent_2') | int(0) }}"
          confirmed1: "{{ states('input_number.zendure_confirmed_output_1') | int(0) }}"
          confirmed2: "{{ states('input_number.zendure_confirmed_output_2') | int(0) }}"
          dispatched1: "{{ states('input_number.zendure_last_dispatched_1') | int(0) }}"
          dispatched2: "{{ states('input_number.zendure_last_dispatched_2') | int(0) }}"
          pending_ts1: "{{ as_timestamp(states('input_datetime.zendure_output_pending_since_u1'), 0) }}"
          pending_ts2: "{{ as_timestamp(states('input_datetime.zendure_output_pending_since_u2'), 0) }}"
          pending_age1: "{{ now_ts - pending_ts1 if pending_ts1 > 1 else 0 }}"
          pending_age2: "{{ now_ts - pending_ts2 if pending_ts2 > 1 else 0 }}"
          last_dispatch_ts1: "{{ as_timestamp(states('input_datetime.zendure_last_dispatch_ts_u1'), 0) }}"
          last_dispatch_ts2: "{{ as_timestamp(states('input_datetime.zendure_last_dispatch_ts_u2'), 0) }}"
          output_limit_ts1: "{{ as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_limit_ts'), 0) }}"
          output_limit_ts2: "{{ as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_limit_ts'), 0) }}"
          since_dispatch1: "{{ now_ts - last_dispatch_ts1 }}"
          since_dispatch2: "{{ now_ts - last_dispatch_ts2 }}"
          # One fast export retry is followed by a calmer 10s/30s/60s ACK backoff.
          retry_interval1: "{{ 10 if pending_age1 < 60 else 30 if pending_age1 < 300 else 60 }}"
          retry_interval2: "{{ 10 if pending_age2 < 60 else 30 if pending_age2 < 300 else 60 }}"
          status_age1: "{{ now_ts - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','status_ts'), 0) }}"
          status_age2: "{{ now_ts - as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','status_ts'), 0) }}"
          online1: "{{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and status_age1 < 300 }}"
          online2: "{{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and status_age2 < 300 }}"
          busy1: >
            {{ is_state('input_boolean.zendure_emergency_u1','on') or
               is_state('input_boolean.zendure_calib_mode_u1','on') or
               is_state('input_boolean.zendure_vguard_u1','on') or
               is_state('input_boolean.zendure_batt_temp_cooldown_u1','on') or
               is_state('input_boolean.zendure_hub_temp_cooldown_u1','on') }}
          busy2: >
            {{ is_state('input_boolean.zendure_emergency_u2','on') or
               is_state('input_boolean.zendure_calib_mode_u2','on') or
               is_state('input_boolean.zendure_vguard_u2','on') or
               is_state('input_boolean.zendure_batt_temp_cooldown_u2','on') or
               is_state('input_boolean.zendure_hub_temp_cooldown_u2','on') }}
          out_limit_age1: "{{ now_ts - output_limit_ts1 }}"
          out_limit_age2: "{{ now_ts - output_limit_ts2 }}"
          out_power_age1: "{{ now_ts - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_power_ts'), 0) }}"
          out_power_age2: "{{ now_ts - as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_power_ts'), 0) }}"
          actual1: "{{ states('sensor.solarflow_1_output_power') | float(0) }}"
          actual2: "{{ states('sensor.solarflow_2_output_power') | float(0) }}"
          actual_fresh1: "{{ actual1 | int(0) if out_power_age1 < 20 else 0 }}"
          actual_fresh2: "{{ actual2 | int(0) if out_power_age2 < 20 else 0 }}"
          mismatch1: "{{ desired1 != confirmed1 or (pending_ts1 > 1 and output_limit_ts1 < last_dispatch_ts1) }}"
          mismatch2: "{{ desired2 != confirmed2 or (pending_ts2 > 1 and output_limit_ts2 < last_dispatch_ts2) }}"
          retry_allowed1: "{{ not busy1 or desired1 == 0 }}"
          retry_allowed2: "{{ not busy2 or desired2 == 0 }}"
          retry_due1: >
            {{ online1 and retry_allowed1 and mismatch1 and pending_ts1 > 1 and
               pending_age1 >= 10 and since_dispatch1 >= retry_interval1 }}
          retry_due2: >
            {{ online2 and retry_allowed2 and mismatch2 and pending_ts2 > 1 and
               pending_age2 >= 10 and since_dispatch2 >= retry_interval2 }}

          # Online export: at most one immediate retry for the current continuous
          # export episode. All later retries go through retry_dueX above.
          export_problem_online1: >
            {{ export_active and online1 and retry_allowed1 and
               ((out_limit_age1 < 30 and confirmed1 > desired1 + 30) or
                (out_power_age1 < 20 and actual1 > desired1 + 30)) }}
          export_problem_online2: >
            {{ export_active and online2 and retry_allowed2 and
               ((out_limit_age2 < 30 and confirmed2 > desired2 + 30) or
                (out_power_age2 < 20 and actual2 > desired2 + 30)) }}
          last_export_retry_ts1: "{{ as_timestamp(states('input_datetime.zendure_last_export_retry_ts_u1'), 0) }}"
          last_export_retry_ts2: "{{ as_timestamp(states('input_datetime.zendure_last_export_retry_ts_u2'), 0) }}"
          export_immediate_due1: >
            {{ export_problem_online1 and since_dispatch1 >= 3 and export_episode_ts > 1 and
               not is_state('input_boolean.zendure_offline_zero_attempted_u1','on') and
               (last_export_retry_ts1 | int(0)) < (export_episode_ts | int(0)) }}
          export_immediate_due2: >
            {{ export_problem_online2 and since_dispatch2 >= 3 and export_episode_ts > 1 and
               not is_state('input_boolean.zendure_offline_zero_attempted_u2','on') and
               (last_export_retry_ts2 | int(0)) < (export_episode_ts | int(0)) }}

          # Offline export: one best-effort clamp while absent, one fresh clamp
          # after reconnect, then release the latch and return to normal control.
          offline_known_output1: "{{ [desired1, dispatched1, confirmed1, actual_fresh1] | max }}"
          offline_known_output2: "{{ [desired2, dispatched2, confirmed2, actual_fresh2] | max }}"
          offline_zero_attempted1: "{{ is_state('input_boolean.zendure_offline_zero_attempted_u1','on') }}"
          offline_zero_attempted2: "{{ is_state('input_boolean.zendure_offline_zero_attempted_u2','on') }}"
          offline_zero_due1: >
            {{ export_active and not online1 and offline_known_output1 > 0 and not offline_zero_attempted1 }}
          offline_zero_due2: >
            {{ export_active and not online2 and offline_known_output2 > 0 and not offline_zero_attempted2 }}
          reconnect_zero_due1: "{{ online1 and offline_zero_attempted1 }}"
          reconnect_zero_due2: "{{ online2 and offline_zero_attempted2 }}"

          # AC mode is not bundled with every output retry. The first re-assert
          # occurs after ~20s; later sends require a real mismatch (20s guard) or
          # the 5-minute keepalive interval.
          ac_mode_state1: "{{ states('sensor.solarflow_1_ac_mode') | lower }}"
          ac_mode_state2: "{{ states('sensor.solarflow_2_ac_mode') | lower }}"
          ac_mode_mismatch1: "{{ ac_mode_state1 not in ['output mode','unknown','unavailable','none',''] }}"
          ac_mode_mismatch2: "{{ ac_mode_state2 not in ['output mode','unknown','unavailable','none',''] }}"
          last_ac_mode_ts1: "{{ as_timestamp(states('input_datetime.zendure_last_ac_mode_dispatch_ts_u1'), 0) }}"
          last_ac_mode_ts2: "{{ as_timestamp(states('input_datetime.zendure_last_ac_mode_dispatch_ts_u2'), 0) }}"
          since_ac_mode1: "{{ now_ts - last_ac_mode_ts1 }}"
          since_ac_mode2: "{{ now_ts - last_ac_mode_ts2 }}"
          ac_mode_first_due1: "{{ pending_ts1 > 1 and pending_age1 >= 20 and last_ac_mode_ts1 < pending_ts1 }}"
          ac_mode_first_due2: "{{ pending_ts2 > 1 and pending_age2 >= 20 and last_ac_mode_ts2 < pending_ts2 }}"
          ac_mode_mismatch_due1: "{{ pending_age1 >= 20 and ac_mode_mismatch1 and since_ac_mode1 >= 20 }}"
          ac_mode_mismatch_due2: "{{ pending_age2 >= 20 and ac_mode_mismatch2 and since_ac_mode2 >= 20 }}"
          ac_mode_keepalive_due1: "{{ pending_age1 >= 20 and since_ac_mode1 >= 300 }}"
          ac_mode_keepalive_due2: "{{ pending_age2 >= 20 and since_ac_mode2 >= 300 }}"
          ac_mode_send_due1: >
            {{ online1 and not busy1 and
               (ac_mode_first_due1 or ac_mode_mismatch_due1 or ac_mode_keepalive_due1) }}
          ac_mode_send_due2: >
            {{ online2 and not busy2 and
               (ac_mode_first_due2 or ac_mode_mismatch_due2 or ac_mode_keepalive_due2) }}
          ac_mode_force_reassert1: "{{ ac_mode_first_due1 or ac_mode_keepalive_due1 }}"
          ac_mode_force_reassert2: "{{ ac_mode_first_due2 or ac_mode_keepalive_due2 }}"

          pair_send1: "{{ retry_due1 or export_immediate_due1 }}"
          pair_send2: "{{ retry_due2 or export_immediate_due2 }}"
          generation_next: "{{ ((as_timestamp(now()) * 1000000) | int) % 1000000000 }}"

      # Mark one-shot guards before launching the non-blocking pair dispatcher.
      - parallel:
          - if:
              - condition: template
                value_template: "{{ export_immediate_due1 or (reconnect_zero_due1 and export_active) }}"
            then:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_last_export_retry_ts_u1 }
                data: { timestamp: "{{ now().timestamp() }}" }
          - if:
              - condition: template
                value_template: "{{ export_immediate_due2 or (reconnect_zero_due2 and export_active) }}"
            then:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_last_export_retry_ts_u2 }
                data: { timestamp: "{{ now().timestamp() }}" }
          - if:
              - condition: template
                value_template: "{{ offline_zero_due1 }}"
            then:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_offline_zero_attempted_u1 }
          - if:
              - condition: template
                value_template: "{{ offline_zero_due2 }}"
            then:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_offline_zero_attempted_u2 }

      # Offline/reconnect clamps are direct lowering commands. They bypass the
      # generation race deliberately: a 0W safety write must not be cancelled by
      # a newer normal-control generation while the unit is reconnecting.
      - parallel:
          - if:
              - condition: template
                value_template: "{{ offline_zero_due1 or reconnect_zero_due1 }}"
            then:
              - action: script.zendure_dispatch_u1_output
                data:
                  power: 0
                  ensure_output_mode: false
                  force: true
              - if:
                  - condition: template
                    value_template: "{{ reconnect_zero_due1 }}"
                then:
                  - action: input_boolean.turn_off
                    target: { entity_id: input_boolean.zendure_offline_zero_attempted_u1 }
          - if:
              - condition: template
                value_template: "{{ offline_zero_due2 or reconnect_zero_due2 }}"
            then:
              - action: script.zendure_dispatch_u2_output
                data:
                  power: 0
                  ensure_output_mode: false
                  force: true
              - if:
                  - condition: template
                    value_template: "{{ reconnect_zero_due2 }}"
                then:
                  - action: input_boolean.turn_off
                    target: { entity_id: input_boolean.zendure_offline_zero_attempted_u2 }

      - if:
          - condition: template
            value_template: "{{ pair_send1 or pair_send2 }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_dispatch_generation }
            data: { value: "{{ generation_next }}" }
          - action: script.turn_on
            target: { entity_id: script.zendure_dispatch_output_pair }
            data:
              variables:
                target_1: "{{ desired1 }}"
                target_2: "{{ desired2 }}"
                send_1: "{{ pair_send1 }}"
                send_2: "{{ pair_send2 }}"
                force_1: true
                force_2: true
                ensure_mode_1: "{{ ac_mode_send_due1 }}"
                ensure_mode_2: "{{ ac_mode_send_due2 }}"
                reassert_mode_1: "{{ ac_mode_force_reassert1 }}"
                reassert_mode_2: "{{ ac_mode_force_reassert2 }}"
                generation: "{{ generation_next }}"

  # --- 6.3 BYPASS LATCH MANAGER ---
  - alias: "Zendure: Bypass Latch Manager"
    id: "zendure_bypass_latch_manager"
    mode: single
    initial_state: true
    triggers:
      - trigger: state
        entity_id:
          - sensor.solarflow_1_battery_level
          - sensor.solarflow_2_battery_level
          - sensor.solarflow_1_cell_min_vol
          - sensor.solarflow_2_cell_min_vol
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - input_number.zendure_conf_soc_off
          - input_number.zendure_conf_soc_bypass
          - input_boolean.zendure_auto_mode
    actions:
      - variables:
          soc_stop: "{{ states('input_number.zendure_conf_soc_off') | float(20) }}"
          soc_exit: >
            {{ [states('input_number.zendure_conf_soc_bypass') | float(25),
                (states('input_number.zendure_conf_soc_off') | float(20)) + 3] | max }}
          vmin_stop: 3.12
          vmin_release: 3.20
          auto_on: "{{ is_state('input_boolean.zendure_auto_mode','on') }}"

          soc1_ok: "{{ is_number(states('sensor.solarflow_1_battery_level')) }}"
          soc2_ok: "{{ is_number(states('sensor.solarflow_2_battery_level')) }}"
          v1_ok: "{{ is_number(states('sensor.solarflow_1_cell_min_vol')) }}"
          v2_ok: "{{ is_number(states('sensor.solarflow_2_cell_min_vol')) }}"
          soc1: "{{ states('sensor.solarflow_1_battery_level') | float(0) }}"
          soc2: "{{ states('sensor.solarflow_2_battery_level') | float(0) }}"
          v1_min: "{{ states('sensor.solarflow_1_cell_min_vol') | float(99) }}"
          v2_min: "{{ states('sensor.solarflow_2_cell_min_vol') | float(99) }}"
          u1_busy: "{{ is_state('input_boolean.zendure_emergency_u1','on') or is_state('input_boolean.zendure_vguard_u1','on') or is_state('input_boolean.zendure_calib_mode_u1','on') or is_state('input_boolean.zendure_calib_discharge_u1','on') }}"
          u2_busy: "{{ is_state('input_boolean.zendure_emergency_u2','on') or is_state('input_boolean.zendure_vguard_u2','on') or is_state('input_boolean.zendure_calib_mode_u2','on') or is_state('input_boolean.zendure_calib_discharge_u2','on') }}"

      # Auto-Mode OFF: Latches sauber zurücksetzen.
      - if:
          - condition: template
            value_template: "{{ not (auto_on | bool) }}"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.zendure_bypass_u1
                - input_boolean.zendure_bypass_u2
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_bypass_reason_u1 }
            data: { value: "none" }
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_bypass_reason_u2 }
            data: { value: "none" }

      # Unit 1: Stopp wegen SoC-Off.
      - if:
          - condition: template
            value_template: >
              {{ auto_on|bool
                 and soc1_ok|bool
                 and not (u1_busy|bool)
                 and soc1 <= soc_stop
                 and not (is_state('input_boolean.zendure_bypass_u1','on') and states('input_text.zendure_bypass_reason_u1') == 'vmin_early_stop') }}
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_bypass_u1 }
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_bypass_reason_u1 }
            data: { value: "soc_off_stop" }

      # Unit 1: Früher Stopp wegen Zellspannung im unteren SoC-Fenster.
      - if:
          - condition: template
            value_template: >
              {{ auto_on|bool
                 and soc1_ok|bool
                 and v1_ok|bool
                 and not (u1_busy|bool)
                 and soc1 > soc_stop
                 and soc1 <= (soc_stop + 8)
                 and v1_min > 2.0
                 and v1_min < vmin_stop }}
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_bypass_u1 }
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_bypass_reason_u1 }
            data: { value: "vmin_early_stop" }

      - if:
          - condition: template
            value_template: >
              {{ auto_on|bool
                 and is_state('input_boolean.zendure_bypass_u1','on')
                 and soc1_ok|bool
                 and soc1 >= (soc_exit | float(25))
                 and (states('input_text.zendure_bypass_reason_u1') != 'vmin_early_stop' or (v1_ok|bool and v1_min >= vmin_release)) }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_bypass_u1 }
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_bypass_reason_u1 }
            data: { value: "none" }

      # Unit 2: Stopp wegen SoC-Off.
      - if:
          - condition: template
            value_template: >
              {{ auto_on|bool
                 and soc2_ok|bool
                 and not (u2_busy|bool)
                 and soc2 <= soc_stop
                 and not (is_state('input_boolean.zendure_bypass_u2','on') and states('input_text.zendure_bypass_reason_u2') == 'vmin_early_stop') }}
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_bypass_u2 }
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_bypass_reason_u2 }
            data: { value: "soc_off_stop" }

      # Unit 2: Früher Stopp wegen Zellspannung im unteren SoC-Fenster.
      - if:
          - condition: template
            value_template: >
              {{ auto_on|bool
                 and soc2_ok|bool
                 and v2_ok|bool
                 and not (u2_busy|bool)
                 and soc2 > soc_stop
                 and soc2 <= (soc_stop + 8)
                 and v2_min > 2.0
                 and v2_min < vmin_stop }}
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_bypass_u2 }
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_bypass_reason_u2 }
            data: { value: "vmin_early_stop" }

      - if:
          - condition: template
            value_template: >
              {{ auto_on|bool
                 and is_state('input_boolean.zendure_bypass_u2','on')
                 and soc2_ok|bool
                 and soc2 >= (soc_exit | float(25))
                 and (states('input_text.zendure_bypass_reason_u2') != 'vmin_early_stop' or (v2_ok|bool and v2_min >= vmin_release)) }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_bypass_u2 }
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_bypass_reason_u2 }
            data: { value: "none" }
  # --- 6.3b TEMPERATURE COOLDOWN LATCH ---
  - alias: "Zendure: Battery and Hub Temperature Cooldown Latch"
    id: "zendure_temp_cooldown_latch"
    mode: queued
    initial_state: true
    triggers:
      - trigger: homeassistant
        event: start
        id: "startup"
      - trigger: time_pattern
        minutes: "/2"
        id: "periodic"

      - trigger: template
        id: "batt_set_u1"
        value_template: >
          {{ has_value('sensor.solarflow_1_battery_temp_control')
             and states('sensor.solarflow_1_battery_temp_control') | float(0) >= 58
             and is_state('input_boolean.zendure_batt_temp_cooldown_u1','off') }}
        for: "00:00:30"
      - trigger: template
        id: "batt_clear_u1"
        value_template: >
          {{ has_value('sensor.solarflow_1_battery_temp_control')
             and states('sensor.solarflow_1_battery_temp_control') | float(99) <= 55
             and is_state('input_boolean.zendure_batt_temp_cooldown_u1','on') }}
        for: "00:05:00"
      - trigger: template
        id: "batt_set_u2"
        value_template: >
          {{ has_value('sensor.solarflow_2_battery_temp_control')
             and states('sensor.solarflow_2_battery_temp_control') | float(0) >= 58
             and is_state('input_boolean.zendure_batt_temp_cooldown_u2','off') }}
        for: "00:00:30"
      - trigger: template
        id: "batt_clear_u2"
        value_template: >
          {{ has_value('sensor.solarflow_2_battery_temp_control')
             and states('sensor.solarflow_2_battery_temp_control') | float(99) <= 55
             and is_state('input_boolean.zendure_batt_temp_cooldown_u2','on') }}
        for: "00:05:00"

      - trigger: template
        id: "hub_set_u1"
        value_template: >
          {{ has_value('sensor.solarflow_1_hub_temp_control')
             and states('sensor.solarflow_1_hub_temp_control') | float(0) >= 65
             and is_state('input_boolean.zendure_hub_temp_cooldown_u1','off') }}
        for: "00:00:30"
      - trigger: template
        id: "hub_clear_u1"
        value_template: >
          {{ has_value('sensor.solarflow_1_hub_temp_control')
             and states('sensor.solarflow_1_hub_temp_control') | float(99) <= 62
             and is_state('input_boolean.zendure_hub_temp_cooldown_u1','on') }}
        for: "00:05:00"
      - trigger: template
        id: "hub_set_u2"
        value_template: >
          {{ has_value('sensor.solarflow_2_hub_temp_control')
             and states('sensor.solarflow_2_hub_temp_control') | float(0) >= 65
             and is_state('input_boolean.zendure_hub_temp_cooldown_u2','off') }}
        for: "00:00:30"
      - trigger: template
        id: "hub_clear_u2"
        value_template: >
          {{ has_value('sensor.solarflow_2_hub_temp_control')
             and states('sensor.solarflow_2_hub_temp_control') | float(99) <= 62
             and is_state('input_boolean.zendure_hub_temp_cooldown_u2','on') }}
        for: "00:05:00"

    actions:
      - variables:
          batt1_valid: "{{ has_value('sensor.solarflow_1_battery_temp_control') }}"
          batt2_valid: "{{ has_value('sensor.solarflow_2_battery_temp_control') }}"
          hub1_valid: "{{ has_value('sensor.solarflow_1_hub_temp_control') }}"
          hub2_valid: "{{ has_value('sensor.solarflow_2_hub_temp_control') }}"
          batt1: "{{ states('sensor.solarflow_1_battery_temp_control') | float(999) }}"
          batt2: "{{ states('sensor.solarflow_2_battery_temp_control') | float(999) }}"
          hub1: "{{ states('sensor.solarflow_1_hub_temp_control') | float(999) }}"
          hub2: "{{ states('sensor.solarflow_2_hub_temp_control') | float(999) }}"

      # U1 battery cooldown: battery >=58°C means no charging and no output until <=55°C.
      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'batt_set_u1'
                 or (trigger.id in ['startup','periodic']
                     and batt1_valid | bool
                     and batt1 | float(999) >= 58
                     and is_state('input_boolean.zendure_batt_temp_cooldown_u1','off')) }}
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_batt_temp_cooldown_u1 }
          - action: script.zendure_dispatch_u1_inputlimit
            data:
              power: 0
              force: true
          - action: script.zendure_dispatch_u1_chargelimit
            data:
              power: "0"
              force: true
          - action: script.zendure_dispatch_u1_ac_mode
            data:
              mode: "Output mode"
              force: true
          - action: script.zendure_set_u1_outputlimit_zero
          - if:
              - condition: template
                value_template: "{{ trigger.id == 'batt_set_u1' }}"
            then:
              - action: notify.send_message
                target: { entity_id: !secret telegram_id1 }
                data:
                  message: >
                    🚨 *Battery Temp Cooldown U1*\nBatterie >=58°C – InputLimit, ChargeMaxLimit und Output werden gestoppt bis <=55°C.

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'batt_clear_u1'
                 or (trigger.id == 'startup'
                     and batt1_valid | bool
                     and batt1 | float(999) <= 55
                     and is_state('input_boolean.zendure_batt_temp_cooldown_u1','on')) }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_batt_temp_cooldown_u1 }
          - if:
              - condition: template
                value_template: "{{ trigger.id == 'batt_clear_u1' }}"
            then:
              - action: notify.send_message
                target: { entity_id: !secret telegram_id1 }
                data:
                  message: >
                    ✅ *Battery Temp Cooldown U1 beendet*\nBatterie <=55°C für 5 Minuten.

      # U2 battery cooldown: battery >=58°C means no charging and no output until <=55°C.
      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'batt_set_u2'
                 or (trigger.id in ['startup','periodic']
                     and batt2_valid | bool
                     and batt2 | float(999) >= 58
                     and is_state('input_boolean.zendure_batt_temp_cooldown_u2','off')) }}
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_batt_temp_cooldown_u2 }
          - action: script.zendure_dispatch_u2_inputlimit
            data:
              power: 0
              force: true
          - action: script.zendure_dispatch_u2_chargelimit
            data:
              power: "0"
              force: true
          - action: script.zendure_dispatch_u2_ac_mode
            data:
              mode: "Output mode"
              force: true
          - action: script.zendure_set_u2_outputlimit_zero
          - if:
              - condition: template
                value_template: "{{ trigger.id == 'batt_set_u2' }}"
            then:
              - action: notify.send_message
                target: { entity_id: !secret telegram_id1 }
                data:
                  message: >
                    🚨 *Battery Temp Cooldown U2*\nBatterie >=58°C – InputLimit, ChargeMaxLimit und Output werden gestoppt bis <=55°C.

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'batt_clear_u2'
                 or (trigger.id == 'startup'
                     and batt2_valid | bool
                     and batt2 | float(999) <= 55
                     and is_state('input_boolean.zendure_batt_temp_cooldown_u2','on')) }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_batt_temp_cooldown_u2 }
          - if:
              - condition: template
                value_template: "{{ trigger.id == 'batt_clear_u2' }}"
            then:
              - action: notify.send_message
                target: { entity_id: !secret telegram_id1 }
                data:
                  message: >
                    ✅ *Battery Temp Cooldown U2 beendet*\nBatterie <=55°C für 5 Minuten.

      # U1 hub/inverter cooldown: hub >=65°C means true cooldown: no output and no charging until <=62°C.
      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'hub_set_u1'
                 or (trigger.id in ['startup','periodic']
                     and hub1_valid | bool
                     and hub1 | float(999) >= 65
                     and is_state('input_boolean.zendure_hub_temp_cooldown_u1','off')) }}
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_hub_temp_cooldown_u1 }
          - action: script.zendure_dispatch_u1_inputlimit
            data:
              power: 0
              force: true
          - action: script.zendure_dispatch_u1_chargelimit
            data:
              power: "0"
              force: true
          - action: script.zendure_dispatch_u1_ac_mode
            data:
              mode: "Output mode"
              force: true
          - action: script.zendure_set_u1_outputlimit_zero
          - if:
              - condition: template
                value_template: "{{ trigger.id == 'hub_set_u1' }}"
            then:
              - action: notify.send_message
                target: { entity_id: !secret telegram_id1 }
                data:
                  message: >
                    🚨 *Hub/WR Temp Cooldown U1*\nHub/WR >=65°C – InputLimit, ChargeMaxLimit und Output werden gestoppt bis <=62°C.

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'hub_clear_u1'
                 or (trigger.id == 'startup'
                     and hub1_valid | bool
                     and hub1 | float(999) <= 62
                     and is_state('input_boolean.zendure_hub_temp_cooldown_u1','on')) }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_hub_temp_cooldown_u1 }
          - if:
              - condition: template
                value_template: "{{ trigger.id == 'hub_clear_u1' }}"
            then:
              - action: notify.send_message
                target: { entity_id: !secret telegram_id1 }
                data:
                  message: >
                    ✅ *Hub/WR Temp Cooldown U1 beendet*\nHub/WR <=62°C für 5 Minuten.

      # U2 hub/inverter cooldown: hub >=65°C means true cooldown: no output and no charging until <=62°C.
      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'hub_set_u2'
                 or (trigger.id in ['startup','periodic']
                     and hub2_valid | bool
                     and hub2 | float(999) >= 65
                     and is_state('input_boolean.zendure_hub_temp_cooldown_u2','off')) }}
        then:
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_hub_temp_cooldown_u2 }
          - action: script.zendure_dispatch_u2_inputlimit
            data:
              power: 0
              force: true
          - action: script.zendure_dispatch_u2_chargelimit
            data:
              power: "0"
              force: true
          - action: script.zendure_dispatch_u2_ac_mode
            data:
              mode: "Output mode"
              force: true
          - action: script.zendure_set_u2_outputlimit_zero
          - if:
              - condition: template
                value_template: "{{ trigger.id == 'hub_set_u2' }}"
            then:
              - action: notify.send_message
                target: { entity_id: !secret telegram_id1 }
                data:
                  message: >
                    🚨 *Hub/WR Temp Cooldown U2*\nHub/WR >=65°C – InputLimit, ChargeMaxLimit und Output werden gestoppt bis <=62°C.

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'hub_clear_u2'
                 or (trigger.id == 'startup'
                     and hub2_valid | bool
                     and hub2 | float(999) <= 62
                     and is_state('input_boolean.zendure_hub_temp_cooldown_u2','on')) }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_hub_temp_cooldown_u2 }
          - if:
              - condition: template
                value_template: "{{ trigger.id == 'hub_clear_u2' }}"
            then:
              - action: notify.send_message
                target: { entity_id: !secret telegram_id1 }
                data:
                  message: >
                    ✅ *Hub/WR Temp Cooldown U2 beendet*\nHub/WR <=62°C für 5 Minuten.
  - alias: "Zendure: Guard Layer (Advanced)"
    id: "zendure_guard_layer"
    mode: restart
    initial_state: true
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        seconds: "/2"
        id: periodic
      - trigger: numeric_state
        entity_id: sensor.zendure_grid_power
        above: 150
        for: "00:00:01"
        id: import_spike
      - trigger: numeric_state
        entity_id: sensor.zendure_grid_power
        below: -30
        for: "00:00:01"
        id: export_spike
      - trigger: state
        entity_id: sensor.zendure_grid_power
        id: meter_step
      # Recalculate immediately after a protected pair transfer has completed.
      # New ordinary targets are held while the pair dispatcher is busy.
      - trigger: state
        entity_id: script.zendure_dispatch_output_pair
        from: "on"
        to: "off"
        id: pair_done
      - trigger: state
        entity_id:
          - input_boolean.zendure_bypass_u1
          - input_boolean.zendure_bypass_u2
        id: mode_change
      - trigger: state
        entity_id:
          - input_boolean.zendure_auto_mode
          - input_boolean.zendure_emergency_u1
          - input_boolean.zendure_emergency_u2
          - input_boolean.zendure_calib_mode_u1
          - input_boolean.zendure_calib_mode_u2
          - input_boolean.zendure_vguard_u1
          - input_boolean.zendure_vguard_u2
          - input_boolean.zendure_calib_discharge_u1
          - input_boolean.zendure_calib_discharge_u2
          - input_boolean.zendure_force_calib_u1
          - input_boolean.zendure_force_calib_u2
          - input_boolean.zendure_batt_temp_cooldown_u1
          - input_boolean.zendure_batt_temp_cooldown_u2
          - input_boolean.zendure_hub_temp_cooldown_u1
          - input_boolean.zendure_hub_temp_cooldown_u2
          - input_number.zendure_conf_max_output_per_unit
          - input_number.zendure_conf_max_output
        id: safety_change
    actions:
      - if:
          - condition: state
            entity_id: input_boolean.zendure_auto_mode
            state: "off"
        then:
          - stop: "Auto Mode is OFF - Loop aborted."
      - variables:
          quick_jump: >-
            {% if trigger.id == 'meter_step' and trigger.from_state is not none and trigger.to_state is not none and is_number(trigger.from_state.state) and is_number(trigger.to_state.state) %}
              {{ ((trigger.to_state.state | float(0)) - (trigger.from_state.state | float(0))) | abs }}
            {% else %}
              0
            {% endif %}
      - if:
          - condition: template
            value_template: "{{ trigger.id == 'meter_step' and (quick_jump | float(0)) < 15 }}"
        then:
          - stop: "Meter step too small - skip full loop."

      - variables:
          power_meter_entity: sensor.zendure_grid_power
          shelly_ok: >-
            {% set s = states.sensor.zendure_grid_power %}
            {{ s is not none and s.state|upper not in ['UNAVAILABLE','UNKNOWN','NONE'] and is_number(s.state) }}

          status_age_1: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','status_ts'), 0) }}"
          status_age_2: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','status_ts'), 0) }}"
          output_age_1: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_power_ts'), 0) }}"
          output_age_2: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_power_ts'), 0) }}"
          output_limit_age_1: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_limit_ts'), 0) }}"
          output_limit_age_2: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_limit_ts'), 0) }}"
          solar_age_1: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','solar_ts'), 0) }}"
          solar_age_2: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','solar_ts'), 0) }}"
          soc_age_1: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','soc_ts'), 0) }}"
          soc_age_2: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','soc_ts'), 0) }}"
          vmin_age_1: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','vmin_valid_ts'), 0) }}"
          vmin_age_2: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','vmin_valid_ts'), 0) }}"
          battery_temp_age_1: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','battery_temp_valid_ts'), 0) }}"
          battery_temp_age_2: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','battery_temp_valid_ts'), 0) }}"
          hub_temp_age_1: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','hub_temp_valid_ts'), 0) }}"
          hub_temp_age_2: "{{ as_timestamp(now()) - as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','hub_temp_valid_ts'), 0) }}"

          s1_fresh: >-
            {{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
               and status_age_1 | float(9999) < 300 }}
          s2_fresh: >-
            {{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
               and status_age_2 | float(9999) < 300 }}

          v1_min_ok: "{{ is_number(states('sensor.solarflow_1_cell_min_vol')) and vmin_age_1 | float(9999) < 300 }}"
          v2_min_ok: "{{ is_number(states('sensor.solarflow_2_cell_min_vol')) and vmin_age_2 | float(9999) < 300 }}"
          v1_min: "{{ states('sensor.solarflow_1_cell_min_vol') | float(0) if v1_min_ok | bool else 0 }}"
          v2_min: "{{ states('sensor.solarflow_2_cell_min_vol') | float(0) if v2_min_ok | bool else 0 }}"
          batt_t1_valid: "{{ is_number(states('sensor.solarflow_1_battery_temp_control')) and battery_temp_age_1 | float(9999) < 300 }}"
          batt_t2_valid: "{{ is_number(states('sensor.solarflow_2_battery_temp_control')) and battery_temp_age_2 | float(9999) < 300 }}"
          hub_t1_valid: "{{ is_number(states('sensor.solarflow_1_hub_temp_control')) and hub_temp_age_1 | float(9999) < 300 }}"
          hub_t2_valid: "{{ is_number(states('sensor.solarflow_2_hub_temp_control')) and hub_temp_age_2 | float(9999) < 300 }}"
          batt_t1_raw: "{{ states('sensor.solarflow_1_battery_temp_control') | float(999) }}"
          batt_t2_raw: "{{ states('sensor.solarflow_2_battery_temp_control') | float(999) }}"
          hub_t1_raw: "{{ states('sensor.solarflow_1_hub_temp_control') | float(999) }}"
          hub_t2_raw: "{{ states('sensor.solarflow_2_hub_temp_control') | float(999) }}"
          t1_raw: "{{ [batt_t1_raw | float(999), hub_t1_raw | float(999)] | max if batt_t1_valid|bool and hub_t1_valid|bool else 999 }}"
          t2_raw: "{{ [batt_t2_raw | float(999), hub_t2_raw | float(999)] | max if batt_t2_valid|bool and hub_t2_valid|bool else 999 }}"
          soc1_raw: "{{ states('sensor.solarflow_1_battery_level') | float(-1) if soc_age_1 | float(9999) < 300 else -1 }}"
          soc2_raw: "{{ states('sensor.solarflow_2_battery_level') | float(-1) if soc_age_2 | float(9999) < 300 else -1 }}"

          s1_plausible: >-
            {{ batt_t1_valid and hub_t1_valid and t1_raw < 100
               and v1_min_ok | bool and v1_min > 2.0 and soc1_raw >= 0 }}
          s2_plausible: >-
            {{ batt_t2_valid and hub_t2_valid and t2_raw < 100
               and v2_min_ok | bool and v2_min > 2.0 and soc2_raw >= 0 }}

          s1_ok: "{{ s1_fresh | bool and s1_plausible | bool }}"
          s2_ok: "{{ s2_fresh | bool and s2_plausible | bool }}"
          pv_u1_recent: >-
            {% set sol = states.sensor.solarflow_1_solar_input %}
            {{ s1_fresh | bool and solar_age_1 | float(9999) < 60 and sol is not none and is_number(sol.state) and (sol.state | float(-1)) >= 0 }}
          pv_u2_recent: >-
            {% set sol = states.sensor.solarflow_2_solar_input %}
            {{ s2_fresh | bool and solar_age_2 | float(9999) < 60 and sol is not none and is_number(sol.state) and (sol.state | float(-1)) >= 0 }}

          t1: "{{ t1_raw if s1_ok | bool else 99 }}"
          t2: "{{ t2_raw if s2_ok | bool else 99 }}"
          batt_t1: "{{ batt_t1_raw if s1_ok | bool else 999 }}"
          batt_t2: "{{ batt_t2_raw if s2_ok | bool else 999 }}"
          hub_t1: "{{ hub_t1_raw if s1_ok | bool else 999 }}"
          hub_t2: "{{ hub_t2_raw if s2_ok | bool else 999 }}"
          soc1_val: "{{ soc1_raw if s1_ok | bool else 0 }}"
          soc2_val: "{{ soc2_raw if s2_ok | bool else 0 }}"
          soc1_valid: "{{ s1_ok | bool }}"
          soc2_valid: "{{ s2_ok | bool }}"

          s1_desired: "{{ [states('input_number.zendure_last_sent_1')|float(0)|int, 0]|max }}"
          s2_desired: "{{ [states('input_number.zendure_last_sent_2')|float(0)|int, 0]|max }}"
          s1_dispatched: "{{ [states('input_number.zendure_last_dispatched_1')|float(0)|int, 0]|max }}"
          s2_dispatched: "{{ [states('input_number.zendure_last_dispatched_2')|float(0)|int, 0]|max }}"
          s1_confirmed: "{{ [states('input_number.zendure_confirmed_output_1')|float(0)|int, 0]|max }}"
          s2_confirmed: "{{ [states('input_number.zendure_confirmed_output_2')|float(0)|int, 0]|max }}"
          s1_base: "{{ s1_desired | int(0) }}"
          s2_base: "{{ s2_desired | int(0) }}"
          s1_out_val: "{{ s1_confirmed | int(0) }}"
          s2_out_val: "{{ s2_confirmed | int(0) }}"

          last_dispatch_1_ts: "{{ as_timestamp(states('input_datetime.zendure_last_dispatch_ts_u1'), 0) }}"
          last_dispatch_2_ts: "{{ as_timestamp(states('input_datetime.zendure_last_dispatch_ts_u2'), 0) }}"
          pending_since_1_ts: "{{ as_timestamp(states('input_datetime.zendure_output_pending_since_u1'), 0) }}"
          pending_since_2_ts: "{{ as_timestamp(states('input_datetime.zendure_output_pending_since_u2'), 0) }}"
          time_since_1: "{{ as_timestamp(now()) - last_dispatch_1_ts }}"
          time_since_2: "{{ as_timestamp(now()) - last_dispatch_2_ts }}"
          pending_age_1: "{{ as_timestamp(now()) - pending_since_1_ts if pending_since_1_ts > 1 else 0 }}"
          pending_age_2: "{{ as_timestamp(now()) - pending_since_2_ts if pending_since_2_ts > 1 else 0 }}"

          ack_pending_1: >-
            {{ pending_since_1_ts > 1 and
               (s1_out_val != s1_base or
                as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_limit_ts'), 0) < last_dispatch_1_ts) }}
          ack_pending_2: >-
            {{ pending_since_2_ts > 1 and
               (s2_out_val != s2_base or
                as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_limit_ts'), 0) < last_dispatch_2_ts) }}
          soc_off: "{{ states('input_number.zendure_conf_soc_off') | int(20) }}"
          hysteresis: "{{ states('input_number.zendure_conf_hysteresis') | int(10) }}"

          bypass1: "{{ is_state('input_boolean.zendure_bypass_u1','on') }}"
          bypass2: "{{ is_state('input_boolean.zendure_bypass_u2','on') }}"
          s1_solar: "{{ states('sensor.solarflow_1_solar_input') | float(0) if pv_u1_recent | bool else 0 }}"
          s2_solar: "{{ states('sensor.solarflow_2_solar_input') | float(0) if pv_u2_recent | bool else 0 }}"
          s1_solar_avg: "{{ states('sensor.zendure_u1_pv_mean_20s') | float(s1_solar|float(0)) }}"
          s2_solar_avg: "{{ states('sensor.zendure_u2_pv_mean_20s') | float(s2_solar|float(0)) }}"
          batt_temp_cooldown_u1: "{{ is_state('input_boolean.zendure_batt_temp_cooldown_u1','on') }}"
          batt_temp_cooldown_u2: "{{ is_state('input_boolean.zendure_batt_temp_cooldown_u2','on') }}"
          hub_temp_cooldown_u1: "{{ is_state('input_boolean.zendure_hub_temp_cooldown_u1','on') }}"
          hub_temp_cooldown_u2: "{{ is_state('input_boolean.zendure_hub_temp_cooldown_u2','on') }}"
          unit_max: >-
            {{ [[states('input_number.zendure_conf_max_output_per_unit') | int(800), 0] | max, 800] | min }}
          configured_global_max: "{{ [[states('input_number.zendure_conf_max_output') | int(900), 0] | max, 1000] | min }}"
          global_max: >-
            {{ [configured_global_max | int(900), (unit_max | int(800)) * 2] | min }}
          batt_temp_cap_u1: >-
            {% set pv = (s1_solar * 0.9) | int(0) %}
            {% set bt = batt_t1 | float(999) %}
            {% if batt_temp_cooldown_u1 | bool or bt >= 58 %}0
            {% elif bt >= 55 %}{{ pv }}
            {% elif bt >= 53 %}{{ [300, pv + 75] | min }}
            {% elif bt >= 50 %}{{ [500, pv + 150] | min }}
            {% elif bt < 0 %}0
            {% else %}800{% endif %}
          batt_temp_cap_u2: >-
            {% set pv = (s2_solar * 0.9) | int(0) %}
            {% set bt = batt_t2 | float(999) %}
            {% if batt_temp_cooldown_u2 | bool or bt >= 58 %}0
            {% elif bt >= 55 %}{{ pv }}
            {% elif bt >= 53 %}{{ [300, pv + 75] | min }}
            {% elif bt >= 50 %}{{ [500, pv + 150] | min }}
            {% elif bt < 0 %}0
            {% else %}800{% endif %}
          hub_temp_cap_u1: >-
            {% set ht = hub_t1 | float(999) %}
            {% if hub_temp_cooldown_u1 | bool or ht >= 65 %}0
            {% elif ht >= 62 %}100
            {% elif ht >= 60 %}200
            {% elif ht >= 58 %}400
            {% elif ht >= 55 %}600
            {% elif ht < 0 %}0
            {% else %}800{% endif %}
          hub_temp_cap_u2: >-
            {% set ht = hub_t2 | float(999) %}
            {% if hub_temp_cooldown_u2 | bool or ht >= 65 %}0
            {% elif ht >= 62 %}100
            {% elif ht >= 60 %}200
            {% elif ht >= 58 %}400
            {% elif ht >= 55 %}600
            {% elif ht < 0 %}0
            {% else %}800{% endif %}
          temp_cap_u1: >-
            {{ [batt_temp_cap_u1 | int(800), hub_temp_cap_u1 | int(800), unit_max | int(800)] | min }}
          temp_cap_u2: >-
            {{ [batt_temp_cap_u2 | int(800), hub_temp_cap_u2 | int(800), unit_max | int(800)] | min }}
          actual_1_raw: "{{ states('sensor.solarflow_1_output_power') | float(0) if s1_ok | bool and output_age_1 | float(9999) < 60 and is_number(states('sensor.solarflow_1_output_power')) else 0 }}"
          actual_2_raw: "{{ states('sensor.solarflow_2_output_power') | float(0) if s2_ok | bool and output_age_2 | float(9999) < 60 and is_number(states('sensor.solarflow_2_output_power')) else 0 }}"
          out_pwr_age_1: "{{ output_age_1 | float(9999) }}"
          out_pwr_age_2: "{{ output_age_2 | float(9999) }}"
          out_pwr_fresh_1: "{{ out_pwr_age_1 < 20 }}"
          out_pwr_fresh_2: "{{ out_pwr_age_2 < 20 }}"

          calib1: "{{ is_state('input_boolean.zendure_calib_mode_u1', 'on') }}"
          calib2: "{{ is_state('input_boolean.zendure_calib_mode_u2', 'on') }}"
          calib_any: "{{ calib1 or calib2 }}"
          calib_isolation: "{{ is_state('input_boolean.zendure_conf_calib_isolation', 'on') }}"

          emerg_u1: "{{ is_state('input_boolean.zendure_emergency_u1', 'on') }}"
          emerg_u2: "{{ is_state('input_boolean.zendure_emergency_u2', 'on') }}"
          vguard_u1: "{{ is_state('input_boolean.zendure_vguard_u1', 'on') }}"
          vguard_u2: "{{ is_state('input_boolean.zendure_vguard_u2', 'on') }}"

          busy_u1: "{{ calib1 or emerg_u1 or vguard_u1 or batt_temp_cooldown_u1 or hub_temp_cooldown_u1 }}"
          busy_u2: "{{ calib2 or emerg_u2 or vguard_u2 or batt_temp_cooldown_u2 or hub_temp_cooldown_u2 }}"

          stall_u1: >-
            {{ s1_ok | bool
               and not (busy_u1 | bool)
               and (s1_base | int(0)) >= 120
               and (actual_1_raw | float(0)) < 20
               and (out_pwr_fresh_1 | bool)
               and (time_since_1 | float(0)) > 10
               and (time_since_1 | float(0)) < 120 }}
          stall_u2: >-
            {{ s2_ok | bool
               and not (busy_u2 | bool)
               and (s2_base | int(0)) >= 120
               and (actual_2_raw | float(0)) < 20
               and (out_pwr_fresh_2 | bool)
               and (time_since_2 | float(0)) > 10
               and (time_since_2 | float(0)) < 120 }}

          ghost_load_1: "{{ [s1_desired|int(0), s1_dispatched|int(0), s1_confirmed|int(0)] | max if not s1_ok | bool else 0 }}"
          ghost_load_2: "{{ [s2_desired|int(0), s2_dispatched|int(0), s2_confirmed|int(0)] | max if not s2_ok | bool else 0 }}"
          ghost_total: "{{ (ghost_load_1|int(0)) + (ghost_load_2|int(0)) }}"

          cap_u1: >
            {% set dis1 = is_state('input_boolean.zendure_calib_discharge_u1', 'on') %}
            {% set tc = temp_cap_u1 | int(800) %}
            {% if not s1_ok|bool or busy_u1 or stall_u1 %}0
            {% elif calib_isolation and calib_any and not calib1 and not dis1 %}0
            {% elif is_state('input_boolean.zendure_emergency_u1','on') or is_state('input_boolean.zendure_vguard_u1','on') or calib1 %}0
            {% elif v1_min <= 2.95 %}0
            {% elif tc <= 0 %}0
            {% elif dis1 and v1_min <= 3.00 %}0
            {% elif dis1 and v1_min <= 3.05 and soc1_val <= 10 %}0
            {% elif dis1 and v1_min < 3.08 %}{{ [((s1_solar * 0.9) + 75) | int(0), tc] | min }}
            {% elif dis1 and (v1_min < 3.15 or soc1_val <= 30) %}{{ [((s1_solar * 0.9) + 100) | int(0), tc] | min }}
            {% elif dis1 and v1_min < 3.20 %}{{ [300, tc] | min }}
            {% elif soc1_val <= soc_off %}0
            {% elif bypass1 %}{{ [(s1_solar * 0.9) | int(0), tc] | min }}
            {% elif v1_min < 3.12 %}{{ [(s1_solar * 0.9) | int(0), tc] | min }}
            {% elif v1_min < 3.15 %}{{ [((s1_solar * 0.9) + 100) | int(0), tc] | min }}
            {% elif soc1_val <= (soc_off|float(20) + 8) %}{{ [((s1_solar * 0.9) + 100) | int(0), tc] | min }}
            {% elif soc1_val <= (soc_off|float(20) + 12) %}{{ [300, ((s1_solar * 0.9) + 150) | int(0), tc] | min }}
            {% else %}{{ tc }}{% endif %}

          cap_u2: >
            {% set dis2 = is_state('input_boolean.zendure_calib_discharge_u2', 'on') %}
            {% set tc = temp_cap_u2 | int(800) %}
            {% if not s2_ok|bool or busy_u2 or stall_u2 %}0
            {% elif calib_isolation and calib_any and not calib2 and not dis2 %}0
            {% elif is_state('input_boolean.zendure_emergency_u2','on') or is_state('input_boolean.zendure_vguard_u2','on') or calib2 %}0
            {% elif v2_min <= 2.95 %}0
            {% elif tc <= 0 %}0
            {% elif dis2 and v2_min <= 3.00 %}0
            {% elif dis2 and v2_min <= 3.05 and soc2_val <= 10 %}0
            {% elif dis2 and v2_min < 3.08 %}{{ [((s2_solar * 0.9) + 75) | int(0), tc] | min }}
            {% elif dis2 and (v2_min < 3.15 or soc2_val <= 30) %}{{ [((s2_solar * 0.9) + 100) | int(0), tc] | min }}
            {% elif dis2 and v2_min < 3.20 %}{{ [300, tc] | min }}
            {% elif soc2_val <= soc_off %}0
            {% elif bypass2 %}{{ [(s2_solar * 0.9) | int(0), tc] | min }}
            {% elif v2_min < 3.12 %}{{ [(s2_solar * 0.9) | int(0), tc] | min }}
            {% elif v2_min < 3.15 %}{{ [((s2_solar * 0.9) + 100) | int(0), tc] | min }}
            {% elif soc2_val <= (soc_off|float(20) + 8) %}{{ [((s2_solar * 0.9) + 100) | int(0), tc] | min }}
            {% elif soc2_val <= (soc_off|float(20) + 12) %}{{ [300, ((s2_solar * 0.9) + 150) | int(0), tc] | min }}
            {% else %}{{ tc }}{% endif %}

          available_capacity: "{{ [ (global_max|int(0) - ghost_total|int(0)), 0 ] | max }}"

          failsafe: "{{ states('input_number.zendure_conf_failsafe_watt') | int(130) }}"
          grid_bias: "{{ states('input_number.zendure_conf_grid_bias') | int(10) }}"

          zen_mode: "{{ (bypass1 or bypass2) }}"
          slider_change: "{{ states('input_number.zendure_conf_min_change') | int(8) }}"
          jump_raw: >-
            {% if trigger.id == 'meter_step' and trigger.from_state is not none and trigger.to_state is not none and is_number(trigger.from_state.state) and is_number(trigger.to_state.state) %}
              {{ ((trigger.to_state.state | float(0)) - (trigger.from_state.state | float(0))) | abs }}
            {% else %}
              0
            {% endif %}
          fast_jump_threshold: "{{ [[(hysteresis|int(10) * 2), 30] | max, 120] | min }}"
          fast_event: "{{ trigger.id == 'meter_step' and (jump_raw | float(0)) >= (fast_jump_threshold | int(30)) }}"
          fast_push_1: "{{ fast_event and time_since_1 > 1.2 }}"
          fast_push_2: "{{ fast_event and time_since_2 > 1.2 }}"
          min_change_base: "{{ ([((slider_change | int(8)) * 4), 20] | min) if (zen_mode | bool) else (slider_change | int(8)) }}"
          min_change: "{{ [5, ((min_change_base | int(0)) // 2)] | max if fast_event else min_change_base }}"

          override_margin: "{{ [min_change|int(0), 10] | max }}"

          override_u1: "{{ s1_ok | bool and (s1_base|int(0) > (cap_u1|int(0) + override_margin|int(0))) }}"
          override_u2: "{{ s2_ok | bool and (s2_base|int(0) > (cap_u2|int(0) + override_margin|int(0))) }}"
          force_zero_u1: "{{ s1_ok | bool and (cap_u1|int(0) == 0) and (s1_base|int(0) > 0) }}"
          force_zero_u2: "{{ s2_ok | bool and (cap_u2|int(0) == 0) and (s2_base|int(0) > 0) }}"
          data_invalid_force_zero_u1: >-
            {{ s1_fresh|bool and not s1_plausible|bool and
               [s1_desired|int(0), s1_dispatched|int(0), s1_confirmed|int(0)] | max > 0 }}
          data_invalid_force_zero_u2: >-
            {{ s2_fresh|bool and not s2_plausible|bool and
               [s2_desired|int(0), s2_dispatched|int(0), s2_confirmed|int(0)] | max > 0 }}
          safety_override: "{{ override_u1 or override_u2 }}"


          grid: "{{ (states(power_meter_entity) | float(0)) if shelly_ok | bool else 0 }}"
          stale_force_zero_u1: "{{ (not s1_fresh|bool) and (s1_base|int(0) > 0) and ((grid|float(0)) < -80) }}"
          stale_force_zero_u2: "{{ (not s2_fresh|bool) and (s2_base|int(0) > 0) and ((grid|float(0)) < -80) }}"

          actual_1: >-
            {% set meas = actual_1_raw | float(0) %}
            {% if out_pwr_age_1 | float(999) < 12 %}
              {{ meas }}
            {% else %}
              {{ [meas, s1_confirmed|int(0), s1_dispatched|int(0), s1_desired|int(0)] | max }}
            {% endif %}
          actual_2: >-
            {% set meas = actual_2_raw | float(0) %}
            {% if out_pwr_age_2 | float(999) < 12 %}
              {{ meas }}
            {% else %}
              {{ [meas, s2_confirmed|int(0), s2_dispatched|int(0), s2_desired|int(0)] | max }}
            {% endif %}

          actual_total: "{{ (actual_1 | int(0)) + (actual_2 | int(0)) }}"

          busy_actual_1: "{{ actual_1 | int(0) if busy_u1 | bool else 0 }}"
          busy_actual_2: "{{ actual_2 | int(0) if busy_u2 | bool else 0 }}"
          busy_actual_total: "{{ (busy_actual_1 | int(0)) + (busy_actual_2 | int(0)) }}"
          cmd_total: "{{ (s1_base|int(0)) + (s2_base|int(0)) }}"

          tracking_stale: "{{ (out_pwr_age_1|float(9999) > 25) or (out_pwr_age_2|float(9999) > 25) }}"
          recent_cmd_activity: "{{ (time_since_1|float(0) < 25) or (time_since_2|float(0) < 25) }}"
          cmd_actual_gap: "{{ ((actual_total|int(0)) - (cmd_total|int(0))) | abs }}"
          tracking_unreliable: "{{ tracking_stale|bool or (recent_cmd_activity|bool and (cmd_actual_gap|int(0) > 220)) }}"
          control_total: >-
            {% if tracking_unreliable | bool %}
              {{ cmd_total | int(0) }}
            {% else %}
              {{ ((cmd_total|int(0) * 0.50) + (actual_total|int(0) * 0.50)) | int(0) }}
            {% endif %}

          target_raw: >-
            {{ ((control_total | int(0)) + (grid | float(0)) - (grid_bias | int(0)))
               if shelly_ok | bool else (failsafe | int(0)) }}

          target_total: >-
            {% set raw = [[target_raw|int(0), 0]|max, global_max]|min %}
            {% set current = actual_total|int(0) %}
            {% set lowest_soc = [soc1_val|int(100), soc2_val|int(100)]|min %}
            {% set max_step = 100 %}
            {% if lowest_soc < 25 and raw > current and (raw - current) > max_step %}
              {{ current + max_step }}
            {% else %}
              {{ raw }}
            {% endif %}

          delta_effective: "{{ (target_total|int(0)) - (control_total|int(0)) }}"
          rebalance_needed: >-
            {% set both_ready = s1_ok|bool and s2_ok|bool and not busy_u1 and not busy_u2 and (actual_total|int(0)) > 100 and v1_min > 3.10 and v2_min > 3.10 %}
            {% set ideal = (soc1_val / (soc1_val + soc2_val)) if (soc1_valid and soc2_valid and (soc1_val + soc2_val) > 0) else 0.5 %}
            {% set actual_share = (actual_1|float(0) / (actual_total|float(1))) if (actual_total|float(0)) > 50 else ideal %}
            {% set soc_gap_misaligned = ((soc1_val - soc2_val)|abs >= 4) and ((actual_share - ideal)|abs >= 0.15) %}
            {% set full_soc_misaligned = (
                 (soc1_val >= 99 and soc2_val <= 97 and actual_share < 0.55)
                 or
                 (soc2_val >= 99 and soc1_val <= 97 and actual_share > 0.45)
               ) %}
            {{ both_ready and (soc_gap_misaligned or full_soc_misaligned) }}

      - condition: template
        value_template: >
          {{ safety_override
             or force_zero_u1
             or force_zero_u2
             or stale_force_zero_u1
             or stale_force_zero_u2
             or data_invalid_force_zero_u1
             or data_invalid_force_zero_u2
             or fast_event
             or stall_u1
             or stall_u2
             or states('input_text.zendure_ac_mode_u1') != 'Output mode'
             or states('input_text.zendure_ac_mode_u2') != 'Output mode'
             or ((delta_effective | int(0) | abs) > (hysteresis | int(0)))
             or (actual_total | int(0) > global_max | int(0))
             or ((grid | float(0)) < -40)
             or rebalance_needed }}

      - variables:
          cmd_retry_s: >-
            {% if fast_event %}
              1.5
            {% elif (target_total|int(0)) < (actual_total|int(0)) %}
              2.0
            {% else %}
              2.5
            {% endif %}
          cmd_u1_cooldown_ok: "{{ (time_since_1 | float(0)) > cmd_retry_s }}"
          cmd_u2_cooldown_ok: "{{ (time_since_2 | float(0)) > cmd_retry_s }}"

          target_online: "{{ [[(target_total|int(0) - ghost_total|int(0) - busy_actual_total|int(0)), 0]|max, available_capacity|int(0)]|min }}"

          active_1: "{{ s1_ok | bool and not (busy_u1 | bool) }}"
          active_2: "{{ s2_ok | bool and not (busy_u2 | bool) }}"

          weight_1_base: >-
            {% if soc1_valid and soc2_valid and (soc1_val + soc2_val) > 0 %}
              {{ soc1_val / (soc1_val + soc2_val) }}
            {% else %}
              0.5
            {% endif %}

          weight_1: >-
            {% set w = weight_1_base | float(0.5) %}

            {% if t1 < 80 and t2 < 80 %}
              {% if t1 > 45 and (t1 - t2) > 4 %}
                {% set w = w - 0.15 %}
              {% elif t2 > 45 and (t2 - t1) > 4 %}
                {% set w = w + 0.15 %}
              {% endif %}
            {% endif %}

            {% if soc1_val >= 99 and soc2_val < 99 %}
              {% set w = w + 0.25 %}
            {% elif soc2_val >= 99 and soc1_val < 99 %}
              {% set w = w - 0.25 %}
            {% endif %}

            {% set solar_diff = s1_solar - s2_solar %}
            {% if solar_diff > 150 %}
              {% set w = w + 0.10 %}
            {% elif solar_diff < -150 %}
              {% set w = w - 0.10 %}
            {% endif %}

            {% if active_1 and active_2 and not busy_u1 and not busy_u2 and v1_min > 3.10 and v2_min > 3.10 %}
              {% set soc_diff = (soc1_val|float(0) - soc2_val|float(0)) %}
              {% set actual_sum = (actual_1|float(0) + actual_2|float(0)) %}
              {% set actual_share_1 = (actual_1|float(0) / actual_sum) if actual_sum > 50 else w %}
              {% set share_dev = actual_share_1 - w %}

              {% if (soc_diff | abs) >= 4 and (share_dev | abs) >= 0.15 %}
                {% if soc_diff > 0 and share_dev < 0 %}
                  {% set w = w + 0.08 %}
                {% elif soc_diff < 0 and share_dev > 0 %}
                  {% set w = w - 0.08 %}
                {% endif %}
              {% endif %}

              {% if (v1_min + 0.05) < v2_min %}
                {% set w = w - 0.08 %}
              {% elif (v2_min + 0.05) < v1_min %}
                {% set w = w + 0.08 %}
              {% endif %}
            {% endif %}

            {{ [[w, 0.0]|max, 1.0]|min }}

          req_1: "{{ ((target_online | int(0)) * (weight_1 | float(0))) | int(0) }}"
          req_2: "{{ (target_online | int(0)) - (req_1 | int(0)) }}"

          req_1_final: "{{ req_1|int(0) }}"
          req_2_final: "{{ req_2|int(0) }}"
          final_1_init: "{{ [req_1_final|int(0), cap_u1|int(0)]|min }}"

          final_2_raw: >
            {% if active_2 %}
              {% set v = (req_2_final + (req_1_final - final_1_init)) | int(0) %}
              {{ [[v, 0] | max, cap_u2 | int(0)] | min }}
            {% else %}
              0
            {% endif %}

          final_1_raw: >
            {% if active_1 %}
              {% set v = (target_online | int(0)) - (final_2_raw | int(0)) %}
              {{ [[v, 0] | max, cap_u1 | int(0)] | min }}
            {% else %}
              0
            {% endif %}

          active_sum: >-
            {% set a1 = final_1_raw|int(0) if active_1 else 0 %}
            {% set a2 = final_2_raw|int(0) if active_2 else 0 %}
            {{ a1 + a2 }}

          scale_active: >-
            {% set cap = available_capacity|int(0) %}
            {% set s = active_sum|int(0) %}
            {% if s <= 0 %} 1
            {% elif cap <= 0 %} 0
            {% elif s > cap %} {{ cap / s }}
            {% else %} 1
            {% endif %}

          final_1_pre: "{{ (final_1_raw|int(0) * (scale_active|float(1))) | int }}"
          final_2_pre: "{{ (final_2_raw|int(0) * (scale_active|float(1))) | int }}"

          heavy_export: "{{ (grid | float(0)) < -40 }}"
          fast_down_1: "{{ heavy_export and (final_1_pre|int(0) < s1_base|int(0)) }}"
          fast_down_2: "{{ heavy_export and (final_2_pre|int(0) < s2_base|int(0)) }}"
          max_step_up: "{{ 140 if fast_event else 70 }}"
          max_step_down: "{{ 220 if (fast_event or heavy_export) else 110 }}"
          final_1: >-
            {% set base = s1_base | int(0) %}
            {% set target = final_1_pre | int(0) %}
            {% set cap = cap_u1 | int(0) %}
            {% set up = max_step_up | int(70) %}
            {% set down = max_step_down | int(110) %}
            {% if target > base + up %}
              {% set ramped = base + up %}
            {% elif target < base - down %}
              {% set ramped = [base - down, 0] | max %}
            {% else %}
              {% set ramped = target %}
            {% endif %}
            {# Safety caps are hard ceilings; normal grid reductions remain ramped. #}
            {{ [ramped | int(0), cap] | min }}
          final_2: >-
            {% set base = s2_base | int(0) %}
            {% set target = final_2_pre | int(0) %}
            {% set cap = cap_u2 | int(0) %}
            {% set up = max_step_up | int(70) %}
            {% set down = max_step_down | int(110) %}
            {% if target > base + up %}
              {% set ramped = base + up %}
            {% elif target < base - down %}
              {% set ramped = [base - down, 0] | max %}
            {% else %}
              {% set ramped = target %}
            {% endif %}
            {# Safety caps are hard ceilings; normal grid reductions remain ramped. #}
            {{ [ramped | int(0), cap] | min }}
          online_safety_capacity: >-
            {{ [global_max|int(0) - ghost_total|int(0) - busy_actual_total|int(0), 0] | max }}
          start_min_output: 30
          low_load_single_threshold: 100
          prefer_single_u1: >-
            {% if s1_base|int(0) >= start_min_output and s2_base|int(0) < start_min_output %}true
            {% elif s2_base|int(0) >= start_min_output and s1_base|int(0) < start_min_output %}false
            {% else %}{{ weight_1|float(0.5) >= 0.5 }}{% endif %}
          final_pair_total: >-
            {{ [(final_1|int(0)) + (final_2|int(0)), online_safety_capacity|int(0)] | min }}
          final_1_eff: >-
            {% set total = final_pair_total | int(0) %}
            {% set a1 = final_1 | int(0) %}
            {% set c1 = cap_u1 | int(0) %}
            {% set c2 = cap_u2 | int(0) %}
            {% set minimum = start_min_output | int(30) %}
            {% set prefer1 = prefer_single_u1 | bool %}
            {% if total < minimum or not active_1|bool %}
              0
            {% elif not active_2|bool %}
              {{ [total, c1] | min if [total, c1] | min >= minimum else 0 }}
            {% elif total < (minimum * 2) %}
              {% if prefer1 and c1 >= total %}{{ total }}
              {% elif (not prefer1) and c2 >= total %}0
              {% elif c1 >= total %}{{ total }}
              {% elif c2 >= total %}0
              {% elif c1 >= c2 and c1 >= minimum %}{{ c1 }}
              {% else %}0{% endif %}
            {% elif total <= low_load_single_threshold and prefer1 and c1 >= total %}
              {{ total }}
            {% elif total <= low_load_single_threshold and (not prefer1) and c2 >= total %}
              0
            {% else %}
              {% set low = [minimum, total - c2] | max %}
              {% set high = [c1, total - minimum] | min %}
              {% if low <= high %}
                {{ [[a1, low] | max, high] | min }}
              {% elif c1 >= total %}
                {{ total }}
              {% elif c2 >= total %}
                0
              {% elif c1 >= minimum and c2 < minimum %}
                {{ [total, c1] | min }}
              {% else %}
                0
              {% endif %}
            {% endif %}
          final_2_eff: >-
            {% set total = final_pair_total | int(0) %}
            {% set a1 = final_1_eff | int(0) %}
            {% set c2 = cap_u2 | int(0) %}
            {% set minimum = start_min_output | int(30) %}
            {% set remainder = [total - a1, 0] | max %}
            {% set allocated = [remainder, c2] | min %}
            {{ allocated if allocated >= minimum else 0 }}

      - variables:
          send_u1_base: >-
            {{ (s1_ok|bool and not busy_u1 and cmd_u1_cooldown_ok and
                (not ack_pending_1|bool or fast_down_1|bool or force_zero_u1|bool or fast_push_1|bool) and
                (fast_down_1|bool or force_zero_u1|bool or fast_push_1|bool
                 or ((final_1_eff|int(0) - s1_base|int(0))|abs >= min_change|int(0))
                 or override_u1
                 or states('input_text.zendure_ac_mode_u1') != 'Output mode'
                 or ((actual_total|int(0) > global_max|int(0)) and (s1_base|int(0) > final_1_eff|int(0)))))
               or stale_force_zero_u1|bool or data_invalid_force_zero_u1|bool }}
          send_u2_base: >-
            {{ (s2_ok|bool and not busy_u2 and cmd_u2_cooldown_ok and
                (not ack_pending_2|bool or fast_down_2|bool or force_zero_u2|bool or fast_push_2|bool) and
                (fast_down_2|bool or force_zero_u2|bool or fast_push_2|bool
                 or ((final_2_eff|int(0) - s2_base|int(0))|abs >= min_change|int(0))
                 or override_u2
                 or states('input_text.zendure_ac_mode_u2') != 'Output mode'
                 or ((actual_total|int(0) > global_max|int(0)) and (s2_base|int(0) > final_2_eff|int(0)))))
               or stale_force_zero_u2|bool or data_invalid_force_zero_u2|bool }}
          transfer_lower_u1: >-
            {{ send_u2_base|bool and s1_ok|bool and not busy_u1 and cmd_u1_cooldown_ok|bool
               and final_1_eff|int(0) < s1_base|int(0)
               and final_2_eff|int(0) > s2_base|int(0) }}
          transfer_lower_u2: >-
            {{ send_u1_base|bool and s2_ok|bool and not busy_u2 and cmd_u2_cooldown_ok|bool
               and final_2_eff|int(0) < s2_base|int(0)
               and final_1_eff|int(0) > s1_base|int(0) }}
          send_u1: "{{ send_u1_base|bool or transfer_lower_u1|bool }}"
          send_u2: "{{ send_u2_base|bool or transfer_lower_u2|bool }}"
          pair_target_1: "{{ 0 if (force_zero_u1|bool or stale_force_zero_u1|bool or data_invalid_force_zero_u1|bool) else final_1_eff|int(0) }}"
          pair_target_2: "{{ 0 if (force_zero_u2|bool or stale_force_zero_u2|bool or data_invalid_force_zero_u2|bool) else final_2_eff|int(0) }}"
          generation_next: "{{ ((as_timestamp(now()) * 1000000) | int) % 1000000000 }}"
          pair_busy: "{{ is_state('script.zendure_dispatch_output_pair','on') }}"
          pair_target_total: "{{ (pair_target_1 | int(0)) + (pair_target_2 | int(0)) }}"
          desired_total_now: "{{ (s1_base | int(0)) + (s2_base | int(0)) }}"
          # Do not cancel a running handover merely because the 2-second loop
          # requests its still-missing raise phase. A real reduction/export or
          # safety clamp may still pre-empt the active pair run immediately.
          pair_preempt_allowed: >-
            {{ (pair_target_total | int(0)) < (desired_total_now | int(0))
               or (grid | float(0)) < -40
               or fast_down_1 | bool
               or fast_down_2 | bool
               or force_zero_u1 | bool
               or force_zero_u2 | bool
               or stale_force_zero_u1 | bool
               or stale_force_zero_u2 | bool
               or data_invalid_force_zero_u1 | bool
               or data_invalid_force_zero_u2 | bool
               or (actual_total | int(0)) > (global_max | int(0)) }}
          pair_launch_allowed: "{{ (not (pair_busy | bool)) or (pair_preempt_allowed | bool) }}"
      - if:
          - condition: template
            value_template: "{{ (send_u1 or send_u2) and pair_launch_allowed }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_dispatch_generation }
            data: { value: "{{ generation_next }}" }
          - action: script.turn_on
            target: { entity_id: script.zendure_dispatch_output_pair }
            data:
              variables:
                target_1: "{{ pair_target_1 }}"
                target_2: "{{ pair_target_2 }}"
                send_1: "{{ send_u1 }}"
                send_2: "{{ send_u2 }}"
                force_1: "{{ fast_down_1|bool or force_zero_u1|bool or stale_force_zero_u1|bool or data_invalid_force_zero_u1|bool }}"
                force_2: "{{ fast_down_2|bool or force_zero_u2|bool or stale_force_zero_u2|bool or data_invalid_force_zero_u2|bool }}"
                # Never force Output mode while a unit intentionally owns Input/hold mode
                # (Emergency, Calibration, VGuard or temperature cooldown).
                ensure_mode_1: "{{ not stale_force_zero_u1|bool and not busy_u1|bool }}"
                ensure_mode_2: "{{ not stale_force_zero_u2|bool and not busy_u2|bool }}"
                reassert_mode_1: false
                reassert_mode_2: false
                generation: "{{ generation_next }}"


  # --- 6.5 STATE MACHINE (SAFE RETURN & SYNC) ---
  - alias: "Zendure: State Machine (Smart Single-Channel)"
    id: "zendure_state_machine_dual"
    mode: queued
    initial_state: true
    triggers:
      - trigger: state
        entity_id: input_boolean.zendure_auto_mode
        to: "on"
      - trigger: state
        entity_id: input_boolean.zendure_auto_mode
        to: "off"
        id: "auto_off"

      - trigger: time_pattern
        minutes: "/5"
        id: "periodic_reconcile"

      - trigger: state
        id: "temperature_reconcile"
        entity_id:
          - sensor.solarflow_1_battery_temp_control
          - sensor.solarflow_2_battery_temp_control
          - sensor.solarflow_1_hub_temp_control
          - sensor.solarflow_2_hub_temp_control
          - input_boolean.zendure_batt_temp_cooldown_u1
          - input_boolean.zendure_batt_temp_cooldown_u2
          - input_boolean.zendure_hub_temp_cooldown_u1
          - input_boolean.zendure_hub_temp_cooldown_u2

      - trigger: template
        id: "device_online_u1"
        value_template: "{{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] }}"
        for: "00:00:01"
      - trigger: template
        id: "device_online_u2"
        value_template: "{{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] }}"
        for: "00:00:01"

      - trigger: homeassistant
        event: start
        id: "boot_check"
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ trigger.id == 'auto_off' and is_state('input_boolean.zendure_auto_mode','on') }}
            sequence:
              - stop: "Stale auto_off trigger ignored (Auto-Mode already ON)."

          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'auto_off' }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.zendure_emergency_u1
                    - input_boolean.zendure_emergency_u2
                    - input_boolean.zendure_calib_mode_u1
                    - input_boolean.zendure_calib_mode_u2
                    - input_boolean.zendure_vguard_u1
                    - input_boolean.zendure_vguard_u2
                    - input_boolean.zendure_calib_discharge_u1
                    - input_boolean.zendure_calib_discharge_u2
                    - input_boolean.zendure_force_calib_u1
                    - input_boolean.zendure_force_calib_u2

              - parallel:
                - action: script.zendure_reset_u1_output_safe
                - action: script.zendure_reset_u2_output_safe
              - stop: "Automatik beendet - Full Hard Reset."

          - conditions:
              - condition: template
                value_template: "{{ trigger.id in ['device_online_u1', 'device_online_u2', 'boot_check'] }}"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ is_state('input_boolean.zendure_auto_mode','off') }}"
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id:
                        - input_boolean.zendure_emergency_u1
                        - input_boolean.zendure_emergency_u2
                        - input_boolean.zendure_calib_mode_u1
                        - input_boolean.zendure_calib_mode_u2
                        - input_boolean.zendure_vguard_u1
                        - input_boolean.zendure_vguard_u2
                        - input_boolean.zendure_calib_discharge_u1
                        - input_boolean.zendure_calib_discharge_u2
                        - input_boolean.zendure_force_calib_u1
                        - input_boolean.zendure_force_calib_u2

              - if:
                  - condition: template
                    value_template: >
                      {{ is_state('input_boolean.zendure_emergency_u1','on')
                         or is_state('input_boolean.zendure_emergency_u2','on')
                         or is_state('input_boolean.zendure_auto_mode','off') }}
                then:
                  - parallel:
                      - action: script.zendure_reset_u1_output_safe
                      - action: script.zendure_reset_u2_output_safe

              - wait_template: "{{ is_state('input_boolean.zendure_auto_mode','off') }}"
                timeout: "00:00:05"
                continue_on_timeout: true

              - if:
                  - condition: template
                    value_template: "{{ wait.completed }}"
                then:
                  - parallel:
                      - action: script.zendure_reset_u1_output_safe
                      - action: script.zendure_reset_u2_output_safe
                  - stop: "Auto-Mode switched OFF during Boot/Online Sequence. Full Safety Reconnect applied."

              - parallel:
                - if:
                    - condition: template
                      value_template: "{{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR'] }}"
                  then:
                    - action: mqtt.publish
                      data: { topic: !secret zendure_topic_u1_switch_smartMode_set, payload: "ON", qos: 1 }
                - if:
                    - condition: template
                      value_template: "{{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR'] }}"
                  then:
                    - action: mqtt.publish
                      data: { topic: !secret zendure_topic_u2_switch_smartMode_set, payload: "ON", qos: 1 }
              - delay: "00:00:02"
              - parallel:
                - if:
                    - condition: template
                      value_template: "{{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR'] }}"
                  then:
                    - action: mqtt.publish
                      data: { topic: !secret zendure_topic_u1_switch_smartMode_set, payload: "ON", qos: 1 }
                - if:
                    - condition: template
                      value_template: "{{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR'] }}"
                  then:
                    - action: mqtt.publish
                      data: { topic: !secret zendure_topic_u2_switch_smartMode_set, payload: "ON", qos: 1 }

              - wait_template: "{{ is_state('input_boolean.zendure_auto_mode','off') }}"
                timeout: "00:00:02"
                continue_on_timeout: true

              - if:
                  - condition: template
                    value_template: "{{ wait.completed }}"
                then:
                  - parallel:
                      - action: script.zendure_reset_u1_output_safe
                      - action: script.zendure_reset_u2_output_safe
                  - stop: "Auto-Mode switched OFF during Boot/Online Sequence. Full Safety Reconnect applied."

              - parallel:
                - if:
                    - condition: template
                      value_template: "{{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR'] }}"
                  then:
                    - action: mqtt.publish
                      data: { topic: !secret zendure_topic_u1_switch_smartMode_set, payload: "ON", qos: 1 }
                - if:
                    - condition: template
                      value_template: "{{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR'] }}"
                  then:
                    - action: mqtt.publish
                      data: { topic: !secret zendure_topic_u2_switch_smartMode_set, payload: "ON", qos: 1 }

              - if:
                  - condition: template
                    value_template: "{{ is_state('input_boolean.zendure_auto_mode','off') }}"
                then:
                  - parallel:
                      - action: script.zendure_reset_u1_output_safe
                      - action: script.zendure_reset_u2_output_safe
                  - stop: "Auto-Mode OFF: Safety Reconnect Hard-Stop applied."

      - if:
          - condition: template
            value_template: >
              {% set tid = trigger.id | default('') %}
              {{ is_state('input_boolean.zendure_auto_mode','off')
                 and tid not in ['auto_off','device_online_u1','device_online_u2','boot_check'] }}
        then:
          - stop: "Auto-Mode OFF: Trigger ignoriert (Strict Hands-Off)."

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'periodic_reconcile'
                 and states('sensor.solarflow_1_status_raw')|upper in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
                 and states('sensor.solarflow_2_status_raw')|upper in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] }}
        then:
          - stop: "Periodic reconcile skipped (both units offline)."

      - variables:
          online1: "{{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR'] }}"
          online2: "{{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR'] }}"
          min_soc: 5
          t1: "{{ states('sensor.solarflow_1_battery_temp_control') | float(states('sensor.solarflow_1_hub_temp_control')|float(0)) }}"
          t2: "{{ states('sensor.solarflow_2_battery_temp_control') | float(states('sensor.solarflow_2_hub_temp_control')|float(0)) }}"
          soc1: "{{ states('sensor.solarflow_1_battery_level') | float(0) }}"
          soc2: "{{ states('sensor.solarflow_2_battery_level') | float(0) }}"
          soc1_valid: "{{ is_number(states('sensor.solarflow_1_battery_level')) }}"
          soc2_valid: "{{ is_number(states('sensor.solarflow_2_battery_level')) }}"

          cl1: "{% if t1 < 5 %} 100 {% elif t1 < 10 %} 300 {% else %} 800 {% endif %}"
          cl2: "{% if t2 < 5 %} 100 {% elif t2 < 10 %} 300 {% else %} 800 {% endif %}"
          sl1: >
            {% if soc1 >= 99 %} 100
            {% elif soc1 >= 97 %} 150
            {% elif soc1 >= 95 %} 200
            {% elif soc1 >= 90 %} 400
            {% else %} 800
            {% endif %}
          sl2: >
            {% if soc2 >= 99 %} 100
            {% elif soc2 >= 97 %} 150
            {% elif soc2 >= 95 %} 200
            {% elif soc2 >= 90 %} 400
            {% else %} 800
            {% endif %}
          ss1: "{% if soc1 < 12 %} 300 {% else %} 800 {% endif %}"
          ss2: "{% if soc2 < 12 %} 300 {% else %} 800 {% endif %}"

          charge_limit_u1: >
            {% set batt = states('sensor.solarflow_1_battery_temp_control') | float(states('sensor.solarflow_1_hub_temp_control')|float(999)) %}
            {% set hub = states('sensor.solarflow_1_hub_temp_control') | float(999) %}
            {% set soc = states('sensor.solarflow_1_battery_level') | float(-1) %}
            {% set cold_cap = 100 if batt < 5 else (300 if batt < 10 else 800) %}
            {% set landing_cap = 100 if soc > 97 else (200 if soc >= 90 else 800) %}
            {% set low_soc_cap = 300 if soc < 12 else 800 %}
            {% set battery_charge_cap = 0 if is_state('input_boolean.zendure_batt_temp_cooldown_u1','on') or batt >= 55 else (100 if batt >= 53 else (300 if batt >= 50 else 800)) %}
            {% set hub_charge_cap = 0 if is_state('input_boolean.zendure_hub_temp_cooldown_u1','on') or hub >= 65 else (100 if hub >= 62 else (200 if hub >= 60 else (400 if hub >= 58 else (600 if hub >= 55 else 800)))) %}
            {% if is_state('input_boolean.zendure_calib_discharge_u1', 'on') %}
              0
            {% else %}
              {{ [cold_cap|int, landing_cap|int, low_soc_cap|int, battery_charge_cap|int, hub_charge_cap|int]|min }}
            {% endif %}

          charge_limit_u2: >
            {% set batt = states('sensor.solarflow_2_battery_temp_control') | float(states('sensor.solarflow_2_hub_temp_control')|float(999)) %}
            {% set hub = states('sensor.solarflow_2_hub_temp_control') | float(999) %}
            {% set soc = states('sensor.solarflow_2_battery_level') | float(-1) %}
            {% set cold_cap = 100 if batt < 5 else (300 if batt < 10 else 800) %}
            {% set landing_cap = 100 if soc > 97 else (200 if soc >= 90 else 800) %}
            {% set low_soc_cap = 300 if soc < 12 else 800 %}
            {% set battery_charge_cap = 0 if is_state('input_boolean.zendure_batt_temp_cooldown_u2','on') or batt >= 55 else (100 if batt >= 53 else (300 if batt >= 50 else 800)) %}
            {% set hub_charge_cap = 0 if is_state('input_boolean.zendure_hub_temp_cooldown_u2','on') or hub >= 65 else (100 if hub >= 62 else (200 if hub >= 60 else (400 if hub >= 58 else (600 if hub >= 55 else 800)))) %}
            {% if is_state('input_boolean.zendure_calib_discharge_u2', 'on') %}
              0
            {% else %}
              {{ [cold_cap|int, landing_cap|int, low_soc_cap|int, battery_charge_cap|int, hub_charge_cap|int]|min }}
            {% endif %}

          curr_min_soc_1: "{{ states('sensor.solarflow_1_setting_minsoc') | int(-1) }}"
          curr_charge_1: >
            {% set real = states('sensor.solarflow_1_setting_chargelimit') %}
            {{ real | int(states('input_number.zendure_last_chargelimit_u1') | int(-1)) if is_number(real) else states('input_number.zendure_last_chargelimit_u1') | int(-1) }}
          curr_min_soc_2: "{{ states('sensor.solarflow_2_setting_minsoc') | int(-1) }}"
          curr_charge_2: >
            {% set real = states('sensor.solarflow_2_setting_chargelimit') %}
            {{ real | int(states('input_number.zendure_last_chargelimit_u2') | int(-1)) if is_number(real) else states('input_number.zendure_last_chargelimit_u2') | int(-1) }}

      - if:
          - condition: state
            entity_id: input_boolean.zendure_auto_mode
            state: "on"
        then:
          - parallel:
            - if:
                - condition: template
                  value_template: "{{ online1 and curr_min_soc_1|int(-1) != min_soc|int }}"
              then:
                - action: mqtt.publish
                  data: { topic: !secret zendure_topic_u1_number_minSoc_set, payload: "{{ min_soc }}", qos: 1 }
            - if:
                - condition: template
                  value_template: "{{ online1 and curr_charge_1|int(-1) != charge_limit_u1|int }}"
              then:
                - action: script.zendure_dispatch_u1_chargelimit
                  data:
                    power: "{{ charge_limit_u1 }}"
                    force: false
            - if:
                - condition: template
                  value_template: "{{ online2 and curr_min_soc_2|int(-1) != min_soc|int }}"
              then:
                - action: mqtt.publish
                  data: { topic: !secret zendure_topic_u2_number_minSoc_set, payload: "{{ min_soc }}", qos: 1 }
            - if:
                - condition: template
                  value_template: "{{ online2 and curr_charge_2|int(-1) != charge_limit_u2|int }}"
              then:
                - action: script.zendure_dispatch_u2_chargelimit
                  data:
                    power: "{{ charge_limit_u2 }}"
                    force: false


  # --- 6.6a SAG CONFIRM U1 ---
  - alias: "Zendure: Sag Confirm U1"
    id: "zendure_sag_confirm_u1"
    mode: single
    initial_state: true
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: sensor.solarflow_1_cell_min_vol
        to: null
    conditions:
      - condition: state
        entity_id: input_boolean.zendure_auto_mode
        state: "on"
    actions:
      - variables:
          v_first: "{{ trigger.to_state.state | float(99) }}"
          soc_first: "{{ states('sensor.solarflow_1_battery_level') | float(0) }}"
          online1: "{{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] }}"
      - if:
          - condition: template
            value_template: >
              {{ online1
                 and is_state('input_boolean.zendure_calib_mode_u1', 'off')
                 and is_state('input_boolean.zendure_calib_discharge_u1','off')
                 and is_state('input_boolean.zendure_emergency_u1','off')
                 and is_state('input_boolean.zendure_vguard_u1','off')
                 and soc_first > 5
                 and v_first > 2.5
                 and v_first < 3.10 }}
        then:
          - wait_for_trigger:
              - trigger: state
                entity_id: sensor.solarflow_1_cell_min_vol
                to: null
            timeout: "00:02:00"
            continue_on_timeout: false
          - variables:
              v_confirm: "{{ wait.trigger.to_state.state | float(99) if wait.trigger is not none else 99 }}"
              imb_confirm: "{{ states('sensor.solarflow_1_cell_imbalance') | float(0) }}"
              soc_confirm: "{{ states('sensor.solarflow_1_battery_level') | float(0) }}"
              solar_total: "{{ states('sensor.solarflow_total_solar_input') | float(0) }}"
              s1_solar: "{{ states('sensor.solarflow_1_solar_input') | float(0) if online1 else 0 }}"
              relieved_u1: >
                {{ states('input_number.zendure_last_sent_1')|int(999) == 0
                   or states('sensor.solarflow_1_output_limit')|int(999) == 0 }}
              limit_calib_u1: >
                {% set t1 = states('sensor.solarflow_1_battery_temp_control') | float(states('sensor.solarflow_1_hub_temp_control')|float(0)) %}
                {% set soc1 = states('sensor.solarflow_1_battery_level') | float(0) %}
                {% set cl1 = 100 if t1 < 5 else (300 if t1 < 10 else 800) %}
                {% set sl1 = 100 if soc1 > 97 else (200 if soc1 >= 90 else 800) %}
                {% set soc_soft_u1 = 100 if soc1 < 8 else (300 if soc1 < 12 else 800) %}
                {{ [cl1|int, sl1|int, soc_soft_u1|int]|min }}
              limit_emerg_u1: >
                {% set t1 = states('sensor.solarflow_1_battery_temp_control') | float(states('sensor.solarflow_1_hub_temp_control')|float(0)) %}
                {% set soc1 = states('sensor.solarflow_1_battery_level') | float(0) %}
                {% set cl1 = 100 if t1 < 5 else (300 if t1 < 10 else 800) %}
                {% set ss1 = 300 if soc1 < 12 else 800 %}
                {{ [300, cl1|int, ss1|int]|min }}
              confirmed: >
                {% set soc_ceiling = (states('input_number.zendure_conf_soc_emerg_stop')|float(25)) + 2 %}
                {{ is_state('input_boolean.zendure_auto_mode','on')
                   and states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
                   and is_state('input_boolean.zendure_calib_mode_u1','off')
                   and is_state('input_boolean.zendure_calib_discharge_u1','off')
                   and is_state('input_boolean.zendure_emergency_u1','off')
                   and is_state('input_boolean.zendure_vguard_u1','off')
                   and (soc_confirm <= soc_ceiling or v_confirm <= 2.95)
                   and v_confirm > 2.5
                   and states('sensor.solarflow_1_output_power')|float(0) > 120
                   and relieved_u1
                   and (
                     v_confirm <= 3.08
                     or (v_confirm <= 3.10 and imb_confirm >= 0.06)
                   ) }}
          - choose:
              # TAG-MODUS: Sofortige Deep-Kalibrierung starten + Harte Notbremse
              - conditions:
                  - condition: template
                    value_template: "{{ confirmed and solar_total >= 150 }}"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.zendure_force_calib_u1
                  - if:
                      - condition: template
                        value_template: "{{ s1_solar >= 50 }}"
                    then:
                      - action: input_text.set_value
                        target: { entity_id: input_text.zendure_ac_mode_u1 }
                        data: { value: "Output mode" }
                      - action: script.zendure_dispatch_u1_ac_mode
                        data:
                          mode: "Output mode"
                          force: true
                      - action: script.zendure_set_u1_outputlimit_zero
                    else:
                      - action: input_text.set_value
                        target: { entity_id: input_text.zendure_ac_mode_u1 }
                        data: { value: "Input mode" }
                      - action: script.zendure_dispatch_u1_ac_mode
                        data:
                          mode: "Input mode"
                          force: true
                      - action: script.zendure_set_u1_outputlimit_zero
                      - action: script.zendure_dispatch_u1_inputlimit
                        data:
                          power: "{{ limit_calib_u1 }}"
                          force: true
                  - action: input_number.set_value
                    target: { entity_id: input_number.zendure_last_sent_1 }
                    data: { value: 0 }
                  - action: notify.send_message
                    target:
                      entity_id: !secret telegram_id1
                    data:
                      message: >
                        📉 *Sicherheits-Kalibrierung U1 (Tag)*
                        Unterspannung bestätigt ({{ v_confirm | round(3) }} V, Δ {{ imb_confirm | round(3) }} V). Notbremse aktiv. Deep-Kalibrierung gestartet.

              # NACHT-MODUS: Notstrom-Automatik (AC Ladung) greift als Lebensversicherung ein!
              - conditions:
                  - condition: template
                    value_template: >
                      {{ confirmed
                         and solar_total < 150
                         and ((as_timestamp(now()) - as_timestamp(states('input_datetime.zendure_last_full_charge_1'), default=0)) | int(0)) > 86400 }}
                sequence:
                  - action: input_boolean.turn_on
                    target: { entity_id: input_boolean.zendure_force_calib_u1 }
                  - action: input_boolean.turn_on
                    target: { entity_id: input_boolean.zendure_emergency_u1 }
                  - action: input_text.set_value
                    target: { entity_id: input_text.zendure_ac_mode_u1 }
                    data: { value: "Input mode" }
                  - action: script.zendure_dispatch_u1_ac_mode
                    data:
                      mode: "Input mode"
                      force: true
                  - action: script.zendure_set_u1_outputlimit_zero
                  - action: script.zendure_dispatch_u1_inputlimit
                    data:
                      power: "{{ limit_emerg_u1 }}"
                      force: true
                  - action: input_number.set_value
                    target: { entity_id: input_number.zendure_last_sent_1 }
                    data: { value: 0 }
                  - action: notify.send_message
                    target:
                      entity_id: !secret telegram_id1
                    data:
                      message: >
                        📉 *Spannungseinbruch U1 (Nacht)*
                        Unterspannung bestätigt ({{ v_confirm | round(3) }} V, Δ {{ imb_confirm | round(3) }} V).
                        Notstrom Automatik übernimmt zur Sicherheit. Deep-Kalibrierung wurde für den Tag vorgemerkt.

