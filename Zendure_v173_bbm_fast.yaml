        id: battery_temp
      - trigger: mqtt
        topic: !secret zendure_topic_u1_sensor_hyperTmp
        id: hub_temp
      - trigger: time_pattern
        seconds: "/15"
        id: expiry_tick
    sensor:
      - name: "SolarFlow 1 Battery Temp Control"
        unique_id: solarflow_1_battery_temp_control
        default_entity_id: sensor.solarflow_1_battery_temp_control
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {% set old = this.state | float(none) %}
          {% set old_ts = as_timestamp(this.attributes.get('last_good', '1970-01-01T00:00:00+00:00'), 0) %}
          {% set fresh_old = old is not none and (as_timestamp(now()) - old_ts) <= 300 %}
          {% if trigger.id == 'battery_temp' %}
            {% set raw = trigger.payload | float(none) %}
            {% if raw is none %}{% set val = none %}
            {% elif raw > 1000 %}{% set val = (raw - 2731) / 10 %}
