    conditions:
      - condition: template
        value_template: >
          {{ has_value('sensor.solarflow_1_battery_level')
             and has_value('sensor.solarflow_2_battery_level') }}

    sensor:
      - name: "SolarFlow Remaining Time (5m Avg)"
        unique_id: solarflow_remaining_time_5m_avg_h
        default_entity_id: sensor.solarflow_remaining_time_5m_avg
        unit_of_measurement: "h"
        icon: mdi:timer-sand
        state: >
          {% set c1 = states('input_number.zendure_conf_u1_capacity_wh') | float(1920) %}
          {% set c2 = states('input_number.zendure_conf_u2_capacity_wh') | float(1920) %}
          {% set stop_soc = states('input_number.zendure_conf_soc_off') | float(20) %}
          {% set soc1 = states('sensor.solarflow_1_battery_level') | float(0) %}
          {% set soc2 = states('sensor.solarflow_2_battery_level') | float(0) %}
          {% set v1 = states('sensor.solarflow_1_cell_min_vol') | float(99) %}
          {% set v2 = states('sensor.solarflow_2_cell_min_vol') | float(99) %}
          {% set batt_t1 = states('sensor.solarflow_1_battery_temp_control') | float(999) %}
          {% set batt_t2 = states('sensor.solarflow_2_battery_temp_control') | float(999) %}
          {% set hub_t1 = states('sensor.solarflow_1_hub_temp_control') | float(999) %}
          {% set hub_t2 = states('sensor.solarflow_2_hub_temp_control') | float(999) %}

          {% set blocked1 =
               is_state('input_boolean.zendure_bypass_u1','on')
               or is_state('input_boolean.zendure_emergency_u1','on')
               or is_state('input_boolean.zendure_vguard_u1','on')
               or is_state('input_boolean.zendure_calib_mode_u1','on')
               or is_state('input_boolean.zendure_calib_discharge_u1','on')
               or is_state('input_boolean.zendure_batt_temp_cooldown_u1','on')
               or is_state('input_boolean.zendure_hub_temp_cooldown_u1','on')
               or (batt_t1 < 200 and batt_t1 >= 55)
               or (hub_t1 < 200 and hub_t1 >= 65)
               or soc1 <= stop_soc
               or v1 < 3.12 %}
          {% set blocked2 =
               is_state('input_boolean.zendure_bypass_u2','on')
               or is_state('input_boolean.zendure_emergency_u2','on')
               or is_state('input_boolean.zendure_vguard_u2','on')
               or is_state('input_boolean.zendure_calib_mode_u2','on')
               or is_state('input_boolean.zendure_calib_discharge_u2','on')
               or is_state('input_boolean.zendure_batt_temp_cooldown_u2','on')
               or is_state('input_boolean.zendure_hub_temp_cooldown_u2','on')
               or (batt_t2 < 200 and batt_t2 >= 55)
               or (hub_t2 < 200 and hub_t2 >= 65)
               or soc2 <= stop_soc
               or v2 < 3.12 %}

          {% set wh1 = 0 if blocked1 else c1 * ([soc1 - stop_soc, 0] | max) / 100 %}
          {% set wh2 = 0 if blocked2 else c2 * ([soc2 - stop_soc, 0] | max) / 100 %}
          {% set remaining_output_wh = [wh1 + wh2, 0] | max %}

          {% set load_avg_state = states('sensor.solarflow_house_load_mean_15m') %}
          {% set load_now_state = states('sensor.power_consumption') %}
          {% if is_number(load_avg_state) and load_avg_state | float(0) > 20 %}
            {% set house_w = load_avg_state | float(0) %}
          {% elif is_number(load_now_state) %}
            {% set house_w = load_now_state | float(0) %}
          {% else %}
            {% set meter = 'sensor.zendure_grid_power' %}
            {% set grid_w = states(meter) | float(0) %}
            {% set output_w = states('sensor.solarflow_system_total_output') | float(0) %}
            {% set house_w = [output_w + grid_w, 0] | max %}
          {% endif %}

          {% set dis15_state = states('sensor.solarflow_discharge_mean_15m') %}
          {% set dis60_state = states('sensor.solarflow_discharge_mean_60s') %}
          {% set dis_now = states('sensor.solarflow_system_total_discharge_power_v24') | float(0) %}
          {% set dis15 = dis15_state | float(0) if is_number(dis15_state) else 0 %}
          {% set dis60 = dis60_state | float(0) if is_number(dis60_state) else 0 %}

          {% set effective_w = [house_w, dis15, dis60, dis_now, 80] | max %}

          {% if remaining_output_wh <= 0 %}
            0.0
          {% else %}
            {{ (remaining_output_wh / effective_w) | round(1) }}
          {% endif %}

        attributes:
          based_on: "remaining energy until soc_off / max(house_consumption, battery_discharge, 80W)"
          note: "V172: ETA to soc_off; restart uses max(soc_bypass, soc_off+3); shows 0h when blocked, vmin < 3.12V, battery PV-only/cooldown is active, or hub cooldown is active."
          stop_soc: "{{ states('input_number.zendure_conf_soc_off') | float(20) }}"
          restart_soc: >
            {{ [states('input_number.zendure_conf_soc_bypass') | float(25),
                (states('input_number.zendure_conf_soc_off') | float(20)) + 3] | max }}
          remaining_output_usable_wh: >
            {% set c1 = states('input_number.zendure_conf_u1_capacity_wh') | float(1920) %}
            {% set c2 = states('input_number.zendure_conf_u2_capacity_wh') | float(1920) %}
            {% set stop_soc = states('input_number.zendure_conf_soc_off') | float(20) %}
            {% set soc1 = states('sensor.solarflow_1_battery_level') | float(0) %}
            {% set soc2 = states('sensor.solarflow_2_battery_level') | float(0) %}
            {% set v1 = states('sensor.solarflow_1_cell_min_vol') | float(99) %}
            {% set v2 = states('sensor.solarflow_2_cell_min_vol') | float(99) %}
            {% set batt_t1 = states('sensor.solarflow_1_battery_temp_control') | float(999) %}
            {% set batt_t2 = states('sensor.solarflow_2_battery_temp_control') | float(999) %}
            {% set hub_t1 = states('sensor.solarflow_1_hub_temp_control') | float(999) %}
            {% set hub_t2 = states('sensor.solarflow_2_hub_temp_control') | float(999) %}
            {% set blocked1 = is_state('input_boolean.zendure_bypass_u1','on') or is_state('input_boolean.zendure_emergency_u1','on') or is_state('input_boolean.zendure_vguard_u1','on') or is_state('input_boolean.zendure_calib_mode_u1','on') or is_state('input_boolean.zendure_calib_discharge_u1','on') or is_state('input_boolean.zendure_batt_temp_cooldown_u1','on') or is_state('input_boolean.zendure_hub_temp_cooldown_u1','on') or (batt_t1 < 200 and batt_t1 >= 55) or (hub_t1 < 200 and hub_t1 >= 65) or soc1 <= stop_soc or v1 < 3.12 %}
            {% set blocked2 = is_state('input_boolean.zendure_bypass_u2','on') or is_state('input_boolean.zendure_emergency_u2','on') or is_state('input_boolean.zendure_vguard_u2','on') or is_state('input_boolean.zendure_calib_mode_u2','on') or is_state('input_boolean.zendure_calib_discharge_u2','on') or is_state('input_boolean.zendure_batt_temp_cooldown_u2','on') or is_state('input_boolean.zendure_hub_temp_cooldown_u2','on') or (batt_t2 < 200 and batt_t2 >= 55) or (hub_t2 < 200 and hub_t2 >= 65) or soc2 <= stop_soc or v2 < 3.12 %}
            {% set wh1 = 0 if blocked1 else c1 * ([soc1 - stop_soc, 0] | max) / 100 %}
            {% set wh2 = 0 if blocked2 else c2 * ([soc2 - stop_soc, 0] | max) / 100 %}
            {{ ([wh1 + wh2, 0] | max) | round(0) }}
          assumed_load_w: >
            {% set load_avg_state = states('sensor.solarflow_house_load_mean_15m') %}
            {% set load_now_state = states('sensor.power_consumption') %}
            {% if is_number(load_avg_state) and load_avg_state | float(0) > 20 %}
              {{ load_avg_state | float(0) | round(0) }}
            {% elif is_number(load_now_state) %}
              {{ load_now_state | float(0) | round(0) }}
            {% else %}
              {% set meter = 'sensor.zendure_grid_power' %}
              {% set grid_w = states(meter) | float(0) %}
              {% set output_w = states('sensor.solarflow_system_total_output') | float(0) %}
              {{ [output_w + grid_w, 0] | max | round(0) }}
            {% endif %}
          assumed_discharge_w: >
            {% set dis15_state = states('sensor.solarflow_discharge_mean_15m') %}
            {% set dis60_state = states('sensor.solarflow_discharge_mean_60s') %}
            {% set dis_now = states('sensor.solarflow_system_total_discharge_power_v24') | float(0) %}
            {% set dis15 = dis15_state | float(0) if is_number(dis15_state) else 0 %}
            {% set dis60 = dis60_state | float(0) if is_number(dis60_state) else 0 %}
            {{ [dis15, dis60, dis_now] | max | round(0) }}
          eta_to_zero_h: >
            {% set total_wh = states('sensor.solarflow_remaining_energy') | float(0) %}
            {% set pc_state = states('sensor.power_consumption') %}
            {% if is_number(pc_state) %}
              {% set house_w = pc_state | float(0) %}
            {% else %}
              {% set meter = 'sensor.zendure_grid_power' %}
              {% set grid_w = states(meter) | float(0) %}
              {% set output_w = states('sensor.solarflow_system_total_output') | float(0) %}
              {% set house_w = [output_w + grid_w, 0] | max %}
            {% endif %}
            {% set dis15_state = states('sensor.solarflow_discharge_mean_15m') %}
            {% set dis60_state = states('sensor.solarflow_discharge_mean_60s') %}
            {% set dis_now = states('sensor.solarflow_system_total_discharge_power_v24') | float(0) %}
            {% set dis15 = dis15_state | float(0) if is_number(dis15_state) else 0 %}
            {% set dis60 = dis60_state | float(0) if is_number(dis60_state) else 0 %}
            {% set effective_w = [house_w, dis15, dis60, dis_now, 80] | max %}
            {{ (total_wh / effective_w) | round(1) }}
          pretty: >
            {% set h = this.state | float(0) %}
            {% set total_min = (h * 60) | int(0) %}
            {% set hh = (total_min // 60) | int(0) %}
            {% set mm = (total_min % 60) | int(0) %}
            {{ '%02d:%02d' | format(hh, mm) }}

  - sensor:
      - name: "SolarFlow 1 Battery Level"
        unique_id: solarflow_1_battery_level
        default_entity_id: sensor.solarflow_1_battery_level
        device_class: battery
        state_class: measurement
        unit_of_measurement: "%"
        availability: >
          {% set hb = states.sensor.solarflow_1_status_raw %}
          {% set hb_ok = hb is not none and hb.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(hb.last_reported, 0)) < 300 %}
          {{ hb_ok and has_value('sensor.solarflow_1_battery_level_hub') }}
        state: >
          {{ states('sensor.solarflow_1_battery_level_hub') | int(0) }}

      - name: "SolarFlow 2 Battery Level"
        unique_id: solarflow_2_battery_level
        default_entity_id: sensor.solarflow_2_battery_level
        device_class: battery
        state_class: measurement
        unit_of_measurement: "%"
        availability: >
          {% set hb = states.sensor.solarflow_2_status_raw %}
          {% set hb_ok = hb is not none and hb.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(hb.last_reported, 0)) < 300 %}
          {{ hb_ok and has_value('sensor.solarflow_2_battery_level_hub') }}
        state: >
          {{ states('sensor.solarflow_2_battery_level_hub') | int(0) }}

      - name: "SolarFlow Total Solar Input"
        unique_id: solarflow_total_solar_input
        default_entity_id: sensor.solarflow_total_solar_input
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set on1 = states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] %}
          {% set on2 = states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] %}
          {% set v1 = states('sensor.solarflow_1_solar_input') | float(0) if (on1 and is_number(states('sensor.solarflow_1_solar_input'))) else 0 %}
          {% set v2 = states('sensor.solarflow_2_solar_input') | float(0) if (on2 and is_number(states('sensor.solarflow_2_solar_input'))) else 0 %}

          {{ (v1 + v2) | int }}

      - name: "SolarFlow Total Grid Input"
        unique_id: solarflow_total_grid_input
        default_entity_id: sensor.solarflow_total_grid_input
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set on1 = states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] %}
          {% set on2 = states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] %}
          {% set v1 = states('sensor.solarflow_1_grid_input_power') | float(0) if (on1 and is_number(states('sensor.solarflow_1_grid_input_power'))) else 0 %}
          {% set v2 = states('sensor.solarflow_2_grid_input_power') | float(0) if (on2 and is_number(states('sensor.solarflow_2_grid_input_power'))) else 0 %}

          {{ (v1 + v2) | int }}

      - name: "SolarFlow System Total Output"
        unique_id: solarflow_system_total_output
        default_entity_id: sensor.solarflow_system_total_output
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: "{{ states('sensor.solarflow_system_total_output_raw_async') | float(0) | round(0) }}"

      - name: "SolarFlow System Total Output Raw Async"
        unique_id: solarflow_system_total_output_raw_async
        default_entity_id: sensor.solarflow_system_total_output_raw_async
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set on1 = states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] %}
          {% set on2 = states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] %}
          {% set v1 = states('sensor.solarflow_1_output_power') | float(0) if (on1 and is_number(states('sensor.solarflow_1_output_power'))) else 0 %}
          {% set v2 = states('sensor.solarflow_2_output_power') | float(0) if (on2 and is_number(states('sensor.solarflow_2_output_power'))) else 0 %}
          {{ (v1 + v2) | int }}

      - name: "SolarFlow Output Timestamp Skew"
        unique_id: solarflow_output_timestamp_skew
        default_entity_id: sensor.solarflow_output_timestamp_skew
        unit_of_measurement: "s"
        state_class: measurement
        state: >
          {% set ts1 = as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_power_ts'), 0) %}
          {% set ts2 = as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_power_ts'), 0) %}
          {{ (ts1 - ts2) | abs | round(1) if ts1 > 0 and ts2 > 0 else none }}

      - name: "SolarFlow System Total Output Coherent"
        unique_id: solarflow_system_total_output_coherent
        default_entity_id: sensor.solarflow_system_total_output_coherent
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {% set now_ts = as_timestamp(now()) %}
          {% set ts1 = as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness','output_power_ts'), 0) %}
          {% set ts2 = as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness','output_power_ts'), 0) %}
          {% set on1 = states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] %}
          {% set on2 = states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] %}
          {% set f1 = on1 and ts1 > 0 and (now_ts - ts1) < 30 and is_number(states('sensor.solarflow_1_output_power')) %}
          {% set f2 = on2 and ts2 > 0 and (now_ts - ts2) < 30 and is_number(states('sensor.solarflow_2_output_power')) %}
          {{ (f1 and not on2) or (f2 and not on1) or (f1 and f2 and ((ts1 - ts2)|abs <= 3)) }}
        state: >
          {% set on1 = states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] %}
          {% set on2 = states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] %}
          {% set v1 = states('sensor.solarflow_1_output_power') | float(0) if on1 else 0 %}
          {% set v2 = states('sensor.solarflow_2_output_power') | float(0) if on2 else 0 %}
          {{ (v1 + v2) | int }}

      - name: "SolarFlow System Total Commanded"
        unique_id: solarflow_system_total_commanded
        default_entity_id: sensor.solarflow_system_total_commanded
        unit_of_measurement: "W"
        device_class: power
        state: >
          {{ (states('input_number.zendure_last_sent_1') | int(0)) +
             (states('input_number.zendure_last_sent_2') | int(0)) }}

      - name: "SolarFlow System Battery Level"
        unique_id: solarflow_system_battery_level
        default_entity_id: sensor.solarflow_system_battery_level
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        availability: >
          {% set s1 = states('sensor.solarflow_1_battery_level') | float(-1) %}
          {% set s2 = states('sensor.solarflow_2_battery_level') | float(-1) %}
          {{ s1 >= 0 or s2 >= 0 }}
        state: >
          {% set s1 = states('sensor.solarflow_1_battery_level') | float(-1) %}
          {% set s2 = states('sensor.solarflow_2_battery_level') | float(-1) %}
          {% set ns = namespace(sum=0, count=0) %}
          {% if s1 >= 0 %}{% set ns.sum = ns.sum + s1 %}{% set ns.count = ns.count + 1 %}{% endif %}
          {% if s2 >= 0 %}{% set ns.sum = ns.sum + s2 %}{% set ns.count = ns.count + 1 %}{% endif %}
          {{ (ns.sum / ns.count) | round(0) if ns.count > 0 else 0 }}

      - name: "SolarFlow 1 Cell Imbalance"
        unique_id: solarflow_1_cell_imbalance
        default_entity_id: sensor.solarflow_1_cell_imbalance
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        availability: >
          {% set hb = states.sensor.solarflow_1_status_raw %}
          {% set hb_ok = hb is not none and hb.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(hb.last_reported, 0)) < 300 %}
          {{ hb_ok and is_number(states('sensor.solarflow_1_cell_min_vol')) and is_number(states('sensor.solarflow_1_cell_max_vol')) }}
        state: >
          {% set min_v = states('sensor.solarflow_1_cell_min_vol') | float(0) %}
          {% set max_v = states('sensor.solarflow_1_cell_max_vol') | float(0) %}
          {{ [ (max_v - min_v) | round(3), 0 ] | max }}

      - name: "SolarFlow 2 Cell Imbalance"
        unique_id: solarflow_2_cell_imbalance
        default_entity_id: sensor.solarflow_2_cell_imbalance
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        availability: >
          {% set hb = states.sensor.solarflow_2_status_raw %}
          {% set hb_ok = hb is not none and hb.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(hb.last_reported, 0)) < 300 %}
          {{ hb_ok and is_number(states('sensor.solarflow_2_cell_min_vol')) and is_number(states('sensor.solarflow_2_cell_max_vol')) }}
        state: >
          {% set min_v = states('sensor.solarflow_2_cell_min_vol') | float(0) %}
          {% set max_v = states('sensor.solarflow_2_cell_max_vol') | float(0) %}
          {{ [ (max_v - min_v) | round(3), 0 ] | max }}

      - name: "SolarFlow 1 Output Block Reason"
        unique_id: solarflow_1_output_block_reason
        default_entity_id: sensor.solarflow_1_output_block_reason
        icon: mdi:shield-alert
        state: >
          {% set status = states('sensor.solarflow_1_status_raw') | upper %}
          {% set hb = states.sensor.solarflow_1_status_raw %}
          {% set now_ts = as_timestamp(now()) %}
          {% set hb_fresh = hb is not none and (now_ts - as_timestamp(hb.last_reported, 0)) < 300 %}
          {% set vmin_ts = as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness', 'vmin_ts'), 0) %}
          {% set batt_temp_ts = as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness', 'battery_temp_ts'), 0) %}
          {% set hub_temp_ts = as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness', 'hub_temp_ts'), 0) %}
          {% set vmin_valid_ts = as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness', 'vmin_valid_ts'), 0) %}
          {% set batt_temp_valid_ts = as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness', 'battery_temp_valid_ts'), 0) %}
          {% set hub_temp_valid_ts = as_timestamp(state_attr('sensor.solarflow_1_mqtt_freshness', 'hub_temp_valid_ts'), 0) %}
          {% set telemetry_seen = vmin_ts > 1 and batt_temp_ts > 1 and hub_temp_ts > 1 %}
          {% set vmin_age = now_ts - vmin_ts %}
          {% set batt_temp_age = now_ts - batt_temp_ts %}
          {% set hub_temp_age = now_ts - hub_temp_ts %}
          {% set vmin_valid_age = now_ts - vmin_valid_ts %}
          {% set batt_temp_valid_age = now_ts - batt_temp_valid_ts %}
          {% set hub_temp_valid_age = now_ts - hub_temp_valid_ts %}
          {% set soc = states('sensor.solarflow_1_battery_level') | float(-1) %}
          {% set soc_off = states('input_number.zendure_conf_soc_off') | float(20) %}
          {% set vmin_state = states('sensor.solarflow_1_cell_min_vol') %}
          {% set vmin = vmin_state | float(0) %}
          {% set reason = states('input_text.zendure_bypass_reason_u1') %}
          {% set batt_temp_state = states('sensor.solarflow_1_battery_temp_control') %}
          {% set hub_temp_state = states('sensor.solarflow_1_hub_temp_control') %}
          {% set batt_temp = batt_temp_state | float(999) %}
          {% set hub_temp = hub_temp_state | float(999) %}
          {% if status in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] %} status_offline
          {% elif not hb_fresh %} heartbeat_stale
          {% elif is_state('input_boolean.zendure_vguard_u1','on') %} vguard_latch
          {% elif is_state('input_boolean.zendure_emergency_u1','on') %} emergency_charge
          {% elif is_state('input_boolean.zendure_calib_mode_u1','on') %} calibration_mode
          {% elif is_state('input_boolean.zendure_calib_discharge_u1','on') %} discharging_calib
          {% elif soc < 0 %} soc_invalid
          {% elif is_state('input_boolean.zendure_bypass_u1','on') and reason == 'vmin_early_stop' %} vmin_early_stop
          {% elif is_state('input_boolean.zendure_bypass_u1','on') and reason == 'soc_off_stop' %} soc_off_guard
          {% elif soc <= soc_off %} soc_off_guard
          {% elif is_state('input_boolean.zendure_bypass_u1','on') %} bypass_wait_restart
          {% elif not telemetry_seen %} telemetry_initializing
          {% elif vmin_age >= 300 %} vmin_stale
          {% elif vmin_valid_age >= 300 or not is_number(vmin_state) or vmin <= 0 %} vmin_invalid
          {% elif vmin < 3.00 %} vmin_hard_guard
          {% elif vmin < 3.05 %} vmin_softcap_deep
          {% elif vmin < 3.12 %} vmin_pv_only_guard
          {% elif batt_temp_age >= 300 %} battery_temp_stale
          {% elif batt_temp_valid_age >= 300 or not is_number(batt_temp_state) %} battery_temp_invalid
          {% elif hub_temp_age >= 300 %} hub_temp_stale
          {% elif hub_temp_valid_age >= 300 or not is_number(hub_temp_state) %} hub_temp_invalid
          {% elif is_state('input_boolean.zendure_batt_temp_cooldown_u1','on') or batt_temp >= 58 %} battery_temp_cooldown_58
          {% elif is_state('input_boolean.zendure_hub_temp_cooldown_u1','on') or hub_temp >= 65 %} hub_temp_cooldown_65
          {% elif batt_temp >= 55 %} battery_temp_pv_only_55
          {% elif batt_temp >= 53 %} battery_temp_softcap_53
          {% elif batt_temp >= 50 %} battery_temp_softcap_50
          {% elif hub_temp >= 62 %} hub_temp_softcap_62
          {% elif hub_temp >= 60 %} hub_temp_softcap_60
          {% elif hub_temp >= 58 %} hub_temp_softcap_58
          {% elif hub_temp >= 55 %} hub_temp_softcap_55
          {% else %} freigegeben {% endif %}
      - name: "SolarFlow 2 Output Block Reason"
        unique_id: solarflow_2_output_block_reason
        default_entity_id: sensor.solarflow_2_output_block_reason
        icon: mdi:shield-alert
        state: >
          {% set status = states('sensor.solarflow_2_status_raw') | upper %}
          {% set hb = states.sensor.solarflow_2_status_raw %}
          {% set now_ts = as_timestamp(now()) %}
          {% set hb_fresh = hb is not none and (now_ts - as_timestamp(hb.last_reported, 0)) < 300 %}
          {% set vmin_ts = as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness', 'vmin_ts'), 0) %}
          {% set batt_temp_ts = as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness', 'battery_temp_ts'), 0) %}
          {% set hub_temp_ts = as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness', 'hub_temp_ts'), 0) %}
          {% set vmin_valid_ts = as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness', 'vmin_valid_ts'), 0) %}
          {% set batt_temp_valid_ts = as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness', 'battery_temp_valid_ts'), 0) %}
          {% set hub_temp_valid_ts = as_timestamp(state_attr('sensor.solarflow_2_mqtt_freshness', 'hub_temp_valid_ts'), 0) %}
          {% set telemetry_seen = vmin_ts > 1 and batt_temp_ts > 1 and hub_temp_ts > 1 %}
          {% set vmin_age = now_ts - vmin_ts %}
          {% set batt_temp_age = now_ts - batt_temp_ts %}
          {% set hub_temp_age = now_ts - hub_temp_ts %}
          {% set vmin_valid_age = now_ts - vmin_valid_ts %}
          {% set batt_temp_valid_age = now_ts - batt_temp_valid_ts %}
          {% set hub_temp_valid_age = now_ts - hub_temp_valid_ts %}
          {% set soc = states('sensor.solarflow_2_battery_level') | float(-1) %}
          {% set soc_off = states('input_number.zendure_conf_soc_off') | float(20) %}
          {% set vmin_state = states('sensor.solarflow_2_cell_min_vol') %}
          {% set vmin = vmin_state | float(0) %}
          {% set reason = states('input_text.zendure_bypass_reason_u2') %}
          {% set batt_temp_state = states('sensor.solarflow_2_battery_temp_control') %}
          {% set hub_temp_state = states('sensor.solarflow_2_hub_temp_control') %}
          {% set batt_temp = batt_temp_state | float(999) %}
          {% set hub_temp = hub_temp_state | float(999) %}
          {% if status in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] %} status_offline
          {% elif not hb_fresh %} heartbeat_stale
          {% elif is_state('input_boolean.zendure_vguard_u2','on') %} vguard_latch
          {% elif is_state('input_boolean.zendure_emergency_u2','on') %} emergency_charge
          {% elif is_state('input_boolean.zendure_calib_mode_u2','on') %} calibration_mode
          {% elif is_state('input_boolean.zendure_calib_discharge_u2','on') %} discharging_calib
          {% elif soc < 0 %} soc_invalid
          {% elif is_state('input_boolean.zendure_bypass_u2','on') and reason == 'vmin_early_stop' %} vmin_early_stop
          {% elif is_state('input_boolean.zendure_bypass_u2','on') and reason == 'soc_off_stop' %} soc_off_guard
          {% elif soc <= soc_off %} soc_off_guard
          {% elif is_state('input_boolean.zendure_bypass_u2','on') %} bypass_wait_restart
          {% elif not telemetry_seen %} telemetry_initializing
          {% elif vmin_age >= 300 %} vmin_stale
          {% elif vmin_valid_age >= 300 or not is_number(vmin_state) or vmin <= 0 %} vmin_invalid
          {% elif vmin < 3.00 %} vmin_hard_guard
          {% elif vmin < 3.05 %} vmin_softcap_deep
          {% elif vmin < 3.12 %} vmin_pv_only_guard
          {% elif batt_temp_age >= 300 %} battery_temp_stale
          {% elif batt_temp_valid_age >= 300 or not is_number(batt_temp_state) %} battery_temp_invalid
          {% elif hub_temp_age >= 300 %} hub_temp_stale
          {% elif hub_temp_valid_age >= 300 or not is_number(hub_temp_state) %} hub_temp_invalid
          {% elif is_state('input_boolean.zendure_batt_temp_cooldown_u2','on') or batt_temp >= 58 %} battery_temp_cooldown_58
          {% elif is_state('input_boolean.zendure_hub_temp_cooldown_u2','on') or hub_temp >= 65 %} hub_temp_cooldown_65
          {% elif batt_temp >= 55 %} battery_temp_pv_only_55
          {% elif batt_temp >= 53 %} battery_temp_softcap_53
          {% elif batt_temp >= 50 %} battery_temp_softcap_50
          {% elif hub_temp >= 62 %} hub_temp_softcap_62
          {% elif hub_temp >= 60 %} hub_temp_softcap_60
          {% elif hub_temp >= 58 %} hub_temp_softcap_58
          {% elif hub_temp >= 55 %} hub_temp_softcap_55
          {% else %} freigegeben {% endif %}
      - name: "SolarFlow System Total Charge Power V24"
        unique_id: solarflow_system_total_charge_power_v24
        default_entity_id: sensor.solarflow_system_total_charge_power_v24
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set solar = states('sensor.solarflow_total_solar_input') | float(0) %}
          {% set grid_in = states('sensor.solarflow_total_grid_input') | float(0) %}
          {% set output = states('sensor.solarflow_system_total_output') | float(0) %}
          {% set total_in = solar + grid_in %}
          {% set diff = total_in - output %}
          {{ diff if diff > 0 else 0 }}

      - name: "SolarFlow System Total Discharge Power V24"
        unique_id: solarflow_system_total_discharge_power_v24
        default_entity_id: sensor.solarflow_system_total_discharge_power_v24
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set solar = states('sensor.solarflow_total_solar_input') | float(0) %}
          {% set grid_in = states('sensor.solarflow_total_grid_input') | float(0) %}
          {% set output = states('sensor.solarflow_system_total_output') | float(0) %}
          {% set total_in = solar + grid_in %}
          {% set diff = output - total_in %}
          {{ diff if diff > 0 else 0 }}

      - name: "SolarFlow Remaining Energy"
        unique_id: solarflow_remaining_energy_wh
        default_entity_id: sensor.solarflow_remaining_energy
        unit_of_measurement: "Wh"
        state: >
          {% set soc1 = states('sensor.solarflow_1_battery_level') | float(0) %}
          {% set soc2 = states('sensor.solarflow_2_battery_level') | float(0) %}
          {% set c1 = states('input_number.zendure_conf_u1_capacity_wh') | float(1920) %}
          {% set c2 = states('input_number.zendure_conf_u2_capacity_wh') | float(1920) %}
          {% set wh1 = (c1 * soc1 / 100) %}
          {% set wh2 = (c2 * soc2 / 100) %}
          {{ [wh1 + wh2, 0] | max | round(0) }}

      - name: "SolarFlow Remaining Usable Energy"
        unique_id: solarflow_remaining_usable_energy_wh
        default_entity_id: sensor.solarflow_remaining_usable_energy
        unit_of_measurement: "Wh"
        state: >
          {% set soc1 = states('sensor.solarflow_1_battery_level') | float(0) %}
          {% set soc2 = states('sensor.solarflow_2_battery_level') | float(0) %}
          {% set c1 = states('input_number.zendure_conf_u1_capacity_wh') | float(1920) %}
          {% set c2 = states('input_number.zendure_conf_u2_capacity_wh') | float(1920) %}
          {% set soc_off = states('input_number.zendure_conf_soc_off') | float(20) %}
          {% set usable1 = c1 * ((soc1 - soc_off) / 100) %}
          {% set usable2 = c2 * ((soc2 - soc_off) / 100) %}
          {{ [usable1 + usable2, 0] | max | round(0) }}

