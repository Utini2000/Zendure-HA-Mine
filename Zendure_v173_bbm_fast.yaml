# ==============================================================================
# 2. MQTT SENSOREN
# ==============================================================================
mqtt:
  sensor:
    # --- UNIT 1 ---
    - name: "SolarFlow 1 Solar Input Total"
      unique_id: solarflow_1_solar_input_mqtt
      default_entity_id: sensor.solarflow_1_solar_input
      state_topic: !secret zendure_topic_u1_sensor_solarInputPower
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement

    - name: "SolarFlow 1 Solar Power 1"
      unique_id: solarflow_1_solar_power_1_mqtt
      default_entity_id: sensor.solarflow_1_solar_power_1
      state_topic: !secret zendure_topic_u1_sensor_solarpower1
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      entity_category: diagnostic
      value_template: >
        {% set v = value | float(none) %}
        {% if v is none %}{{ 'unavailable' }}{% else %}{{ [v, 0] | max | round(0) }}{% endif %}

    - name: "SolarFlow 1 Solar Power 2"
      unique_id: solarflow_1_solar_power_2_mqtt
      default_entity_id: sensor.solarflow_1_solar_power_2
      state_topic: !secret zendure_topic_u1_sensor_solarpower2
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      entity_category: diagnostic
      value_template: >
        {% set v = value | float(none) %}
        {% if v is none %}{{ 'unavailable' }}{% else %}{{ [v, 0] | max | round(0) }}{% endif %}

    - name: "SolarFlow 1 Solar Power 3"
      unique_id: solarflow_1_solar_power_3_mqtt
      default_entity_id: sensor.solarflow_1_solar_power_3
      state_topic: !secret zendure_topic_u1_sensor_solarpower3
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      entity_category: diagnostic
      value_template: >
        {% set v = value | float(none) %}
        {% if v is none %}{{ 'unavailable' }}{% else %}{{ [v, 0] | max | round(0) }}{% endif %}

    - name: "SolarFlow 1 Solar Power 4"
      unique_id: solarflow_1_solar_power_4_mqtt
      default_entity_id: sensor.solarflow_1_solar_power_4
      state_topic: !secret zendure_topic_u1_sensor_solarpower4
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      entity_category: diagnostic
      value_template: >
        {% set v = value | float(none) %}
        {% if v is none %}{{ 'unavailable' }}{% else %}{{ [v, 0] | max | round(0) }}{% endif %}

    - name: "SolarFlow 1 Grid Input Power"
      unique_id: solarflow_1_grid_input_mqtt
      default_entity_id: sensor.solarflow_1_grid_input_power
      state_topic: !secret zendure_topic_u1_sensor_gridInputPower
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement

    - name: "SolarFlow 1 Battery Level Hub"
      unique_id: solarflow_1_battery_level_mqtt
      default_entity_id: sensor.solarflow_1_battery_level_hub
      state_topic: !secret zendure_topic_u1_sensor_electricLevel
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement

    - name: "SolarFlow 1 Output Power"
      unique_id: solarflow_1_output_power_mqtt
      default_entity_id: sensor.solarflow_1_output_power
      state_topic: !secret zendure_topic_u1_sensor_outputHomePower
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement

    - name: "SolarFlow 1 Output Limit"
      unique_id: solarflow_1_output_limit_mqtt
      default_entity_id: sensor.solarflow_1_output_limit
      state_topic: !secret zendure_topic_u1_number_outputLimit
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      entity_category: diagnostic

    - name: "SolarFlow 1 AC Mode"
      unique_id: solarflow_1_ac_mode_mqtt
      default_entity_id: sensor.solarflow_1_ac_mode
      state_topic: !secret zendure_topic_u1_select_acMode
      entity_category: diagnostic

    - name: "SolarFlow 1 Setting MinSoC"
      unique_id: solarflow_1_setting_minsoc
      default_entity_id: sensor.solarflow_1_setting_minsoc
      state_topic: !secret zendure_topic_u1_number_minSoc
      unit_of_measurement: "%"
      entity_category: diagnostic

    - name: "SolarFlow 1 ChargeLimit Last Set"
      unique_id: solarflow_1_setting_chargelimit
      default_entity_id: sensor.solarflow_1_setting_chargelimit
      state_topic: !secret zendure_topic_u1_number_chargeMaxLimit_set
      unit_of_measurement: "W"
      entity_category: diagnostic
      value_template: >
        {% set v = value | float(none) %}
        {% if v is not none %}{{ [0, [v | int(0), 800] | min] | max }}
        {% else %}{{ states('input_number.zendure_last_chargelimit_u1') | int(800) }}{% endif %}

    - name: "SolarFlow 1 Input Limit"
      unique_id: solarflow_1_input_limit_mqtt
      default_entity_id: sensor.solarflow_1_input_limit
      state_topic: !secret zendure_topic_u1_number_inputLimit
      unit_of_measurement: "W"
      device_class: power
      entity_category: diagnostic
      value_template: >
        {% set v = value | float(none) %}
        {% if v is not none %}
          {{ [0, [v | int(0), 800] | min] | max }}
        {% else %}
          {{ states('input_number.zendure_last_inputlimit_u1') | int(0) }}
        {% endif %}

    - name: "SolarFlow 1 Temp"
      unique_id: solarflow_1_temp_mqtt
      default_entity_id: sensor.solarflow_1_temp
      state_topic: !secret zendure_topic_u1_sensor_hyperTmp
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      value_template: >
        {% set raw = value | float(none) %}
        {% set previous = states(entity_id) | float(none) %}
        {% if raw is none %}
          {{ previous | round(1) if previous is not none else none }}
        {% else %}
          {% if raw > 1000 %}
            {% set val = (raw - 2731) / 10 %}
          {% elif raw > 150 %}
            {% set val = raw - 273.1 %}
          {% else %}
            {% set val = raw %}
          {% endif %}
          {% if val >= -30 and val <= 100 %}
            {{ val | round(1) }}
          {% elif previous is not none and previous >= -30 and previous <= 100 %}
            {{ previous | round(1) }}
          {% else %}
            {{ none }}
          {% endif %}
        {% endif %}

    - name: "SolarFlow 1 Heizung"
      unique_id: solarflow_1_heat_state
      default_entity_id: sensor.solarflow_1_heizung
      state_topic: !secret zendure_topic_u1_sensor_heatState
      icon: mdi:radiator
      value_template: >
        {% if value == 'not_heating' %} Inaktiv
        {% else %} Aktiv {% endif %}

    - name: "SolarFlow 1 Bypass Status"
      unique_id: solarflow_1_pass_state
      state_topic: !secret zendure_topic_u1_sensor_pass
      icon: mdi:arrow-split-vertical
      value_template: >
        {% if value == 'yes' %} Aktiv
        {% else %} Inaktiv {% endif %}

    - name: "SolarFlow 1 BMS Leistung"
      unique_id: solarflow_1_bms_power
      state_topic: !secret zendure_topic_battery1_sensor_power
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      value_template: >
        {% set v = value | float(none) %}
        {% if v is none or v < 0 or v > 1200 %} {{ 'unavailable' }}
        {% else %} {{ v | round(0) }} {% endif %}

    - name: "SolarFlow 1 Battery Max Temp"
      unique_id: solarflow_1_batt_max_temp
      default_entity_id: sensor.solarflow_1_battery_max_temp
      state_topic: !secret zendure_topic_battery1_sensor_maxTemp
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      value_template: >
        {% set raw = value | float(none) %}
        {% set previous = states(entity_id) | float(none) %}
        {% if raw is none %}
          {{ previous | round(1) if previous is not none else none }}
        {% else %}
          {% if raw > 1000 %}
            {% set val = (raw - 2731) / 10 %}
          {% elif raw > 150 %}
            {% set val = raw - 273.1 %}
          {% else %}
            {% set val = raw %}
          {% endif %}
          {% if val >= -30 and val <= 90 %}
            {{ val | round(1) }}
          {% elif previous is not none and previous >= -30 and previous <= 90 %}
            {{ previous | round(1) }}
          {% else %}
            {{ none }}
          {% endif %}
        {% endif %}

    - name: "SolarFlow 1 Cell Max Vol"
      unique_id: solarflow_1_cell_max_vol
      default_entity_id: sensor.solarflow_1_cell_max_vol
      state_topic: !secret zendure_topic_battery1_sensor_maxVol
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      value_template: >
        {% set raw = value | float(none) %}
        {% set previous = states(entity_id) | float(none) %}
        {% if raw is none %}
          {% set val = none %}
        {% elif raw > 2000 %}
          {% set val = raw / 1000 %}
        {% elif raw > 20 %}
          {% set val = raw / 100 %}
        {% else %}
          {% set val = raw %}
        {% endif %}
        {% if val is not none and val > 0.5 and val < 5.5 %}
          {{ val | round(3) }}
        {% elif previous is not none and previous > 0.5 and previous < 5.5 %}
          {{ previous | round(3) }}
        {% else %}
          {{ none }}
        {% endif %}

    - name: "SolarFlow 1 Cell Min Vol"
      unique_id: solarflow_1_cell_min_vol
      default_entity_id: sensor.solarflow_1_cell_min_vol
      state_topic: !secret zendure_topic_battery1_sensor_minVol
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      value_template: >
        {% set raw = value | float(none) %}
        {% set previous = states(entity_id) | float(none) %}
        {% if raw is none %}
          {% set val = none %}
        {% elif raw > 2000 %}
          {% set val = raw / 1000 %}
        {% elif raw > 20 %}
          {% set val = raw / 100 %}
        {% else %}
          {% set val = raw %}
        {% endif %}
        {% if val is not none and val > 0.5 and val < 5.5 %}
          {{ val | round(3) }}
        {% elif previous is not none and previous > 0.5 and previous < 5.5 %}
          {{ previous | round(3) }}
        {% else %}
          {{ none }}
        {% endif %}


    # --- UNIT 2 ---
    - name: "SolarFlow 2 Solar Input Total"
      unique_id: solarflow_2_solar_input_mqtt
      default_entity_id: sensor.solarflow_2_solar_input
      state_topic: !secret zendure_topic_u2_sensor_solarInputPower
