  # --- 6.6c VOLTAGE GUARD LATCH MANAGER ---
  - alias: "Zendure: Voltage Guard Latch Manager"
    id: "zendure_voltage_guard_latch_manager"
    mode: queued
    initial_state: true
    triggers:
      - trigger: template
        id: "set_u1"
        value_template: >
          {% set vmin_s = states.sensor.solarflow_1_cell_min_vol %}
          {% set stat = states.sensor.solarflow_1_status_raw %}
          {% set hb_ok = stat is not none and stat.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] %}
          {% set vmin_fresh = hb_ok and vmin_s is not none and is_number(vmin_s.state) and (vmin_s.state|float(0)) > 2.0 %}
          {% set out_pwr = states('sensor.solarflow_1_output_power')|float(0) %}
          {% set min_out = states('input_number.zendure_conf_vguard_set_min_output')|float(30) %}
          {% set soc = states('sensor.solarflow_1_battery_level')|float(100) %}
          {% set soc_guard = (states('input_number.zendure_conf_soc_off')|float(20)) + 8 %}
          {{ is_state('input_boolean.zendure_auto_mode','on')
             and is_state('input_boolean.zendure_vguard_u1','off')
             and is_state('input_boolean.zendure_emergency_u1','off')
             and is_state('input_boolean.zendure_calib_mode_u1','off')
             and is_state('input_boolean.zendure_calib_discharge_u1','off')
             and states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
             and soc <= soc_guard
             and vmin_fresh
             and vmin_s.state|float(99) <= 3.02
             and out_pwr > min_out }}
        for: "00:01:00"
      - trigger: template
        id: "set_u1_hard"
        value_template: >
          {% set vmin = states('sensor.solarflow_1_cell_min_vol')|float(99) %}
          {% set soc = states('sensor.solarflow_1_battery_level')|float(100) %}
          {% set soc_guard_hard = (states('input_number.zendure_conf_soc_off')|float(20)) + 4 %}
          {{ is_state('input_boolean.zendure_auto_mode','on')
             and is_state('input_boolean.zendure_vguard_u1','off')
             and is_state('input_boolean.zendure_emergency_u1','off')
             and is_state('input_boolean.zendure_calib_mode_u1','off')
             and is_state('input_boolean.zendure_calib_discharge_u1','off')
             and states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
             and soc <= soc_guard_hard
             and vmin > 2.0
             and vmin <= 2.95 }}
        for: "00:01:00"
      - trigger: template
        id: "clear_u1"
        value_template: >
          {% set soc_bypass = states('input_number.zendure_conf_soc_bypass') | float(25) %}
          {% set soc_off = states('input_number.zendure_conf_soc_off') | float(20) %}
          {% set soc_exit = [soc_bypass, soc_off + 3] | max %}
          {% set soc = states('sensor.solarflow_1_battery_level')|float(0) %}
          {% set vmin = states('sensor.solarflow_1_cell_min_vol')|float(0) %}
          {% set pv = states('sensor.solarflow_1_solar_input')|float(0) %}
          {{ is_state('input_boolean.zendure_vguard_u1','on')
             and soc >= soc_exit
             and (vmin > 3.20 or (pv > 20 and soc >= soc_exit)) }}
        for: "00:10:00"
      - trigger: template
        id: "set_u2"
        value_template: >
          {% set vmin_s = states.sensor.solarflow_2_cell_min_vol %}
          {% set stat = states.sensor.solarflow_2_status_raw %}
          {% set hb_ok = stat is not none and stat.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] %}
          {% set vmin_fresh = hb_ok and vmin_s is not none and is_number(vmin_s.state) and (vmin_s.state|float(0)) > 2.0 %}
          {% set out_pwr = states('sensor.solarflow_2_output_power')|float(0) %}
          {% set min_out = states('input_number.zendure_conf_vguard_set_min_output')|float(30) %}
          {% set soc = states('sensor.solarflow_2_battery_level')|float(100) %}
          {% set soc_guard = (states('input_number.zendure_conf_soc_off')|float(20)) + 8 %}
          {{ is_state('input_boolean.zendure_auto_mode','on')
             and is_state('input_boolean.zendure_vguard_u2','off')
             and is_state('input_boolean.zendure_emergency_u2','off')
             and is_state('input_boolean.zendure_calib_mode_u2','off')
             and is_state('input_boolean.zendure_calib_discharge_u2','off')
             and states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
             and soc <= soc_guard
             and vmin_fresh
             and vmin_s.state|float(99) <= 3.02
             and out_pwr > min_out }}
        for: "00:01:00"
      - trigger: template
        id: "set_u2_hard"
        value_template: >
          {% set vmin = states('sensor.solarflow_2_cell_min_vol')|float(99) %}
          {% set soc = states('sensor.solarflow_2_battery_level')|float(100) %}
          {% set soc_guard_hard = (states('input_number.zendure_conf_soc_off')|float(20)) + 4 %}
          {{ is_state('input_boolean.zendure_auto_mode','on')
             and is_state('input_boolean.zendure_vguard_u2','off')
             and is_state('input_boolean.zendure_emergency_u2','off')
             and is_state('input_boolean.zendure_calib_mode_u2','off')
             and is_state('input_boolean.zendure_calib_discharge_u2','off')
             and states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
             and soc <= soc_guard_hard
             and vmin > 2.0
             and vmin <= 2.95 }}
        for: "00:01:00"
      - trigger: template
        id: "clear_u2"
        value_template: >
          {% set soc_bypass = states('input_number.zendure_conf_soc_bypass') | float(25) %}
          {% set soc_off = states('input_number.zendure_conf_soc_off') | float(20) %}
          {% set soc_exit = [soc_bypass, soc_off + 3] | max %}
          {% set soc = states('sensor.solarflow_2_battery_level')|float(0) %}
          {% set vmin = states('sensor.solarflow_2_cell_min_vol')|float(0) %}
          {% set pv = states('sensor.solarflow_2_solar_input')|float(0) %}
          {{ is_state('input_boolean.zendure_vguard_u2','on')
             and soc >= soc_exit
             and (vmin > 3.20 or (pv > 20 and soc >= soc_exit)) }}
        for: "00:10:00"
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.id in ['set_u1','set_u1_hard'] }}"
            sequence:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_vguard_u1 }
              - action: script.zendure_set_u1_outputlimit_zero
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_last_sent_1 }
                data: { value: 0 }
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'clear_u1' }}"
            sequence:
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.zendure_vguard_u1 }
          - conditions:
              - condition: template
                value_template: "{{ trigger.id in ['set_u2','set_u2_hard'] }}"
            sequence:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_vguard_u2 }
              - action: script.zendure_set_u2_outputlimit_zero
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_last_sent_2 }
                data: { value: 0 }
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'clear_u2' }}"
            sequence:
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.zendure_vguard_u2 }

  # --- 6.6d CALIBRATION MANAGER (Top-Balancing) ---
  - alias: "Zendure: Force Calibration on Suspicious SoC Drift"
    id: "zendure_force_calib_on_soc_drift"
    mode: single
    initial_state: true
    triggers:
      - trigger: homeassistant
        event: start
        id: boot
      - trigger: time_pattern
        minutes: "/10"
        id: check

    actions:
      - variables:
          ts_now: "{{ as_timestamp(now()) | int(0) }}"

      # --- Initialisierung nach HA-Start ---
      - if:
          - condition: template
            value_template: "{{ trigger.id == 'boot' }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_soc_drift_ref_u1 }
            data:
              value: "{{ states('sensor.solarflow_1_battery_level') | int(0) }}"
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_soc_drift_ref_ts_u1 }
            data:
              timestamp: "{{ ts_now }}"

          - action: input_number.set_value
            target: { entity_id: input_number.zendure_soc_drift_ref_u2 }
            data:
              value: "{{ states('sensor.solarflow_2_battery_level') | int(0) }}"
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_soc_drift_ref_ts_u2 }
            data:
              timestamp: "{{ ts_now }}"

      # --- Prüfen alle 10 Minuten ---
        else:
          - variables:
              soc1: "{{ states('sensor.solarflow_1_battery_level') | int(-1) }}"
              soc2: "{{ states('sensor.solarflow_2_battery_level') | int(-1) }}"

              ref_soc1: "{{ states('input_number.zendure_soc_drift_ref_u1') | int(-1) }}"
              ref_soc2: "{{ states('input_number.zendure_soc_drift_ref_u2') | int(-1) }}"

              age_min1: "{{ ((ts_now - (as_timestamp(states('input_datetime.zendure_soc_drift_ref_ts_u1'), default=0) | int(0))) / 60) | float(0) }}"
              age_min2: "{{ ((ts_now - (as_timestamp(states('input_datetime.zendure_soc_drift_ref_ts_u2'), default=0) | int(0))) / 60) | float(0) }}"

              drop1: >-
                {% set cur = states('sensor.solarflow_1_battery_level') | int(-1) %}
                {% set ref = states('input_number.zendure_soc_drift_ref_u1') | int(-1) %}
                {{ (ref - cur) if cur >= 0 and ref >= 0 else 0 }}

              drop2: >-
                {% set cur = states('sensor.solarflow_2_battery_level') | int(-1) %}
                {% set ref = states('input_number.zendure_soc_drift_ref_u2') | int(-1) %}
                {{ (ref - cur) if cur >= 0 and ref >= 0 else 0 }}

              suspicious_u1: >-
                {% set soc = states('sensor.solarflow_1_battery_level') | int(-1) %}
                {% set ref = states('input_number.zendure_soc_drift_ref_u1') | int(-1) %}
                {% set drop = (ref - soc) if soc >= 0 and ref >= 0 else 0 %}
                {% set ref_ts = as_timestamp(states('input_datetime.zendure_soc_drift_ref_ts_u1'), default=0) | int(0) %}
                {% set age_min = ((as_timestamp(now()) - ref_ts) / 60) | float(0) %}
                {% set vmin = states('sensor.solarflow_1_cell_min_vol') | float(99) %}
                {% set s = states.sensor.solarflow_1_status_raw %}
                {% set last_full = as_timestamp(states('input_datetime.zendure_last_full_charge_1'), default=0) %}
                {% set full_age_h = ((as_timestamp(now()) - last_full) / 3600) if last_full > 0 else 999 %}
                {% set fresh = s is not none and s.state | upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(s.last_reported, 0)) < 120 %}
                {% set quiet = states('sensor.solarflow_1_output_power') | float(0) < 50
                               and states('sensor.solarflow_1_output_limit') | float(0) < 50
                               and states('input_number.zendure_last_sent_1') | float(0) < 50
                               and states('sensor.solarflow_1_grid_input_power') | float(0) < 50
                               and not is_state('input_boolean.zendure_calib_mode_u1', 'on')
                               and not is_state('input_boolean.zendure_emergency_u1', 'on') %}
                {{ fresh
                   and age_min >= 10
                   and soc >= 0 and soc <= 35
                   and ref >= 0 and ref <= 35
                   and drop >= 8
                   and quiet
                   and (is_state('input_boolean.zendure_vguard_u1','on') or vmin < 3.15)
                   and full_age_h >= 48
                   and not is_state('input_boolean.zendure_force_calib_u1', 'on') }}

              suspicious_u2: >-
                {% set soc = states('sensor.solarflow_2_battery_level') | int(-1) %}
                {% set ref = states('input_number.zendure_soc_drift_ref_u2') | int(-1) %}
                {% set drop = (ref - soc) if soc >= 0 and ref >= 0 else 0 %}
                {% set ref_ts = as_timestamp(states('input_datetime.zendure_soc_drift_ref_ts_u2'), default=0) | int(0) %}
                {% set age_min = ((as_timestamp(now()) - ref_ts) / 60) | float(0) %}
                {% set vmin = states('sensor.solarflow_2_cell_min_vol') | float(99) %}
                {% set s = states.sensor.solarflow_2_status_raw %}
                {% set last_full = as_timestamp(states('input_datetime.zendure_last_full_charge_2'), default=0) %}
                {% set full_age_h = ((as_timestamp(now()) - last_full) / 3600) if last_full > 0 else 999 %}
                {% set fresh = s is not none and s.state | upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(s.last_reported, 0)) < 120 %}
                {% set quiet = states('sensor.solarflow_2_output_power') | float(0) < 50
                               and states('sensor.solarflow_2_output_limit') | float(0) < 50
                               and states('input_number.zendure_last_sent_2') | float(0) < 50
                               and states('sensor.solarflow_2_grid_input_power') | float(0) < 50
                               and not is_state('input_boolean.zendure_calib_mode_u2', 'on')
                               and not is_state('input_boolean.zendure_emergency_u2', 'on') %}
                {{ fresh
                   and age_min >= 10
                   and soc >= 0 and soc <= 35
                   and ref >= 0 and ref <= 35
                   and drop >= 8
                   and quiet
                   and (is_state('input_boolean.zendure_vguard_u2','on') or vmin < 3.15)
                   and full_age_h >= 48
                   and not is_state('input_boolean.zendure_force_calib_u2', 'on') }}

          # --- Unit 1 markieren ---
          - if:
              - condition: template
                value_template: "{{ suspicious_u1 }}"
            then:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_force_calib_u1 }
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id1
                data:
                  message: >
                    🧭 *Calibration U1 queued (next low-PV window)*
                    Suspicious SoC drop detected without matching energy output
                    (ΔSoC {{ drop1 }}% in {{ age_min1 | round(0) }} min, vmin {{ states('sensor.solarflow_1_cell_min_vol') | float(0) | round(3) }} V).

          # --- Unit 2 markieren ---
          - if:
              - condition: template
                value_template: "{{ suspicious_u2 }}"
            then:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_force_calib_u2 }
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id1
                data:
                  message: >
                    🧭 *Calibration U2 queued (next low-PV window)*
                    Suspicious SoC drop detected without matching energy output
                    (ΔSoC {{ drop2 }}% in {{ age_min2 | round(0) }} min, vmin {{ states('sensor.solarflow_2_cell_min_vol') | float(0) | round(3) }} V).

          # --- Referenzfenster immer neu setzen ---
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_soc_drift_ref_u1 }
            data:
              value: "{{ states('sensor.solarflow_1_battery_level') | int(0) }}"
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_soc_drift_ref_ts_u1 }
            data:
              timestamp: "{{ ts_now }}"

          - action: input_number.set_value
            target: { entity_id: input_number.zendure_soc_drift_ref_u2 }
            data:
              value: "{{ states('sensor.solarflow_2_battery_level') | int(0) }}"
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_soc_drift_ref_ts_u2 }
            data:
              timestamp: "{{ ts_now }}"

  - alias: "Zendure: Natural Full-Charge Tracker"
    id: "zendure_natural_full_charge_tracker"
    mode: queued
    initial_state: true
    triggers:
      - trigger: time_pattern
        minutes: "/1"
        id: "check"

      # --- U1: echte 100%-Full-Hold-Phase startet ---
      # Zweck: Der 14-Tage-Timer soll schon dann zurückgesetzt werden,
      # wenn die Unit im normalen Betrieb wirklich 100% fuer 30 min erreicht.
      # Die Zellspreizung wird hier bewusst NICHT mehr als Voraussetzung genutzt;
      # Top-Balancing mit Imbalance-Check passiert nur in der eigentlichen
      # Kalibrierung (calib_mode).
      - trigger: template
        id: "u1_full_hold_start"
        value_template: >
          {% set full_start = as_timestamp(states('input_datetime.zendure_natural_full_hold_start_u1'), default=0) %}
          {{ states('sensor.solarflow_1_battery_level')|float(0) > 99.5
             and is_state('input_boolean.zendure_emergency_u1','off')
             and is_state('input_boolean.zendure_calib_discharge_u1','off')
             and is_state('input_boolean.zendure_calib_mode_u1','off')
             and full_start < 946684800 }}

      # --- U2: echte 100%-Full-Hold-Phase startet ---
      - trigger: template
        id: "u2_full_hold_start"
        value_template: >
          {% set full_start = as_timestamp(states('input_datetime.zendure_natural_full_hold_start_u2'), default=0) %}
          {{ states('sensor.solarflow_2_battery_level')|float(0) > 99.5
             and is_state('input_boolean.zendure_emergency_u2','off')
             and is_state('input_boolean.zendure_calib_discharge_u2','off')
             and is_state('input_boolean.zendure_calib_mode_u2','off')
             and full_start < 946684800 }}

      # --- U1: Full-Hold zuruecksetzen, wenn 100% nicht mehr anliegt oder Spezialmodus aktiv wird ---
      - trigger: template
        id: "u1_reset"
        value_template: >
          {% set full_start = as_timestamp(states('input_datetime.zendure_natural_full_hold_start_u1'), default=0) %}
          {{ (
               states('sensor.solarflow_1_battery_level')|float(0) < 99.3
               or is_state('input_boolean.zendure_emergency_u1','on')
               or is_state('input_boolean.zendure_calib_discharge_u1','on')
               or is_state('input_boolean.zendure_calib_mode_u1','on')
             )
             and full_start > 946684800 }}

      # --- U2: Full-Hold zuruecksetzen, wenn 100% nicht mehr anliegt oder Spezialmodus aktiv wird ---
      - trigger: template
        id: "u2_reset"
        value_template: >
          {% set full_start = as_timestamp(states('input_datetime.zendure_natural_full_hold_start_u2'), default=0) %}
          {{ (
               states('sensor.solarflow_2_battery_level')|float(0) < 99.3
               or is_state('input_boolean.zendure_emergency_u2','on')
               or is_state('input_boolean.zendure_calib_discharge_u2','on')
               or is_state('input_boolean.zendure_calib_mode_u2','on')
             )
             and full_start > 946684800 }}

    conditions:
      - condition: state
        entity_id: input_boolean.zendure_auto_mode
        state: "on"

    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'u1_full_hold_start' }}"
            sequence:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_natural_full_hold_start_u1 }
                data: { timestamp: "{{ as_timestamp(now()) | int }}" }
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_natural_balance_start_u1 }
                data: { timestamp: 0 }

          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'u2_full_hold_start' }}"
            sequence:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_natural_full_hold_start_u2 }
                data: { timestamp: "{{ as_timestamp(now()) | int }}" }
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_natural_balance_start_u2 }
                data: { timestamp: 0 }

          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'u1_reset' }}"
            sequence:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_natural_full_hold_start_u1 }
                data: { timestamp: 0 }
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_natural_balance_start_u1 }
                data: { timestamp: 0 }

          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'u2_reset' }}"
            sequence:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_natural_full_hold_start_u2 }
                data: { timestamp: 0 }
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_natural_balance_start_u2 }
                data: { timestamp: 0 }

      # --- U1: 100% mindestens 30 Minuten gehalten -> 14-Tage-Timer zuruecksetzen ---
      - if:
          - condition: template
            value_template: >
              {% set now_ts = as_timestamp(now()) %}
              {% set full_start = as_timestamp(states('input_datetime.zendure_natural_full_hold_start_u1'), default=0) %}
              {% set last_full = as_timestamp(states('input_datetime.zendure_last_full_charge_1'), default=0) %}
              {{ full_start > 946684800
                 and last_full < full_start
                 and (now_ts - full_start) >= 1800
                 and states('sensor.solarflow_1_battery_level')|float(0) > 99.5
                 and is_state('input_boolean.zendure_emergency_u1','off')
                 and is_state('input_boolean.zendure_calib_discharge_u1','off')
                 and is_state('input_boolean.zendure_calib_mode_u1','off') }}
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_full_charge_1 }
            data: { timestamp: "{{ as_timestamp(now()) | int }}" }

      # --- U2: 100% mindestens 30 Minuten gehalten -> 14-Tage-Timer zuruecksetzen ---
      - if:
          - condition: template
            value_template: >
              {% set now_ts = as_timestamp(now()) %}
              {% set full_start = as_timestamp(states('input_datetime.zendure_natural_full_hold_start_u2'), default=0) %}
              {% set last_full = as_timestamp(states('input_datetime.zendure_last_full_charge_2'), default=0) %}
              {{ full_start > 946684800
                 and last_full < full_start
                 and (now_ts - full_start) >= 1800
                 and states('sensor.solarflow_2_battery_level')|float(0) > 99.5
                 and is_state('input_boolean.zendure_emergency_u2','off')
                 and is_state('input_boolean.zendure_calib_discharge_u2','off')
                 and is_state('input_boolean.zendure_calib_mode_u2','off') }}
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_full_charge_2 }
            data: { timestamp: "{{ as_timestamp(now()) | int }}" }

  - alias: "Zendure: Top Hold Start Tracker"
    id: "zendure_top_hold_tracker"
    mode: queued
    initial_state: true
    triggers:
      - trigger: template
        id: u1
        value_template: "{{ is_state('input_boolean.zendure_calib_mode_u1','on') and states('sensor.solarflow_1_battery_level')|float(0) > 99.5 }}"
      - trigger: template
        id: u2
        value_template: "{{ is_state('input_boolean.zendure_calib_mode_u2','on') and states('sensor.solarflow_2_battery_level')|float(0) > 99.5 }}"
      - trigger: template
        id: u1_reset
        value_template: "{{ is_state('input_boolean.zendure_calib_mode_u1','off') or (is_state('input_boolean.zendure_calib_mode_u1','on') and states('sensor.solarflow_1_battery_level')|float(0) <= 98) }}"
      - trigger: template
        id: u2_reset
        value_template: "{{ is_state('input_boolean.zendure_calib_mode_u2','off') or (is_state('input_boolean.zendure_calib_mode_u2','on') and states('sensor.solarflow_2_battery_level')|float(0) <= 98) }}"
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ trigger.id == 'u1'
                     and as_timestamp(states('input_datetime.zendure_top_hold_start_u1'), default=0) < 946684800 }}
            sequence:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_top_hold_start_u1 }
                data: { timestamp: "{{ as_timestamp(now()) | int }}" }
          - conditions:
              - condition: template
                value_template: >
                  {{ trigger.id == 'u2'
                     and as_timestamp(states('input_datetime.zendure_top_hold_start_u2'), default=0) < 946684800 }}
            sequence:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_top_hold_start_u2 }
                data: { timestamp: "{{ as_timestamp(now()) | int }}" }
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'u1_reset' }}"
            sequence:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_top_hold_start_u1 }
                data: { timestamp: 0 }
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'u2_reset' }}"
            sequence:
              - action: input_datetime.set_datetime
                target: { entity_id: input_datetime.zendure_top_hold_start_u2 }
                data: { timestamp: 0 }

  - alias: "Zendure: Smart Calibration Manager (Top + Deep)"
    id: "zendure_calibration_manager"
    mode: queued
    initial_state: true
    triggers:
      - trigger: homeassistant
        event: start
        id: "startup"
      - trigger: time
        at: "12:30:00"
        id: "check_time"
      - trigger: time_pattern
        minutes: "/10"
        id: "phase1_retry"

      # Sofortiger Start bei Force Calib (z.B. durch Sag Confirm nachts oder tagsüber)
      - trigger: state
        entity_id: input_boolean.zendure_force_calib_u1
        to: "on"
        id: "force_start_1"
      - trigger: state
        entity_id: input_boolean.zendure_force_calib_u2
        to: "on"
        id: "force_start_2"
      - trigger: state
        entity_id: input_boolean.zendure_force_calib_u1
        to: "off"
        id: "force_stop_1"
      - trigger: state
        entity_id: input_boolean.zendure_force_calib_u2
        to: "off"
        id: "force_stop_2"
      - trigger: template
        id: "pv_ready_u1"
        value_template: >
          {{ is_state('input_boolean.zendure_force_calib_u1', 'on')
             and is_state('input_boolean.zendure_calib_mode_u1', 'off')
             and is_state('input_boolean.zendure_calib_discharge_u1', 'off')
             and states('sensor.solarflow_1_solar_input') | float(999) <= 10 }}
        for: "00:15:00"
      - trigger: template
        id: "pv_ready_u2"
        value_template: >
          {{ is_state('input_boolean.zendure_force_calib_u2', 'on')
             and is_state('input_boolean.zendure_calib_mode_u2', 'off')
             and is_state('input_boolean.zendure_calib_discharge_u2', 'off')
             and states('sensor.solarflow_2_solar_input') | float(999) <= 10 }}
        for: "00:15:00"

      - trigger: template
        id: "pv_resume_u1"
        value_template: >
          {{ is_state('input_boolean.zendure_calib_discharge_u1', 'on')
             and states('sensor.solarflow_1_solar_input') | float(0) >= (states('input_number.zendure_conf_calib_pv_high') | float(70)) }}
        for: "00:05:00"
      - trigger: template
        id: "pv_resume_u2"
        value_template: >
          {{ is_state('input_boolean.zendure_calib_discharge_u2', 'on')
             and states('sensor.solarflow_2_solar_input') | float(0) >= (states('input_number.zendure_conf_calib_pv_high') | float(70)) }}
        for: "00:05:00"

      # Template-Trigger: Greift auch, wenn die Batterie schon VOR dem Start leer war!
      - trigger: template
        id: "bottom_u1"
        value_template: >
          {{ is_state('input_boolean.zendure_calib_discharge_u1', 'on')
             and states('sensor.solarflow_1_cell_min_vol')|float(99) <= 3.05
             and states('sensor.solarflow_1_battery_level')|float(100) <= 10 }}
        for: "00:01:00"
      - trigger: template
        id: "empty_soc_u1"
        value_template: >
          {{ is_state('input_boolean.zendure_calib_discharge_u1', 'on')
             and states('sensor.solarflow_1_battery_level')|float(100) <= 5.0 }}
        for: "00:02:00"
      - trigger: template
        id: "bottom_u2"
        value_template: >
          {{ is_state('input_boolean.zendure_calib_discharge_u2', 'on')
             and states('sensor.solarflow_2_cell_min_vol')|float(99) <= 3.05
             and states('sensor.solarflow_2_battery_level')|float(100) <= 10 }}
        for: "00:01:00"
      - trigger: template
        id: "hard_bottom_u1"
        value_template: >
          {{ is_state('input_boolean.zendure_calib_discharge_u1', 'on')
             and states('sensor.solarflow_1_cell_min_vol')|float(99) <= 3.00 }}
        for: "00:00:30"
      - trigger: template
        id: "hard_bottom_u2"
        value_template: >
          {{ is_state('input_boolean.zendure_calib_discharge_u2', 'on')
             and states('sensor.solarflow_2_cell_min_vol')|float(99) <= 3.00 }}
        for: "00:00:30"
      - trigger: template
        id: "empty_soc_u2"
        value_template: >
          {{ is_state('input_boolean.zendure_calib_discharge_u2', 'on')
             and states('sensor.solarflow_2_battery_level')|float(100) <= 5.0 }}
        for: "00:02:00"

      # Abschluss Phase 2 (Top-Balancing erreicht)
      - trigger: template
        id: "top_balance_ok_u1"
        value_template: >
          {% set hold = states('sensor.solarflow_1_battery_level')|float(0) >= 99 %}
          {% set hold_start = as_timestamp(states('input_datetime.zendure_top_hold_start_u1'), default=0) %}
          {{ is_state('input_boolean.zendure_calib_mode_u1','on')
             and hold
             and hold_start > 946684800
             and (as_timestamp(now()) - hold_start) >= 1800
             and ((states('sensor.solarflow_1_cell_max_vol')|float(99)-states('sensor.solarflow_1_cell_min_vol')|float(0)) | round(3)) <= 0.050 }}
        for: "00:10:00"
      - trigger: template
        id: "top_balance_ok_u2"
        value_template: >
          {% set hold = states('sensor.solarflow_2_battery_level')|float(0) >= 99 %}
          {% set hold_start = as_timestamp(states('input_datetime.zendure_top_hold_start_u2'), default=0) %}
          {{ is_state('input_boolean.zendure_calib_mode_u2','on')
             and hold
             and hold_start > 946684800
             and (as_timestamp(now()) - hold_start) >= 1800
             and ((states('sensor.solarflow_2_cell_max_vol')|float(99)-states('sensor.solarflow_2_cell_min_vol')|float(0)) | round(3)) <= 0.050 }}
        for: "00:10:00"
      - trigger: template
        id: "top_balance_timeout_u1"
        value_template: >
          {% set hold_start = as_timestamp(states('input_datetime.zendure_top_hold_start_u1'), default=0) %}
          {{ is_state('input_boolean.zendure_calib_mode_u1','on')
             and hold_start > 946684800
             and states('sensor.solarflow_1_battery_level')|float(0) >= 99
             and (as_timestamp(now()) - hold_start) >= 7200 }}
      - trigger: template
        id: "top_balance_timeout_u2"
        value_template: >
          {% set hold_start = as_timestamp(states('input_datetime.zendure_top_hold_start_u2'), default=0) %}
          {{ is_state('input_boolean.zendure_calib_mode_u2','on')
             and hold_start > 946684800
             and states('sensor.solarflow_2_battery_level')|float(0) >= 99
             and (as_timestamp(now()) - hold_start) >= 7200 }}
    conditions:
      - condition: state
        entity_id: input_boolean.zendure_auto_mode
        state: "on"
    actions:
      - variables:
          days_cfg: "{{ states('input_number.zendure_conf_calib_days') | int(14) }}"
          days_u1: >
            {% set ts = as_timestamp(states('input_datetime.zendure_last_full_charge_1'), 0) %}
            {{ 0 if ts == 0 else ((as_timestamp(now()) - ts) / 86400) | round(1) }}
          days_u2: >
            {% set ts = as_timestamp(states('input_datetime.zendure_last_full_charge_2'), 0) %}
            {{ 0 if ts == 0 else ((as_timestamp(now()) - ts) / 86400) | round(1) }}
          force_u1: "{{ is_state('input_boolean.zendure_force_calib_u1', 'on') }}"
          force_u2: "{{ is_state('input_boolean.zendure_force_calib_u2', 'on') }}"
          s1_pv: "{{ states('sensor.solarflow_1_solar_input') | float(0) }}"
          s2_pv: "{{ states('sensor.solarflow_2_solar_input') | float(0) }}"
          pv_discharge_max: 20
          vmin1: "{{ states('sensor.solarflow_1_cell_min_vol') | float(99) }}"
          vmin2: "{{ states('sensor.solarflow_2_cell_min_vol') | float(99) }}"
          phase1_window: "{{ now().hour >= 20 or now().hour < 10 }}"

      # --- STARTUP PANIC: Falls HA waehrend Deep-Calib mit vmin <=2.95V startet, sofort Notladung ---
      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'startup'
                 and is_state('input_boolean.zendure_calib_discharge_u1', 'on')
                 and vmin1|float(99) <= 2.95 }}
        then:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.zendure_calib_discharge_u1
                - input_boolean.zendure_calib_mode_u1
                - input_boolean.zendure_vguard_u1
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u1 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_emergency_u1 }
          - variables:
              t1_panic: "{{ states('sensor.solarflow_1_battery_temp_control') | float(states('sensor.solarflow_1_hub_temp_control')|float(0)) }}"
              soc1_panic: "{{ states('sensor.solarflow_1_battery_level') | float(0) }}"
              cl1_panic: "{{ 100 if t1_panic < 5 else (300 if t1_panic < 10 else 800) }}"
              ss1_panic: "{{ 300 if soc1_panic < 12 else 800 }}"
              limit_panic_u1: "{{ [300, cl1_panic|int, ss1_panic|int]|min }}"
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_ac_mode_u1 }
            data: { value: "Input mode" }
          - action: script.zendure_dispatch_u1_ac_mode
            data:
              mode: "Input mode"
              force: true
          - action: script.zendure_set_u1_outputlimit_zero
          - action: script.zendure_dispatch_u1_inputlimit
            data:
              power: "{{ limit_panic_u1 }}"
              force: true
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_last_sent_1 }
            data: { value: 0 }
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "🚨 *Startup-Panic U1*\nvmin <=2.95V waehrend Deep-Calib erkannt. Deep-Calib abgebrochen, Notladung gestartet."

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'startup'
                 and is_state('input_boolean.zendure_calib_discharge_u2', 'on')
                 and vmin2|float(99) <= 2.95 }}
        then:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.zendure_calib_discharge_u2
                - input_boolean.zendure_calib_mode_u2
                - input_boolean.zendure_vguard_u2
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u2 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_emergency_u2 }
          - variables:
              t2_panic: "{{ states('sensor.solarflow_2_battery_temp_control') | float(states('sensor.solarflow_2_hub_temp_control')|float(0)) }}"
              soc2_panic: "{{ states('sensor.solarflow_2_battery_level') | float(0) }}"
              cl2_panic: "{{ 100 if t2_panic < 5 else (300 if t2_panic < 10 else 800) }}"
              ss2_panic: "{{ 300 if soc2_panic < 12 else 800 }}"
              limit_panic_u2: "{{ [300, cl2_panic|int, ss2_panic|int]|min }}"
          - action: input_text.set_value
            target: { entity_id: input_text.zendure_ac_mode_u2 }
            data: { value: "Input mode" }
          - action: script.zendure_dispatch_u2_ac_mode
            data:
              mode: "Input mode"
              force: true
          - action: script.zendure_set_u2_outputlimit_zero
          - action: script.zendure_dispatch_u2_inputlimit
            data:
              power: "{{ limit_panic_u2 }}"
              force: true
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_last_sent_2 }
            data: { value: 0 }
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "🚨 *Startup-Panic U2*\nvmin <=2.95V waehrend Deep-Calib erkannt. Deep-Calib abgebrochen, Notladung gestartet."

      # --- STARTUP BOTTOM RECOVERY: Falls HA am Bottom neu startet, direkt in Phase 2 wechseln ---
      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'startup'
                 and is_state('input_boolean.zendure_calib_discharge_u1', 'on')
                 and vmin1|float(99) > 2.95
                 and ((vmin1|float(99) <= 3.05 and states('sensor.solarflow_1_battery_level')|float(100) <= 10)
                      or vmin1|float(99) <= 3.00
                      or states('sensor.solarflow_1_battery_level')|float(100) <= 5) }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_discharge_u1 }
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u1 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_calib_mode_u1 }
          - action: script.zendure_set_u1_outputlimit_zero
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "🔄 *Deep-Kalibrierung U1 (Phase 2)*\nHA-Neustart am Bottom erkannt. Ladephase wurde sicher gestartet."

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'startup'
                 and is_state('input_boolean.zendure_calib_discharge_u2', 'on')
                 and vmin2|float(99) > 2.95
                 and ((vmin2|float(99) <= 3.05 and states('sensor.solarflow_2_battery_level')|float(100) <= 10)
                      or vmin2|float(99) <= 3.00
                      or states('sensor.solarflow_2_battery_level')|float(100) <= 5) }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_discharge_u2 }
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u2 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_calib_mode_u2 }
          - action: script.zendure_set_u2_outputlimit_zero
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "🔄 *Deep-Kalibrierung U2 (Phase 2)*\nHA-Neustart am Bottom erkannt. Ladephase wurde sicher gestartet."

      - if:
          - condition: template
            value_template: "{{ trigger.id == 'check_time' and days_u1 >= days_cfg and is_state('input_boolean.zendure_calib_mode_u1', 'off') and is_state('input_boolean.zendure_emergency_u1','off') and is_state('input_boolean.zendure_vguard_u1','off') and is_state('input_boolean.zendure_force_calib_u1','off') and is_state('input_boolean.zendure_calib_discharge_u1','off') }}"
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u1 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_calib_mode_u1 }
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_discharge_u1 }
          - action: script.zendure_set_u1_outputlimit_zero

      - if:
          - condition: template
            value_template: "{{ trigger.id == 'check_time' and days_u2 >= days_cfg and is_state('input_boolean.zendure_calib_mode_u2', 'off') and is_state('input_boolean.zendure_emergency_u2','off') and is_state('input_boolean.zendure_vguard_u2','off') and is_state('input_boolean.zendure_force_calib_u2','off') and is_state('input_boolean.zendure_calib_discharge_u2','off') }}"
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u2 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_calib_mode_u2 }
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_discharge_u2 }
          - action: script.zendure_set_u2_outputlimit_zero

      # --- STARTUP-DAY GUARD: Bei HA-Neustart tagsüber keine Entladephase laufen lassen ---
      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'startup'
                 and not (phase1_window | bool)
                 and (is_state('input_boolean.zendure_calib_discharge_u1', 'on')
                      or is_state('input_boolean.zendure_calib_discharge_u2', 'on')) }}
        then:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.zendure_calib_discharge_u1
                - input_boolean.zendure_calib_discharge_u2
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "🌙 *Deep-Kalibrierung Phase 1 verschoben*\nHome Assistant wurde tagsüber neu gestartet. Eine laufende Entladephase wurde sicher beendet und wird im nächsten Nacht-/Low-PV-Fenster automatisch fortgesetzt."

      # --- START PHASE 1: ENTLADEN ---
      - if:
          - condition: template
            value_template: >
              {{ (trigger.id in ['force_start_1','pv_ready_u1','phase1_retry'] and force_u1)
                 or (trigger.id == 'startup' and force_u1) }}
          - condition: template
            value_template: "{{ phase1_window | bool }}"
          - condition: template
            value_template: "{{ s1_pv <= pv_discharge_max }}"
          - condition: state
            entity_id: input_boolean.zendure_calib_mode_u1
            state: "off"
          - condition: state
            entity_id: input_boolean.zendure_calib_discharge_u1
            state: "off"
          - condition: state
            entity_id: input_boolean.zendure_emergency_u1
            state: "off"
          - condition: state
            entity_id: input_boolean.zendure_vguard_u1
            state: "off"
          - condition: template
            value_template: >
              {% set t = states('sensor.solarflow_1_battery_temp_control') | float(states('sensor.solarflow_1_hub_temp_control')|float(999)) %}
              {{ t > 10 and not is_state('sensor.solarflow_1_heizung','Aktiv') }}
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u1 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_calib_discharge_u1 }
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_mode_u1 }
          - action: script.zendure_dispatch_u1_ac_mode
            data:
              mode: "Output mode"
              force: true
          - action: script.zendure_dispatch_u1_chargelimit
            data:
              power: "0"
              force: true
          - action: script.zendure_dispatch_u1_inputlimit
            data:
              power: 0
              force: true
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "📅 *Deep-Kalibrierung U1 (Phase 1)*\nEntlade-Phase gestartet. Akku wird bis Bottom-Kriterium (vmin<=3.05V & SoC<=10%) entladen."

      - if:
          - condition: template
            value_template: >
              {{ (trigger.id in ['force_start_2','pv_ready_u2','phase1_retry'] and force_u2)
                 or (trigger.id == 'startup' and force_u2) }}
          - condition: template
            value_template: "{{ phase1_window | bool }}"
          - condition: template
            value_template: "{{ s2_pv <= pv_discharge_max }}"
          - condition: state
            entity_id: input_boolean.zendure_calib_mode_u2
            state: "off"
          - condition: state
            entity_id: input_boolean.zendure_calib_discharge_u2
            state: "off"
          - condition: state
            entity_id: input_boolean.zendure_emergency_u2
            state: "off"
          - condition: state
            entity_id: input_boolean.zendure_vguard_u2
            state: "off"
          - condition: template
            value_template: >
              {% set t = states('sensor.solarflow_2_battery_temp_control') | float(states('sensor.solarflow_2_hub_temp_control')|float(999)) %}
              {{ t > 10 and not is_state('sensor.solarflow_2_heizung','Aktiv') }}
        then:
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u2 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_calib_discharge_u2 }
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_mode_u2 }
          - action: script.zendure_dispatch_u2_ac_mode
            data:
              mode: "Output mode"
              force: true
          - action: script.zendure_dispatch_u2_chargelimit
            data:
              power: "0"
              force: true
          - action: script.zendure_dispatch_u2_inputlimit
            data:
              power: 0
              force: true
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "📅 *Deep-Kalibrierung U2 (Phase 1)*\nEntlade-Phase gestartet. Akku wird bis Bottom-Kriterium (vmin<=3.05V & SoC<=10%) entladen."

      # --- ÜBERGANG ZU PHASE 2: LADEN ---
      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'pv_resume_u1'
                 and is_state('input_boolean.zendure_calib_discharge_u1', 'on')
                 and vmin1 > 2.86 }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_discharge_u1 }
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "🌤️ *Deep-Kalibrierung U1 pausiert (PV erkannt)*\nEntladung nicht vollständig (vmin {{ vmin1|round(3) }}V). Unit läuft normal und versucht die Entladung im nächsten Low-PV-Fenster erneut."

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'pv_resume_u2'
                 and is_state('input_boolean.zendure_calib_discharge_u2', 'on')
                 and vmin2 > 2.86 }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_discharge_u2 }
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "🌤️ *Deep-Kalibrierung U2 pausiert (PV erkannt)*\nEntladung nicht vollständig (vmin {{ vmin2|round(3) }}V). Unit läuft normal und versucht die Entladung im nächsten Low-PV-Fenster erneut."

      - if:
          - condition: template
            value_template: "{{ trigger.id == 'empty_soc_u1' and is_state('input_boolean.zendure_calib_discharge_u1','on') }}"
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_discharge_u1 }
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u1 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_calib_mode_u1 }
          - action: script.zendure_set_u1_outputlimit_zero
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "⚠️ *Deep-Calib U1 Schutzabbruch*\nSoC <=5% erreicht, Ladephase gestartet (Bottom-Spannung nicht sauber bestätigt)."

      - if:
          - condition: template
            value_template: "{{ trigger.id == 'empty_soc_u2' and is_state('input_boolean.zendure_calib_discharge_u2','on') }}"
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_discharge_u2 }
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u2 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_calib_mode_u2 }
          - action: script.zendure_set_u2_outputlimit_zero
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "⚠️ *Deep-Calib U2 Schutzabbruch*\nSoC <=5% erreicht, Ladephase gestartet (Bottom-Spannung nicht sauber bestätigt)."

      - if:
          - condition: template
            value_template: >
              {{ trigger.id in ['bottom_u1','hard_bottom_u1'] and is_state('input_boolean.zendure_calib_discharge_u1', 'on') }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_discharge_u1 }
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u1 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_calib_mode_u1 }
          - action: script.zendure_set_u1_outputlimit_zero
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "🔄 *Deep-Kalibrierung U1 (Phase 2)*\nNullpunkt erreicht! Wartet auf Sonne für Voll-Ladung."

      - if:
          - condition: template
            value_template: >
              {{ trigger.id in ['bottom_u2','hard_bottom_u2'] and is_state('input_boolean.zendure_calib_discharge_u2', 'on') }}
        then:
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.zendure_calib_discharge_u2 }
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u2 }
            data: { timestamp: 0 }
          - action: input_boolean.turn_on
            target: { entity_id: input_boolean.zendure_calib_mode_u2 }
          - action: script.zendure_set_u2_outputlimit_zero
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "🔄 *Deep-Kalibrierung U2 (Phase 2)*\nNullpunkt erreicht! Wartet auf Sonne für Voll-Ladung."

      # --- ABSCHLUSS (100% ERREICHT) ---
      - if:
          - condition: template
            value_template: "{{ trigger.id == 'force_start_1' and s1_pv > pv_discharge_max }}"
        then:
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "⏳ *Deep-Kalibrierung U1 wartet auf niedrige PV-Leistung*\nPV aktuell: {{ s1_pv|round(0) }}W. Entladephase startet automatisch bei <= {{ pv_discharge_max }}W."

      - if:
          - condition: template
            value_template: "{{ trigger.id == 'force_start_2' and s2_pv > pv_discharge_max }}"
        then:
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "⏳ *Deep-Kalibrierung U2 wartet auf niedrige PV-Leistung*\nPV aktuell: {{ s2_pv|round(0) }}W. Entladephase startet automatisch bei <= {{ pv_discharge_max }}W."

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'force_start_1'
                 and is_state('input_boolean.zendure_calib_discharge_u1', 'off') }}
          - condition: template
            value_template: >
              {{ (not (phase1_window | bool))
                 or s1_pv > pv_discharge_max
                 or is_state('input_boolean.zendure_emergency_u1','on')
                 or is_state('input_boolean.zendure_calib_mode_u1','on') }}
        then:
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: >
                ⚠️ *Deep-Kalibrierung U1 nicht gestartet*
                Grund: {% if not (phase1_window | bool) %}außerhalb Phase-1-Zeitfenster (20:00–09:59){% elif s1_pv > pv_discharge_max %}PV zu hoch ({{ s1_pv|round(0) }}W > {{ pv_discharge_max }}W){% elif is_state('input_boolean.zendure_emergency_u1','on') %}Notladung aktiv{% elif is_state('input_boolean.zendure_calib_mode_u1','on') %}bereits in Phase 2 (Calib-Mode){% else %}unbekannt{% endif %}.
                Entladephase startet automatisch, sobald die Bedingungen erfüllt sind.

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'force_start_2'
                 and is_state('input_boolean.zendure_calib_discharge_u2', 'off') }}
          - condition: template
            value_template: >
              {{ (not (phase1_window | bool))
                 or s2_pv > pv_discharge_max
                 or is_state('input_boolean.zendure_emergency_u2','on')
                 or is_state('input_boolean.zendure_calib_mode_u2','on') }}
        then:
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: >
                ⚠️ *Deep-Kalibrierung U2 nicht gestartet*
                Grund: {% if not (phase1_window | bool) %}außerhalb Phase-1-Zeitfenster (20:00–09:59){% elif s2_pv > pv_discharge_max %}PV zu hoch ({{ s2_pv|round(0) }}W > {{ pv_discharge_max }}W){% elif is_state('input_boolean.zendure_emergency_u2','on') %}Notladung aktiv{% elif is_state('input_boolean.zendure_calib_mode_u2','on') %}bereits in Phase 2 (Calib-Mode){% else %}unbekannt{% endif %}.
                Entladephase startet automatisch, sobald die Bedingungen erfüllt sind.

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'force_stop_1'
                 and (is_state('input_boolean.zendure_calib_discharge_u1','on')
                      or is_state('input_boolean.zendure_calib_mode_u1','on')) }}
        then:
          # Erst Ladepfad sauber schließen, solange Calib-Flags noch aktiv sind.
          - action: script.zendure_dispatch_u1_inputlimit
            data:
              power: 0
              force: true
          - action: script.zendure_dispatch_u1_ac_mode
            data:
              mode: "Output mode"
              force: true
          - action: script.zendure_set_u1_outputlimit_zero

          # Danach internen Kalibrierzustand beenden.
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.zendure_calib_discharge_u1
                - input_boolean.zendure_calib_mode_u1
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u1 }
            data: { timestamp: 0 }
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "🛑 *Kalibrierung U1 abgebrochen* (Force-Calib wurde manuell deaktiviert)."

      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'force_stop_2'
                 and (is_state('input_boolean.zendure_calib_discharge_u2','on')
                      or is_state('input_boolean.zendure_calib_mode_u2','on')) }}
        then:
          # Erst Ladepfad sauber schließen, solange Calib-Flags noch aktiv sind.
          - action: script.zendure_dispatch_u2_inputlimit
            data:
              power: 0
              force: true
          - action: script.zendure_dispatch_u2_ac_mode
            data:
              mode: "Output mode"
              force: true
          - action: script.zendure_set_u2_outputlimit_zero

          # Danach internen Kalibrierzustand beenden.
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.zendure_calib_discharge_u2
                - input_boolean.zendure_calib_mode_u2
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u2 }
            data: { timestamp: 0 }
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: "🛑 *Kalibrierung U2 abgebrochen* (Force-Calib wurde manuell deaktiviert)."

      - if:
          - condition: template
            value_template: >
              {{ trigger.id in ['top_balance_ok_u1','top_balance_timeout_u1']
                 and is_state('input_boolean.zendure_calib_mode_u1','on') }}
        then:
          # Full-Charge-Zeitpunkt setzen.
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_full_charge_1 }
            data: { timestamp: "{{ as_timestamp(now()) | int }}" }

          # Ladepfad sauber schließen, bevor Calib-Flags fallen.
          - action: script.zendure_dispatch_u1_inputlimit
            data:
              power: 0
              force: true
          - action: script.zendure_dispatch_u1_ac_mode
            data:
              mode: "Output mode"
              force: true
          - action: script.zendure_set_u1_outputlimit_zero

          # Kalibrierzustand beenden.
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.zendure_calib_mode_u1
                - input_boolean.zendure_calib_discharge_u1
                - input_boolean.zendure_force_calib_u1
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u1 }
            data: { timestamp: 0 }
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: >
                {% if trigger.id == 'top_balance_timeout_u1' %}
                  ⚠️ *Top-Balance U1 beendet*\nMaximale Haltezeit (120 min ab erstem echten 100%-Punkt) erreicht – Top-Balance nicht perfekt.
                {% else %}
                  ✅ *Top-Balance U1 abgeschlossen*\nMindesthaltezeit erfüllt und Zellspreizung im Zielbereich.
                {% endif %}

      - if:
          - condition: template
            value_template: >
              {{ trigger.id in ['top_balance_ok_u2','top_balance_timeout_u2']
                 and is_state('input_boolean.zendure_calib_mode_u2','on') }}
        then:
          # Full-Charge-Zeitpunkt setzen.
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_last_full_charge_2 }
            data: { timestamp: "{{ as_timestamp(now()) | int }}" }

          # Ladepfad sauber schließen, bevor Calib-Flags fallen.
          - action: script.zendure_dispatch_u2_inputlimit
            data:
              power: 0
              force: true
          - action: script.zendure_dispatch_u2_ac_mode
            data:
              mode: "Output mode"
              force: true
          - action: script.zendure_set_u2_outputlimit_zero

          # Kalibrierzustand beenden.
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.zendure_calib_mode_u2
                - input_boolean.zendure_calib_discharge_u2
                - input_boolean.zendure_force_calib_u2
          - action: input_datetime.set_datetime
            target: { entity_id: input_datetime.zendure_top_hold_start_u2 }
            data: { timestamp: 0 }
          - action: notify.send_message
            target: { entity_id: !secret telegram_id1 }
            data:
              message: >
                {% if trigger.id == 'top_balance_timeout_u2' %}
                  ⚠️ *Top-Balance U2 beendet*\nMaximale Haltezeit (120 min ab erstem echten 100%-Punkt) erreicht – Top-Balance nicht perfekt.
                {% else %}
                  ✅ *Top-Balance U2 abgeschlossen*\nMindesthaltezeit erfüllt und Zellspreizung im Zielbereich.
                {% endif %}


  - alias: "Zendure: Overheat Degrading Notify"
    id: "zendure_overheat_degrading_notify"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.solarflow_1_battery_temp_control
        above: 48
        for: "00:02:00"
        id: u1
      - trigger: numeric_state
        entity_id: sensor.solarflow_2_battery_temp_control
        above: 48
        for: "00:02:00"
        id: u2
    conditions:
      - condition: state
        entity_id: input_boolean.zendure_auto_mode
        state: "on"
    actions:
      - choose:
          - conditions: "{{ trigger.id == 'u1' }}"
            sequence:
              - action: notify.send_message
                target: { entity_id: !secret telegram_id1 }
                data:
                  message: "⚠️ *Zendure U1 Degrading aktiv*\nTemperatur >48°C: Leistungs-Degrading hat begonnen."
          - conditions: "{{ trigger.id == 'u2' }}"
            sequence:
              - action: notify.send_message
                target: { entity_id: !secret telegram_id1 }
                data:
                  message: "⚠️ *Zendure U2 Degrading aktiv*\nTemperatur >48°C: Leistungs-Degrading hat begonnen."

  # --- 6.7 HEALTH REPORTER ---
  - alias: "Zendure: Weekly Health Report"
    id: "zendure_weekly_report"
    triggers:
      - trigger: time
        at: "18:00:00"
    conditions:
      - condition: time
        weekday: [fri]
      - condition: template
        value_template: "{{ is_state('input_boolean.zendure_emergency_u1','off') and is_state('input_boolean.zendure_emergency_u2','off') and is_state('input_boolean.zendure_vguard_u1','off') and is_state('input_boolean.zendure_vguard_u2','off') and is_state('input_boolean.zendure_force_calib_u1','off') and is_state('input_boolean.zendure_force_calib_u2','off') and is_state('input_boolean.zendure_calib_discharge_u1','off') and is_state('input_boolean.zendure_calib_discharge_u2','off') and is_state('input_boolean.zendure_calib_mode_u1','off') and is_state('input_boolean.zendure_calib_mode_u2','off') }}"
    actions:
      - variables:
          last_u1: "{{ as_timestamp(states('input_datetime.zendure_last_full_charge_1'), default=0) }}"
          last_u2: "{{ as_timestamp(states('input_datetime.zendure_last_full_charge_2'), default=0) }}"
          days_u1: >
            {% set ts = as_timestamp(states('input_datetime.zendure_last_full_charge_1'), 0) %}
            {{ 0 if ts == 0 else ((as_timestamp(now()) - ts) / 86400) | int(0) }}
          days_u2: >
            {% set ts = as_timestamp(states('input_datetime.zendure_last_full_charge_2'), 0) %}
            {{ 0 if ts == 0 else ((as_timestamp(now()) - ts) / 86400) | int(0) }}
          imb1_raw: "{{ states('sensor.solarflow_1_cell_imbalance') }}"
          imb2_raw: "{{ states('sensor.solarflow_2_cell_imbalance') }}"
      - action: notify.send_message
        target:
          entity_id: !secret telegram_id1
        data:
          message: |
            ℹ️ *Zendure Wochenbericht*
            Unit 1: {{ days_u1 }} Tage ({{ imb1_raw }} V)
            Unit 2: {{ days_u2 }} Tage ({{ imb2_raw }} V)

  # --- 6.8a CALIBRATION AC FALLBACK MANAGER ---
  - alias: "Zendure: Calibration AC Fallback Manager"
    id: "zendure_calibration_ac_fallback_manager"
    mode: queued
    initial_state: true
    max: 2
    max_exceeded: silent
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - input_boolean.zendure_calib_mode_u1
          - input_boolean.zendure_calib_mode_u2
          - input_boolean.zendure_calib_discharge_u1
          - input_boolean.zendure_calib_discharge_u2
          - sensor.solarflow_1_solar_input
          - sensor.solarflow_2_solar_input
          - sensor.zendure_u1_pv_mean_20s
          - sensor.zendure_u2_pv_mean_20s
    conditions:
      - condition: state
        entity_id: input_boolean.zendure_auto_mode
        state: "on"
    actions:
      - variables:
          pv_low: "{{ states('input_number.zendure_conf_calib_pv_low') | float(40) }}"
          pv_high_raw: "{{ states('input_number.zendure_conf_calib_pv_high') | float(70) }}"
          pv_high: "{{ [pv_high_raw, (pv_low | float(40)) + 10] | max }}"

          # AC-Netzladung ist NUR zwischen 12:00 und 19:59 Uhr erlaubt.
          # Den ganzen Morgen über muss das System geduldig auf die Sonne warten.
          allow_ac: "{{ now().hour >= 12 and now().hour < 20 }}"

          online1: "{{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] }}"
          online2: "{{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] }}"
          calib1: "{{ is_state('input_boolean.zendure_calib_mode_u1', 'on') }}"
          calib2: "{{ is_state('input_boolean.zendure_calib_mode_u2', 'on') }}"
          dis1: "{{ is_state('input_boolean.zendure_calib_discharge_u1', 'on') }}"
          dis2: "{{ is_state('input_boolean.zendure_calib_discharge_u2', 'on') }}"

          soc1: "{{ states('sensor.solarflow_1_battery_level') | float(0) }}"
          soc2: "{{ states('sensor.solarflow_2_battery_level') | float(0) }}"
          s1_solar: "{{ states('sensor.solarflow_1_solar_input') | float(0) if online1 else 0 }}"
          s2_solar: "{{ states('sensor.solarflow_2_solar_input') | float(0) if online2 else 0 }}"
          s1_solar_mean: "{{ states('sensor.zendure_u1_pv_mean_20s') | float(s1_solar | float(0)) if online1 else 0 }}"
          s2_solar_mean: "{{ states('sensor.zendure_u2_pv_mean_20s') | float(s2_solar | float(0)) if online2 else 0 }}"
          s1_pv_low_stable: >
            {{ (s1_solar | float(0)) <= (pv_low | float(40))
               and (s1_solar_mean | float(0)) <= (pv_low | float(40)) }}
          s2_pv_low_stable: >
            {{ (s2_solar | float(0)) <= (pv_low | float(40))
               and (s2_solar_mean | float(0)) <= (pv_low | float(40)) }}
          s1_pv_high_stable: >
            {{ (s1_solar | float(0)) >= (pv_high | float(70))
               and (s1_solar_mean | float(0)) >= (pv_high | float(70)) }}
          s2_pv_high_stable: >
            {{ (s2_solar | float(0)) >= (pv_high | float(70))
               and (s2_solar_mean | float(0)) >= (pv_high | float(70)) }}

          batt_t1_calib: "{{ states('sensor.solarflow_1_battery_temp_control') | float(states('sensor.solarflow_1_hub_temp_control')|float(999)) }}"
          batt_t2_calib: "{{ states('sensor.solarflow_2_battery_temp_control') | float(states('sensor.solarflow_2_hub_temp_control')|float(999)) }}"
          hub_t1_calib: "{{ states('sensor.solarflow_1_hub_temp_control') | float(999) }}"
          hub_t2_calib: "{{ states('sensor.solarflow_2_hub_temp_control') | float(999) }}"
          cl1: "{{ 100 if batt_t1_calib < 5 else (300 if batt_t1_calib < 10 else 800) }}"
          cl2: "{{ 100 if batt_t2_calib < 5 else (300 if batt_t2_calib < 10 else 800) }}"
          sl1: "{{ 100 if soc1 > 97 else (200 if soc1 >= 90 else 800) }}"
          sl2: "{{ 100 if soc2 > 97 else (200 if soc2 >= 90 else 800) }}"
          soc_soft_u1: "{{ 100 if soc1 < 8 else (300 if soc1 < 12 else 800) }}"
          soc_soft_u2: "{{ 100 if soc2 < 8 else (300 if soc2 < 12 else 800) }}"
          batt_charge_cap_calib_u1: "{{ 0 if is_state('input_boolean.zendure_batt_temp_cooldown_u1','on') or batt_t1_calib >= 55 else (100 if batt_t1_calib >= 53 else (300 if batt_t1_calib >= 50 else 800)) }}"
          batt_charge_cap_calib_u2: "{{ 0 if is_state('input_boolean.zendure_batt_temp_cooldown_u2','on') or batt_t2_calib >= 55 else (100 if batt_t2_calib >= 53 else (300 if batt_t2_calib >= 50 else 800)) }}"
          hub_charge_cap_calib_u1: "{{ 0 if is_state('input_boolean.zendure_hub_temp_cooldown_u1','on') or hub_t1_calib >= 65 else (100 if hub_t1_calib >= 62 else (200 if hub_t1_calib >= 60 else (400 if hub_t1_calib >= 58 else (600 if hub_t1_calib >= 55 else 800)))) }}"
          hub_charge_cap_calib_u2: "{{ 0 if is_state('input_boolean.zendure_hub_temp_cooldown_u2','on') or hub_t2_calib >= 65 else (100 if hub_t2_calib >= 62 else (200 if hub_t2_calib >= 60 else (400 if hub_t2_calib >= 58 else (600 if hub_t2_calib >= 55 else 800)))) }}"
          temp_charge_cap_calib_u1: "{{ [batt_charge_cap_calib_u1|int, hub_charge_cap_calib_u1|int] | min }}"
          temp_charge_cap_calib_u2: "{{ [batt_charge_cap_calib_u2|int, hub_charge_cap_calib_u2|int] | min }}"
          temp_charge_block_u1: "{{ (temp_charge_cap_calib_u1 | int(0)) <= 0 }}"
          temp_charge_block_u2: "{{ (temp_charge_cap_calib_u2 | int(0)) <= 0 }}"
          limit_calib_u1: "{{ [cl1|int, sl1|int, soc_soft_u1|int, temp_charge_cap_calib_u1|int]|min }}"
          limit_calib_u2: "{{ [cl2|int, sl2|int, soc_soft_u2|int, temp_charge_cap_calib_u2|int]|min }}"
          curr_limit_u1: >
            {% set real = states('sensor.solarflow_1_input_limit') %}
            {% if is_number(real) %}
              {{ real | int(0) }}
            {% else %}
              {{ states('input_number.zendure_last_inputlimit_u1') | int(-1) }}
            {% endif %}
          curr_limit_u2: >
            {% set real = states('sensor.solarflow_2_input_limit') %}
            {% if is_number(real) %}
              {{ real | int(0) }}
            {% else %}
              {{ states('input_number.zendure_last_inputlimit_u2') | int(-1) }}
            {% endif %}
          curr_charge_u1: >
            {% set real = states('sensor.solarflow_1_setting_chargelimit') %}
            {{ real | int(states('input_number.zendure_last_chargelimit_u1') | int(-1)) if is_number(real) else states('input_number.zendure_last_chargelimit_u1') | int(-1) }}
          curr_charge_u2: >
            {% set real = states('sensor.solarflow_2_setting_chargelimit') %}
            {{ real | int(states('input_number.zendure_last_chargelimit_u2') | int(-1)) if is_number(real) else states('input_number.zendure_last_chargelimit_u2') | int(-1) }}

      - condition: template
        value_template: "{{ calib1 or calib2 or dis1 or dis2 }}"
      - parallel:
          # --- UNIT 1 STEUERUNG ---
          - choose:
              - conditions:
                  - condition: template
                    value_template: >
                      {{ (calib1 or dis1) and online1
                         and (temp_charge_block_u1 | bool)
                         and (
                           states('input_text.zendure_ac_mode_u1') != 'Output mode'
                           or curr_limit_u1|int(-1) != 0
                           or states('sensor.solarflow_1_output_limit')|int(-1) != 0
                           or states('input_number.zendure_last_sent_1')|int(-1) != 0
                         ) }}
                sequence:
                  - action: script.zendure_dispatch_u1_inputlimit
                    data:
                      power: 0
                      force: true
                  - action: script.zendure_dispatch_u1_chargelimit
                    data:
                      power: "0"
                      force: true
                  - action: script.zendure_dispatch_u1_ac_mode
                    data:
                      mode: "Output mode"
                      force: true
                  - action: script.zendure_set_u1_outputlimit_zero
              - conditions:
                  - condition: template
                    value_template: >
                      {{ dis1 and online1 and is_state('input_boolean.zendure_emergency_u1','off') and is_state('input_boolean.zendure_vguard_u1','off') and (
                           states('input_text.zendure_ac_mode_u1') != 'Output mode'
                           or curr_limit_u1|int(-1) != 0
                      ) }}
                sequence:
                  - action: script.zendure_dispatch_u1_ac_mode
                    data:
                      mode: "Output mode"
                      force: true
                  - action: script.zendure_dispatch_u1_chargelimit
                    data:
                      power: "0"
                      force: true
                  - action: script.zendure_dispatch_u1_inputlimit
                    data:
                      power: 0
                      force: true
              - conditions:
                  - condition: template
                    value_template: >
                      {{ calib1 and not dis1 and online1
                         and is_state('input_boolean.zendure_emergency_u1','off')
                         and is_state('input_boolean.zendure_vguard_u1','off')
                         and not (allow_ac | bool)
                         and (states('input_text.zendure_ac_mode_u1') == 'Input mode'
                              or curr_limit_u1|int(-1) != 0) }}
                sequence:
                  - action: script.zendure_dispatch_u1_inputlimit
                    data:
                      power: 0
                      force: true
                  - action: script.zendure_dispatch_u1_chargelimit
                    data:
                      power: "{{ limit_calib_u1|int }}"
                      force: true
                  - action: script.zendure_dispatch_u1_ac_mode
                    data:
                      mode: "Output mode"
                      force: true
                  - action: script.zendure_set_u1_outputlimit_zero
              - conditions:
                  - condition: template
                    value_template: >
                      {{ calib1 and not dis1 and online1 and is_state('input_boolean.zendure_emergency_u1','off') and is_state('input_boolean.zendure_vguard_u1','off') and (s1_pv_low_stable | bool)
                         and not (temp_charge_block_u1 | bool)
                         and (limit_calib_u1 | int(0)) > 0
                         and (allow_ac | bool)
                         and (states('input_text.zendure_ac_mode_u1') != 'Input mode'
                              or curr_limit_u1|int(-1) != (limit_calib_u1|int)
                              or curr_charge_u1|int(-1) != (limit_calib_u1|int)) }}
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ states('input_text.zendure_ac_mode_u1') != 'Input mode' }}"
                    then:
                      - action: script.zendure_dispatch_u1_ac_mode
                        data:
                          mode: "Input mode"
                          force: true
                      - action: script.zendure_set_u1_outputlimit_zero
                  - action: script.zendure_dispatch_u1_chargelimit
                    data:
                      power: "{{ limit_calib_u1|int }}"
                      force: true
                  - action: script.zendure_dispatch_u1_inputlimit
                    data:
                      power: "{{ limit_calib_u1|int }}"
                      force: true
              - conditions:
                  - condition: template
                    value_template: >
                      {{ calib1 and not dis1 and online1 and is_state('input_boolean.zendure_emergency_u1','off') and is_state('input_boolean.zendure_vguard_u1','off') and (s1_pv_high_stable | bool)
                      and (
                          states('input_text.zendure_ac_mode_u1') != 'Output mode'
                          or curr_limit_u1|int(-1) != 0
                          or states('sensor.solarflow_1_output_limit')|int(-1) != 0
                          or states('input_number.zendure_last_sent_1')|int(-1) != 0
                          or curr_charge_u1|int(-1) != (limit_calib_u1|int)
                      ) }}
                sequence:
                  - action: script.zendure_dispatch_u1_inputlimit
                    data:
                      power: 0
                      force: true
                  - action: script.zendure_dispatch_u1_chargelimit
                    data:
                      power: "{{ limit_calib_u1|int }}"
                      force: true
                  - action: script.zendure_dispatch_u1_ac_mode
                    data:
                      mode: "Output mode"
                      force: true
                  - action: script.zendure_set_u1_outputlimit_zero

          # --- UNIT 2 STEUERUNG ---
          - choose:
              - conditions:
                  - condition: template
                    value_template: >
                      {{ (calib2 or dis2) and online2
                         and (temp_charge_block_u2 | bool)
                         and (
                           states('input_text.zendure_ac_mode_u2') != 'Output mode'
                           or curr_limit_u2|int(-1) != 0
                           or states('sensor.solarflow_2_output_limit')|int(-1) != 0
                           or states('input_number.zendure_last_sent_2')|int(-1) != 0
                         ) }}
                sequence:
                  - action: script.zendure_dispatch_u2_inputlimit
                    data:
                      power: 0
                      force: true
                  - action: script.zendure_dispatch_u2_chargelimit
                    data:
                      power: "0"
                      force: true
                  - action: script.zendure_dispatch_u2_ac_mode
                    data:
                      mode: "Output mode"
                      force: true
                  - action: script.zendure_set_u2_outputlimit_zero
              - conditions:
                  - condition: template
                    value_template: >
                      {{ dis2 and online2 and is_state('input_boolean.zendure_emergency_u2','off') and is_state('input_boolean.zendure_vguard_u2','off') and (
                           states('input_text.zendure_ac_mode_u2') != 'Output mode'
                           or curr_limit_u2|int(-1) != 0
                      ) }}
                sequence:
                  - action: script.zendure_dispatch_u2_ac_mode
                    data:
                      mode: "Output mode"
                      force: true
                  - action: script.zendure_dispatch_u2_chargelimit
                    data:
                      power: "0"
                      force: true
                  - action: script.zendure_dispatch_u2_inputlimit
                    data:
                      power: 0
                      force: true
              - conditions:
                  - condition: template
                    value_template: >
                      {{ calib2 and not dis2 and online2
                         and is_state('input_boolean.zendure_emergency_u2','off')
                         and is_state('input_boolean.zendure_vguard_u2','off')
                         and not (allow_ac | bool)
                         and (states('input_text.zendure_ac_mode_u2') == 'Input mode'
                              or curr_limit_u2|int(-1) != 0) }}
                sequence:
                  - action: script.zendure_dispatch_u2_inputlimit
                    data:
                      power: 0
                      force: true
                  - action: script.zendure_dispatch_u2_chargelimit
                    data:
                      power: "{{ limit_calib_u2|int }}"
                      force: true
                  - action: script.zendure_dispatch_u2_ac_mode
                    data:
                      mode: "Output mode"
                      force: true
                  - action: script.zendure_set_u2_outputlimit_zero
              - conditions:
                  - condition: template
                    value_template: >
                      {{ calib2 and not dis2 and online2 and is_state('input_boolean.zendure_emergency_u2','off') and is_state('input_boolean.zendure_vguard_u2','off') and (s2_pv_low_stable | bool)
                         and not (temp_charge_block_u2 | bool)
                         and (limit_calib_u2 | int(0)) > 0
                         and (allow_ac | bool)
                         and (states('input_text.zendure_ac_mode_u2') != 'Input mode'
                              or curr_limit_u2|int(-1) != (limit_calib_u2|int)
                              or curr_charge_u2|int(-1) != (limit_calib_u2|int)) }}
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ states('input_text.zendure_ac_mode_u2') != 'Input mode' }}"
                    then:
                      - action: script.zendure_dispatch_u2_ac_mode
                        data:
                          mode: "Input mode"
                          force: true
                      - action: script.zendure_set_u2_outputlimit_zero
                  - action: script.zendure_dispatch_u2_chargelimit
                    data:
                      power: "{{ limit_calib_u2|int }}"
                      force: true
                  - action: script.zendure_dispatch_u2_inputlimit
                    data:
                      power: "{{ limit_calib_u2|int }}"
                      force: true
              - conditions:
                  - condition: template
                    value_template: >
                      {{ calib2 and not dis2 and online2 and is_state('input_boolean.zendure_emergency_u2','off') and is_state('input_boolean.zendure_vguard_u2','off') and (s2_pv_high_stable | bool)
                      and (
                          states('input_text.zendure_ac_mode_u2') != 'Output mode'
                          or curr_limit_u2|int(-1) != 0
                          or states('sensor.solarflow_2_output_limit')|int(-1) != 0
                          or states('input_number.zendure_last_sent_2')|int(-1) != 0
                          or curr_charge_u2|int(-1) != (limit_calib_u2|int)
                      ) }}
                sequence:
                  - action: script.zendure_dispatch_u2_inputlimit
                    data:
                      power: 0
                      force: true
                  - action: script.zendure_dispatch_u2_chargelimit
                    data:
                      power: "{{ limit_calib_u2|int }}"
                      force: true
                  - action: script.zendure_dispatch_u2_ac_mode
                    data:
                      mode: "Output mode"
                      force: true
                  - action: script.zendure_set_u2_outputlimit_zero

  # --- 6.8a.1 INPUTLIMIT CLEANUP AFTER OUTPUT MODE ---
  - alias: "Zendure: InputLimit Cleanup After Output Mode"
    id: "zendure_inputlimit_cleanup_after_output_mode"
    mode: restart
    initial_state: true
    max_exceeded: silent
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id: input_boolean.zendure_auto_mode
        to: "on"
      - trigger: state
        entity_id:
          - sensor.solarflow_1_ac_mode
          - input_text.zendure_ac_mode_u1
        to: "Output mode"
      - trigger: state
        entity_id:
          - sensor.solarflow_2_ac_mode
          - input_text.zendure_ac_mode_u2
        to: "Output mode"
      - trigger: state
        entity_id:
          - input_boolean.zendure_calib_mode_u1
          - input_boolean.zendure_calib_discharge_u1
          - input_boolean.zendure_emergency_u1
          - input_boolean.zendure_vguard_u1
          - input_boolean.zendure_calib_mode_u2
          - input_boolean.zendure_calib_discharge_u2
          - input_boolean.zendure_emergency_u2
          - input_boolean.zendure_vguard_u2
        to: "off"
      - trigger: state
        entity_id:
          - sensor.solarflow_1_input_limit
          - sensor.solarflow_2_input_limit
    conditions:
      - condition: state
        entity_id: input_boolean.zendure_auto_mode
        state: "on"
    actions:
      # Gives the hub and MQTT readback a short window to settle after AC-mode changes.
      - delay:
          seconds: 15
      - variables:
          u1_online: "{{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] }}"
          u2_online: "{{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] }}"
          u1_input_raw: "{{ states('sensor.solarflow_1_input_limit') }}"
          u2_input_raw: "{{ states('sensor.solarflow_2_input_limit') }}"
          u1_input_now: >
            {{ u1_input_raw | int(states('input_number.zendure_last_inputlimit_u1') | int(0))
               if is_number(u1_input_raw) else states('input_number.zendure_last_inputlimit_u1') | int(0) }}
          u2_input_now: >
            {{ u2_input_raw | int(states('input_number.zendure_last_inputlimit_u2') | int(0))
               if is_number(u2_input_raw) else states('input_number.zendure_last_inputlimit_u2') | int(0) }}
          u1_normal_output_safe: >
            {{ (u1_online | bool)
               and states('sensor.solarflow_1_ac_mode') == 'Output mode'
               and states('input_text.zendure_ac_mode_u1') == 'Output mode'
               and is_state('input_boolean.zendure_calib_mode_u1','off')
               and is_state('input_boolean.zendure_calib_discharge_u1','off')
               and is_state('input_boolean.zendure_emergency_u1','off')
               and is_state('input_boolean.zendure_vguard_u1','off') }}
          u2_normal_output_safe: >
            {{ (u2_online | bool)
               and states('sensor.solarflow_2_ac_mode') == 'Output mode'
               and states('input_text.zendure_ac_mode_u2') == 'Output mode'
               and is_state('input_boolean.zendure_calib_mode_u2','off')
               and is_state('input_boolean.zendure_calib_discharge_u2','off')
               and is_state('input_boolean.zendure_emergency_u2','off')
               and is_state('input_boolean.zendure_vguard_u2','off') }}
      - parallel:
          - if:
              - condition: template
                value_template: "{{ (u1_normal_output_safe | bool) and (u1_input_now | int(0)) != 0 }}"
            then:
              - action: script.zendure_dispatch_u1_inputlimit
                data:
                  power: 0
                  force: true
          - if:
              - condition: template
                value_template: "{{ (u2_normal_output_safe | bool) and (u2_input_now | int(0)) != 0 }}"
            then:
              - action: script.zendure_dispatch_u2_inputlimit
                data:
                  power: 0
                  force: true

  # --- 6.8b AUTO-EMERGENCY MANAGER (PER-UNIT) ---
  - alias: "Zendure: VGuard -> Emergency Bridge (Low-SoC)"
    id: "zendure_vguard_emergency_bridge"
    mode: queued
    initial_state: true
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - input_boolean.zendure_vguard_u1
          - input_boolean.zendure_vguard_u2
          - sensor.solarflow_1_battery_level
          - sensor.solarflow_2_battery_level
          - sensor.solarflow_total_solar_input
          - input_boolean.zendure_calib_mode_u1
          - input_boolean.zendure_calib_mode_u2
          - input_boolean.zendure_emergency_u1
          - input_boolean.zendure_emergency_u2
          - sensor.solarflow_1_status_raw
          - sensor.solarflow_2_status_raw
    conditions:
      - condition: state
        entity_id: input_boolean.zendure_auto_mode
        state: "on"
    actions:
      - if:
          - condition: template
            value_template: >
                  {% set s = states.sensor.solarflow_1_status_raw %}
                  {% set fresh = s is not none and s.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(s.last_reported, 0)) < 120 %}
                  {% set bt = states.sensor.solarflow_1_battery_temp_control %}
                  {% set ht = states.sensor.solarflow_1_hub_temp_control %}
                  {% set have_temp = (bt is not none and is_number(bt.state)) or (ht is not none and is_number(ht.state)) %}
                  {% set t = states('sensor.solarflow_1_battery_temp_control') | float(states('sensor.solarflow_1_hub_temp_control') | float(999)) %}
                  {% set temp_mode_ok_u1 = have_temp and t >= 0 and t <= 52 and not is_state('sensor.solarflow_1_heizung', 'Aktiv') %}
                  {{ is_state('input_boolean.zendure_vguard_u1','on')
                     and is_state('input_boolean.zendure_emergency_u1','off')
                     and is_state('input_boolean.zendure_calib_mode_u1','off')
                     and fresh
                     and temp_mode_ok_u1
                     and states('sensor.solarflow_total_solar_input')|float(0) < states('input_number.zendure_conf_emerg_pv_gate')|float(150)
                     and (
                       states('sensor.solarflow_1_battery_level')|float(100) <= states('input_number.zendure_conf_soc_emerg_start')|float(15)
                       or states('sensor.solarflow_1_cell_min_vol')|float(99) <= 3.00
                     ) }}
        then:
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.zendure_vguard_u1 }
              - action: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.zendure_calib_discharge_u1
                    - input_boolean.zendure_calib_mode_u1
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_emergency_u1 }
              - variables:
                  t1: "{{ states('sensor.solarflow_1_battery_temp_control') | float(states('sensor.solarflow_1_hub_temp_control')|float(0)) }}"
                  soc1: "{{ states('sensor.solarflow_1_battery_level') | float(0) }}"
                  cl1: "{{ 100 if t1 < 5 else (300 if t1 < 10 else 800) }}"
                  ss1: "{{ 300 if soc1 < 12 else 800 }}"
                  limit_emerg_u1: "{{ [300, cl1|int, ss1|int]|min }}"
              - action: input_text.set_value
                target: { entity_id: input_text.zendure_ac_mode_u1 }
                data: { value: "Input mode" }
              - action: script.zendure_dispatch_u1_ac_mode
                data:
                  mode: "Input mode"
                  force: true
              - action: script.zendure_set_u1_outputlimit_zero
              - action: script.zendure_dispatch_u1_inputlimit
                data:
                  power: "{{ limit_emerg_u1 }}"
                  force: true
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_last_sent_1 }
                data: { value: 0 }
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id1
                data:
                  message: "🔋 *VGuard→Emergency U1*\nKritischer Low-SoC erkannt, VGuard freigegeben und Notladung mit {{ limit_emerg_u1|int }}W gestartet."
      - if:
          - condition: template
            value_template: >
                  {% set s = states.sensor.solarflow_2_status_raw %}
                  {% set fresh = s is not none and s.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(s.last_reported, 0)) < 120 %}
                  {% set bt = states.sensor.solarflow_2_battery_temp_control %}
                  {% set ht = states.sensor.solarflow_2_hub_temp_control %}
                  {% set have_temp = (bt is not none and is_number(bt.state)) or (ht is not none and is_number(ht.state)) %}
                  {% set t = states('sensor.solarflow_2_battery_temp_control') | float(states('sensor.solarflow_2_hub_temp_control') | float(999)) %}
                  {% set temp_mode_ok_u2 = have_temp and t >= 0 and t <= 52 and not is_state('sensor.solarflow_2_heizung', 'Aktiv') %}
                  {{ is_state('input_boolean.zendure_vguard_u2','on')
                     and is_state('input_boolean.zendure_emergency_u2','off')
                     and is_state('input_boolean.zendure_calib_mode_u2','off')
                     and fresh
                     and temp_mode_ok_u2
                     and states('sensor.solarflow_total_solar_input')|float(0) < states('input_number.zendure_conf_emerg_pv_gate')|float(150)
                     and (
                       states('sensor.solarflow_2_battery_level')|float(100) <= states('input_number.zendure_conf_soc_emerg_start')|float(15)
                       or states('sensor.solarflow_2_cell_min_vol')|float(99) <= 3.00
                     ) }}
        then:
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.zendure_vguard_u2 }
              - action: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.zendure_calib_discharge_u2
                    - input_boolean.zendure_calib_mode_u2
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_emergency_u2 }
              - variables:
                  t2: "{{ states('sensor.solarflow_2_battery_temp_control') | float(states('sensor.solarflow_2_hub_temp_control')|float(0)) }}"
                  soc2: "{{ states('sensor.solarflow_2_battery_level') | float(0) }}"
                  cl2: "{{ 100 if t2 < 5 else (300 if t2 < 10 else 800) }}"
                  ss2: "{{ 300 if soc2 < 12 else 800 }}"
                  limit_emerg_u2: "{{ [300, cl2|int, ss2|int]|min }}"
              - action: input_text.set_value
                target: { entity_id: input_text.zendure_ac_mode_u2 }
                data: { value: "Input mode" }
              - action: script.zendure_dispatch_u2_ac_mode
                data:
                  mode: "Input mode"
                  force: true
              - action: script.zendure_set_u2_outputlimit_zero
              - action: script.zendure_dispatch_u2_inputlimit
                data:
                  power: "{{ limit_emerg_u2 }}"
                  force: true
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_last_sent_2 }
                data: { value: 0 }
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id1
                data:
                  message: "🔋 *VGuard→Emergency U2*\nKritischer Low-SoC erkannt, VGuard freigegeben und Notladung mit {{ limit_emerg_u2|int }}W gestartet."

  # --- 6.8b AUTO-EMERGENCY MANAGER (PER-UNIT) ---
  - alias: "Zendure: Auto-Emergency Manager (Per-Unit)"
    id: "zendure_auto_emergency_manager_dual"
    mode: parallel
    initial_state: true
    triggers:
      - trigger: homeassistant
        event: start
        id: "boot_check"

      # U1 START (SoC-basiert, konservativ)
      - trigger: template
        id: "start_u1_soc"
        value_template: >
          {% set s = states.sensor.solarflow_1_status_raw %}
          {% set fresh = s is not none and s.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(s.last_reported, 0)) < 120 %}
          {% set vmin_ok = has_value('sensor.solarflow_1_cell_min_vol') %}
          {% set vol = states('sensor.solarflow_1_cell_min_vol')|float(0) if vmin_ok else 0 %}
          {% set soc = states('sensor.solarflow_1_battery_level')|float(100) %}
          {% set bt = states.sensor.solarflow_1_battery_temp_control %}
          {% set ht = states.sensor.solarflow_1_hub_temp_control %}
          {% set have_temp = (bt is not none and is_number(bt.state)) or (ht is not none and is_number(ht.state)) %}
          {% set t = states('sensor.solarflow_1_battery_temp_control') | float(states('sensor.solarflow_1_hub_temp_control') | float(999)) %}
          {% set temp_mode_ok_u1 = have_temp and t >= 0 and t <= 52 and not is_state('sensor.solarflow_1_heizung', 'Aktiv') %}
          {% set plausible = vmin_ok and vol > 2.0 and temp_mode_ok_u1 %}
          {{ fresh and plausible
             and is_state('input_boolean.zendure_emergency_u1', 'off')
             and is_state('input_boolean.zendure_vguard_u1', 'off')
             and is_state('input_boolean.zendure_calib_mode_u1', 'off')
             and states('sensor.solarflow_total_solar_input')|float(0) < states('input_number.zendure_conf_emerg_pv_gate')|float(150)
             and is_state('input_boolean.zendure_calib_discharge_u1','off')
             and soc <= states('input_number.zendure_conf_soc_emerg_start')|float(15)
             and temp_mode_ok_u1 }}
        for: "00:05:00"

      - trigger: template
        id: "start_u1_vol_soft"
        value_template: >
          {% set s = states.sensor.solarflow_1_status_raw %}
          {% set fresh = s is not none and s.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(s.last_reported, 0)) < 120 %}
          {% set vmin_ok = has_value('sensor.solarflow_1_cell_min_vol') %}
          {% set vol = states('sensor.solarflow_1_cell_min_vol')|float(0) if vmin_ok else 0 %}
          {% set soc = states('sensor.solarflow_1_battery_level')|float(100) %}
          {% set out = states('sensor.solarflow_1_output_power')|float(0) %}
          {% set lim = states('sensor.solarflow_1_output_limit')|float(0) %}
          {% set bt = states.sensor.solarflow_1_battery_temp_control %}
          {% set ht = states.sensor.solarflow_1_hub_temp_control %}
          {% set have_temp = (bt is not none and is_number(bt.state)) or (ht is not none and is_number(ht.state)) %}
          {% set t = states('sensor.solarflow_1_battery_temp_control') | float(states('sensor.solarflow_1_hub_temp_control') | float(999)) %}
          {% set temp_mode_ok_u1 = have_temp and t >= 0 and t <= 52 and not is_state('sensor.solarflow_1_heizung', 'Aktiv') %}
          {{ fresh
             and vmin_ok
             and is_state('input_boolean.zendure_emergency_u1', 'off')
             and is_state('input_boolean.zendure_vguard_u1', 'off')
             and is_state('input_boolean.zendure_calib_mode_u1', 'off')
             and is_state('input_boolean.zendure_calib_discharge_u1', 'off')
             and states('sensor.solarflow_total_solar_input')|float(0) < states('input_number.zendure_conf_emerg_pv_gate')|float(150)
             and vol <= 3.05
             and soc < (states('input_number.zendure_conf_soc_emerg_stop')|float(25) + 2)
             and (out > 80 or lim > 100)
             and temp_mode_ok_u1 }}
        for: "00:02:00"

      - trigger: template
        id: "start_u1_vol_hard"
        value_template: >
          {% set s = states.sensor.solarflow_1_status_raw %}
          {% set fresh = s is not none and s.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(s.last_reported, 0)) < 120 %}
          {% set vmin_ok = has_value('sensor.solarflow_1_cell_min_vol') %}
          {% set vol = states('sensor.solarflow_1_cell_min_vol')|float(0) if vmin_ok else 0 %}
          {% set out = states('sensor.solarflow_1_output_power')|float(0) %}
          {% set lim = states('sensor.solarflow_1_output_limit')|float(0) %}
          {% set bt = states.sensor.solarflow_1_battery_temp_control %}
          {% set ht = states.sensor.solarflow_1_hub_temp_control %}
          {% set have_temp = (bt is not none and is_number(bt.state)) or (ht is not none and is_number(ht.state)) %}
          {% set t = states('sensor.solarflow_1_battery_temp_control') | float(states('sensor.solarflow_1_hub_temp_control') | float(999)) %}
          {% set temp_mode_ok_u1 = have_temp and t >= 0 and t <= 52 and not is_state('sensor.solarflow_1_heizung', 'Aktiv') %}
          {{ fresh
             and vmin_ok
             and is_state('input_boolean.zendure_emergency_u1', 'off')
             and is_state('input_boolean.zendure_vguard_u1', 'off')
             and is_state('input_boolean.zendure_calib_mode_u1', 'off')
             and is_state('input_boolean.zendure_calib_discharge_u1', 'off')
             and states('sensor.solarflow_total_solar_input')|float(0) < states('input_number.zendure_conf_emerg_pv_gate')|float(150)
             and vol <= 3.00
             and (out > 80 or lim > 100)
             and temp_mode_ok_u1 }}
        for: "00:00:30"

      - trigger: template
        id: "start_u1_vol_panic"
        value_template: >
          {{ has_value('sensor.solarflow_1_cell_min_vol')
             and states('sensor.solarflow_1_cell_min_vol')|float(99) <= 2.95
             and is_state('input_boolean.zendure_emergency_u1','off') }}
        for: "00:00:10"

      - trigger: template
        id: "start_u2_vol_panic"
        value_template: >
          {{ has_value('sensor.solarflow_2_cell_min_vol')
             and states('sensor.solarflow_2_cell_min_vol')|float(99) <= 2.95
             and is_state('input_boolean.zendure_emergency_u2','off') }}
        for: "00:00:10"

      # U1 STOP
      - trigger: template
        id: "stop_u1"
        value_template: >
          {% set bt = states.sensor.solarflow_1_battery_temp_control %}
          {% set ht = states.sensor.solarflow_1_hub_temp_control %}
          {% set have_temp = (bt is not none and is_number(bt.state)) or (ht is not none and is_number(ht.state)) %}
          {% set t = states('sensor.solarflow_1_battery_temp_control') | float(states('sensor.solarflow_1_hub_temp_control') | float(999)) %}
          {% set temp_mode_ok_u1 = have_temp and t >= 0 and t <= 52 and not is_state('sensor.solarflow_1_heizung', 'Aktiv') %}
          {{ is_state('input_boolean.zendure_emergency_u1', 'on')
             and (
               (states('sensor.solarflow_1_battery_level')|float(0) >= states('input_number.zendure_conf_soc_emerg_stop')|float(25)
                and states('sensor.solarflow_1_cell_min_vol')|float(0) >= 3.25)
               or states('sensor.solarflow_total_solar_input')|float(0) > 200
               or states('sensor.solarflow_1_status_raw')|upper in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
               or not temp_mode_ok_u1
             ) }}
        for: "00:05:00"

      # U2 START (SoC-basiert, konservativ)
      - trigger: template
        id: "start_u2_soc"
        value_template: >
          {% set s = states.sensor.solarflow_2_status_raw %}
          {% set fresh = s is not none and s.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(s.last_reported, 0)) < 120 %}
          {% set vmin_ok = has_value('sensor.solarflow_2_cell_min_vol') %}
          {% set vol = states('sensor.solarflow_2_cell_min_vol')|float(0) if vmin_ok else 0 %}
          {% set soc = states('sensor.solarflow_2_battery_level')|float(100) %}
          {% set bt = states.sensor.solarflow_2_battery_temp_control %}
          {% set ht = states.sensor.solarflow_2_hub_temp_control %}
          {% set have_temp = (bt is not none and is_number(bt.state)) or (ht is not none and is_number(ht.state)) %}
          {% set t = states('sensor.solarflow_2_battery_temp_control') | float(states('sensor.solarflow_2_hub_temp_control') | float(999)) %}
          {% set temp_mode_ok_u2 = have_temp and t >= 0 and t <= 52 and not is_state('sensor.solarflow_2_heizung', 'Aktiv') %}
          {% set plausible = vmin_ok and vol > 2.0 and temp_mode_ok_u2 %}
          {{ fresh and plausible
             and is_state('input_boolean.zendure_emergency_u2', 'off')
             and is_state('input_boolean.zendure_vguard_u2', 'off')
             and is_state('input_boolean.zendure_calib_mode_u2', 'off')
             and states('sensor.solarflow_total_solar_input')|float(0) < states('input_number.zendure_conf_emerg_pv_gate')|float(150)
             and is_state('input_boolean.zendure_calib_discharge_u2','off')
             and soc <= states('input_number.zendure_conf_soc_emerg_start')|float(15)
             and temp_mode_ok_u2 }}
        for: "00:05:00"

      - trigger: template
        id: "start_u2_vol_soft"
        value_template: >
          {% set s = states.sensor.solarflow_2_status_raw %}
          {% set fresh = s is not none and s.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(s.last_reported, 0)) < 120 %}
          {% set vmin_ok = has_value('sensor.solarflow_2_cell_min_vol') %}
          {% set vol = states('sensor.solarflow_2_cell_min_vol')|float(0) if vmin_ok else 0 %}
          {% set soc = states('sensor.solarflow_2_battery_level')|float(100) %}
          {% set out = states('sensor.solarflow_2_output_power')|float(0) %}
          {% set lim = states('sensor.solarflow_2_output_limit')|float(0) %}
          {% set bt = states.sensor.solarflow_2_battery_temp_control %}
          {% set ht = states.sensor.solarflow_2_hub_temp_control %}
          {% set have_temp = (bt is not none and is_number(bt.state)) or (ht is not none and is_number(ht.state)) %}
          {% set t = states('sensor.solarflow_2_battery_temp_control') | float(states('sensor.solarflow_2_hub_temp_control') | float(999)) %}
          {% set temp_mode_ok_u2 = have_temp and t >= 0 and t <= 52 and not is_state('sensor.solarflow_2_heizung', 'Aktiv') %}
          {{ fresh
             and vmin_ok
             and is_state('input_boolean.zendure_emergency_u2', 'off')
             and is_state('input_boolean.zendure_vguard_u2', 'off')
             and is_state('input_boolean.zendure_calib_mode_u2', 'off')
             and is_state('input_boolean.zendure_calib_discharge_u2', 'off')
             and states('sensor.solarflow_total_solar_input')|float(0) < states('input_number.zendure_conf_emerg_pv_gate')|float(150)
             and vol <= 3.05
             and soc < (states('input_number.zendure_conf_soc_emerg_stop')|float(25) + 2)
             and (out > 80 or lim > 100)
             and temp_mode_ok_u2 }}
        for: "00:02:00"

      - trigger: template
        id: "start_u2_vol_hard"
        value_template: >
          {% set s = states.sensor.solarflow_2_status_raw %}
          {% set fresh = s is not none and s.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR'] and (as_timestamp(now()) - as_timestamp(s.last_reported, 0)) < 120 %}
          {% set vmin_ok = has_value('sensor.solarflow_2_cell_min_vol') %}
          {% set vol = states('sensor.solarflow_2_cell_min_vol')|float(0) if vmin_ok else 0 %}
          {% set out = states('sensor.solarflow_2_output_power')|float(0) %}
          {% set lim = states('sensor.solarflow_2_output_limit')|float(0) %}
          {% set bt = states.sensor.solarflow_2_battery_temp_control %}
          {% set ht = states.sensor.solarflow_2_hub_temp_control %}
          {% set have_temp = (bt is not none and is_number(bt.state)) or (ht is not none and is_number(ht.state)) %}
          {% set t = states('sensor.solarflow_2_battery_temp_control') | float(states('sensor.solarflow_2_hub_temp_control') | float(999)) %}
          {% set temp_mode_ok_u2 = have_temp and t >= 0 and t <= 52 and not is_state('sensor.solarflow_2_heizung', 'Aktiv') %}
          {{ fresh
             and vmin_ok
             and is_state('input_boolean.zendure_emergency_u2', 'off')
             and is_state('input_boolean.zendure_vguard_u2', 'off')
             and is_state('input_boolean.zendure_calib_mode_u2', 'off')
             and is_state('input_boolean.zendure_calib_discharge_u2', 'off')
             and states('sensor.solarflow_total_solar_input')|float(0) < states('input_number.zendure_conf_emerg_pv_gate')|float(150)
             and vol <= 3.00
             and (out > 80 or lim > 100)
             and temp_mode_ok_u2 }}
        for: "00:00:30"

      # U2 STOP
      - trigger: template
        id: "stop_u2"
        value_template: >
          {% set bt = states.sensor.solarflow_2_battery_temp_control %}
          {% set ht = states.sensor.solarflow_2_hub_temp_control %}
          {% set have_temp = (bt is not none and is_number(bt.state)) or (ht is not none and is_number(ht.state)) %}
          {% set t = states('sensor.solarflow_2_battery_temp_control') | float(states('sensor.solarflow_2_hub_temp_control') | float(999)) %}
          {% set temp_mode_ok_u2 = have_temp and t >= 0 and t <= 52 and not is_state('sensor.solarflow_2_heizung', 'Aktiv') %}
          {{ is_state('input_boolean.zendure_emergency_u2', 'on')
             and (
               (states('sensor.solarflow_2_battery_level')|float(0) >= states('input_number.zendure_conf_soc_emerg_stop')|float(25)
                and states('sensor.solarflow_2_cell_min_vol')|float(0) >= 3.25)
               or states('sensor.solarflow_total_solar_input')|float(0) > 200
               or states('sensor.solarflow_2_status_raw')|upper in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
               or not temp_mode_ok_u2
             ) }}
        for: "00:05:00"

    conditions:
      - condition: state
        entity_id: input_boolean.zendure_auto_mode
        state: "on"

    actions:
      - variables:
          t1: "{{ states('sensor.solarflow_1_battery_temp_control') | float(states('sensor.solarflow_1_hub_temp_control')|float(0)) }}"
          t2: "{{ states('sensor.solarflow_2_battery_temp_control') | float(states('sensor.solarflow_2_hub_temp_control')|float(0)) }}"
          soc1: "{{ states('sensor.solarflow_1_battery_level') | float(0) }}"
          soc2: "{{ states('sensor.solarflow_2_battery_level') | float(0) }}"
          cl1: "{% if t1 < 5 %} 100 {% elif t1 < 10 %} 300 {% else %} 800 {% endif %}"
          cl2: "{% if t2 < 5 %} 100 {% elif t2 < 10 %} 300 {% else %} 800 {% endif %}"
          ss1: "{% if soc1 < 12 %} 300 {% else %} 800 {% endif %}"
          ss2: "{% if soc2 < 12 %} 300 {% else %} 800 {% endif %}"
          limit_emerg_u1: "{{ [300, cl1|int, ss1|int]|min }}"
          limit_emerg_u2: "{{ [300, cl2|int, ss2|int]|min }}"


      - if:
          - condition: template
            value_template: >
              {% set s = states.sensor.solarflow_1_status_raw %}
              {% set fresh = s is not none
                   and s.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
                   and (as_timestamp(now()) - as_timestamp(s.last_reported, 0)) < 120 %}

              {% set bt = states.sensor.solarflow_1_battery_temp_control %}
              {% set ht = states.sensor.solarflow_1_hub_temp_control %}
              {% set have_temp = (bt is not none and is_number(bt.state))
                   or (ht is not none and is_number(ht.state)) %}
              {% set t = states('sensor.solarflow_1_battery_temp_control') | float(states('sensor.solarflow_1_hub_temp_control') | float(999)) %}
              {% set temp_mode_ok_u1 = have_temp
                   and t >= 0
                   and t <= 52
                   and not is_state('sensor.solarflow_1_heizung', 'Aktiv') %}

              {% set soc = states('sensor.solarflow_1_battery_level') | float(100) %}
              {% set vmin = states('sensor.solarflow_1_cell_min_vol') | float(99) %}
              {% set soc_start = states('input_number.zendure_conf_soc_emerg_start') | float(15) %}
              {% set soc_stop = states('input_number.zendure_conf_soc_emerg_stop') | float(25) %}
              {% set pv_low = states('sensor.solarflow_total_solar_input') | float(0)
                   < states('input_number.zendure_conf_emerg_pv_gate') | float(150) %}
              {% set ac_input = states('sensor.solarflow_1_ac_mode') == 'Input mode' %}
              {% set grid_in = states('sensor.solarflow_1_grid_input_power') | float(0) > 50 %}
              {% set calib_discharge = is_state('input_boolean.zendure_calib_discharge_u1','on') %}
              {% set calib_mode = is_state('input_boolean.zendure_calib_mode_u1','on') %}
              {% set panic = vmin <= 2.95 %}

              {% set normal_emergency =
                   fresh
                   and temp_mode_ok_u1
                   and pv_low
                   and not calib_discharge
                   and not calib_mode
                   and (
                        soc <= soc_start
                        or vmin <= 3.00
                        or (soc < soc_stop and (ac_input or grid_in))
                   )
              %}

              {{ trigger.id == 'boot_check'
                 and fresh
                 and is_state('input_boolean.zendure_emergency_u1', 'off')
                 and (panic or normal_emergency) }}
        then:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.zendure_calib_discharge_u1
                - input_boolean.zendure_calib_mode_u1
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.zendure_emergency_u1
          - action: input_text.set_value
            target:
              entity_id: input_text.zendure_ac_mode_u1
            data:
              value: "Input mode"
          - action: script.zendure_dispatch_u1_ac_mode
            data:
              mode: "Input mode"
              force: true
          - action: script.zendure_set_u1_outputlimit_zero
          - action: script.zendure_dispatch_u1_inputlimit
            data:
              power: "{{ limit_emerg_u1 }}"
              force: true
          - action: input_number.set_value
            target:
              entity_id: input_number.zendure_last_sent_1
            data:
              value: 0
          - action: notify.send_message
            target:
              entity_id: !secret telegram_id1
            data:
              message: >
                {% set vmin = states('sensor.solarflow_1_cell_min_vol') | float(99) %}
                {% if vmin <= 2.95 %}
                  🚨 *Zendure Notladung (Unit 1)*\nSofortstart nach HA-Neustart: Panic-Unterspannung erkannt (vmin {{ vmin|round(2) }} V).
                {% else %}
                  🔋 *Zendure Notladung (Unit 1)*\nSofortstart nach HA-Neustart: kritischer Low-SoC erkannt.
                {% endif %}

      - if:
          - condition: template
            value_template: >
              {% set s = states.sensor.solarflow_2_status_raw %}
              {% set fresh = s is not none
                   and s.state|upper not in ['UNAVAILABLE','UNKNOWN','FAULT','ERROR']
                   and (as_timestamp(now()) - as_timestamp(s.last_reported, 0)) < 120 %}

              {% set bt = states.sensor.solarflow_2_battery_temp_control %}
              {% set ht = states.sensor.solarflow_2_hub_temp_control %}
              {% set have_temp = (bt is not none and is_number(bt.state))
                   or (ht is not none and is_number(ht.state)) %}
              {% set t = states('sensor.solarflow_2_battery_temp_control') | float(states('sensor.solarflow_2_hub_temp_control') | float(999)) %}
              {% set temp_mode_ok_u2 = have_temp
                   and t >= 0
                   and t <= 52
                   and not is_state('sensor.solarflow_2_heizung', 'Aktiv') %}

              {% set soc = states('sensor.solarflow_2_battery_level') | float(100) %}
              {% set vmin = states('sensor.solarflow_2_cell_min_vol') | float(99) %}
              {% set soc_start = states('input_number.zendure_conf_soc_emerg_start') | float(15) %}
              {% set soc_stop = states('input_number.zendure_conf_soc_emerg_stop') | float(25) %}
              {% set pv_low = states('sensor.solarflow_total_solar_input') | float(0)
                   < states('input_number.zendure_conf_emerg_pv_gate') | float(150) %}
              {% set ac_input = states('sensor.solarflow_2_ac_mode') == 'Input mode' %}
              {% set grid_in = states('sensor.solarflow_2_grid_input_power') | float(0) > 50 %}
              {% set calib_discharge = is_state('input_boolean.zendure_calib_discharge_u2','on') %}
              {% set calib_mode = is_state('input_boolean.zendure_calib_mode_u2','on') %}
              {% set panic = vmin <= 2.95 %}

              {% set normal_emergency =
                   fresh
                   and temp_mode_ok_u2
                   and pv_low
                   and not calib_discharge
                   and not calib_mode
                   and (
                        soc <= soc_start
                        or vmin <= 3.00
                        or (soc < soc_stop and (ac_input or grid_in))
                   )
              %}

              {{ trigger.id == 'boot_check'
                 and fresh
                 and is_state('input_boolean.zendure_emergency_u2', 'off')
                 and (panic or normal_emergency) }}
        then:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.zendure_calib_discharge_u2
                - input_boolean.zendure_calib_mode_u2
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.zendure_emergency_u2
          - action: input_text.set_value
            target:
              entity_id: input_text.zendure_ac_mode_u2
            data:
              value: "Input mode"
          - action: script.zendure_dispatch_u2_ac_mode
            data:
              mode: "Input mode"
              force: true
          - action: script.zendure_set_u2_outputlimit_zero
          - action: script.zendure_dispatch_u2_inputlimit
            data:
              power: "{{ limit_emerg_u2 }}"
              force: true
          - action: input_number.set_value
            target:
              entity_id: input_number.zendure_last_sent_2
            data:
              value: 0
          - action: notify.send_message
            target:
              entity_id: !secret telegram_id1
            data:
              message: >
                {% set vmin = states('sensor.solarflow_2_cell_min_vol') | float(99) %}
                {% if vmin <= 2.95 %}
                  🚨 *Zendure Notladung (Unit 2)*\nSofortstart nach HA-Neustart: Panic-Unterspannung erkannt (vmin {{ vmin|round(2) }} V).
                {% else %}
                  🔋 *Zendure Notladung (Unit 2)*\nSofortstart nach HA-Neustart: kritischer Low-SoC erkannt.
                {% endif %}

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.id in ['start_u1_soc','start_u1_vol_soft','start_u1_vol_hard','start_u1_vol_panic'] }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.zendure_calib_discharge_u1
                    - input_boolean.zendure_calib_mode_u1
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_emergency_u1 }
              - action: input_text.set_value
                target: { entity_id: input_text.zendure_ac_mode_u1 }
                data: { value: "Input mode" }
              - action: script.zendure_dispatch_u1_ac_mode
                data:
                  mode: "Input mode"
                  force: true
              - action: script.zendure_set_u1_outputlimit_zero
              - action: script.zendure_dispatch_u1_inputlimit
                data:
                  power: "{{ limit_emerg_u1 }}"
                  force: true
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_last_sent_1 }
                data: { value: 0 }
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id1
                data:
                  message: "🔋 *Zendure Notladung (Unit 1)*\nGestartet (SoC < Limit oder Spannung <= 3.05V / Hard-Floor <= 3.00V)."

          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'stop_u1' }}"
            sequence:
              # Erst Ladepfad sicher schließen.
              - action: script.zendure_dispatch_u1_inputlimit
                data:
                  power: 0
                  force: true
              - action: input_text.set_value
                target: { entity_id: input_text.zendure_ac_mode_u1 }
                data: { value: "Output mode" }
              - action: script.zendure_dispatch_u1_ac_mode
                data:
                  mode: "Output mode"
                  force: true
              - action: script.zendure_set_u1_outputlimit_zero

              # Danach Emergency-Status beenden.
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.zendure_emergency_u1 }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_last_sent_1 }
                data: { value: 0 }
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id1
                data:
                  message: >
                    {% set bt = states.sensor.solarflow_1_battery_temp_control %}
                    {% set ht = states.sensor.solarflow_1_hub_temp_control %}
                    {% set have_temp = (bt is not none and is_number(bt.state)) or (ht is not none and is_number(ht.state)) %}
                    {% set t = states('sensor.solarflow_1_battery_temp_control') | float(states('sensor.solarflow_1_hub_temp_control') | float(999)) %}
                    {% set temp_mode_ok_u1 = have_temp and t >= 0 and t <= 52 and not is_state('sensor.solarflow_1_heizung', 'Aktiv') %}
                    {% if not temp_mode_ok_u1 %}
                      ⚠️ *Zendure Notladung (Unit 1) abgebrochen*\nTemperatur nicht operativ.
                    {% else %}
                      ✅ *Zendure Notladung (Unit 1)*\nBeendet (Werte stabilisiert).
                    {% endif %}

          - conditions:
              - condition: template
                value_template: "{{ trigger.id in ['start_u2_soc','start_u2_vol_soft','start_u2_vol_hard','start_u2_vol_panic'] }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.zendure_calib_discharge_u2
                    - input_boolean.zendure_calib_mode_u2
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.zendure_emergency_u2 }
              - action: input_text.set_value
                target: { entity_id: input_text.zendure_ac_mode_u2 }
                data: { value: "Input mode" }
              - action: script.zendure_dispatch_u2_ac_mode
                data:
                  mode: "Input mode"
                  force: true
              - action: script.zendure_set_u2_outputlimit_zero
              - action: script.zendure_dispatch_u2_inputlimit
                data:
                  power: "{{ limit_emerg_u2 }}"
                  force: true
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_last_sent_2 }
                data: { value: 0 }
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id1
                data:
                  message: "🔋 *Zendure Notladung (Unit 2)*\nGestartet (SoC < Limit oder Spannung <= 3.05V / Hard-Floor <= 3.00V)."

          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'stop_u2' }}"
            sequence:
              # Erst Ladepfad sicher schließen.
              - action: script.zendure_dispatch_u2_inputlimit
                data:
                  power: 0
                  force: true
              - action: input_text.set_value
                target: { entity_id: input_text.zendure_ac_mode_u2 }
                data: { value: "Output mode" }
              - action: script.zendure_dispatch_u2_ac_mode
                data:
                  mode: "Output mode"
                  force: true
              - action: script.zendure_set_u2_outputlimit_zero

              # Danach Emergency-Status beenden.
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.zendure_emergency_u2 }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_last_sent_2 }
                data: { value: 0 }
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id1
                data:
                  message: >
                    {% set bt = states.sensor.solarflow_2_battery_temp_control %}
                    {% set ht = states.sensor.solarflow_2_hub_temp_control %}
                    {% set have_temp = (bt is not none and is_number(bt.state)) or (ht is not none and is_number(ht.state)) %}
                    {% set t = states('sensor.solarflow_2_battery_temp_control') | float(states('sensor.solarflow_2_hub_temp_control') | float(999)) %}
                    {% set temp_mode_ok_u2 = have_temp and t >= 0 and t <= 52 and not is_state('sensor.solarflow_2_heizung', 'Aktiv') %}
                    {% if not temp_mode_ok_u2 %}
                      ⚠️ *Zendure Notladung (Unit 2) abgebrochen*\nTemperatur nicht operativ.
                    {% else %}
                      ✅ *Zendure Notladung (Unit 2)*\nBeendet (Werte stabilisiert).
                    {% endif %}

  # --- 6.9 SEASON MANAGER ---
  - alias: "Zendure: Season Manager"
    id: "zendure_season_manager_dual"
    initial_state: true
    triggers:
      - trigger: time
        at: "04:00:00"
      - trigger: homeassistant
        event: start
    actions:
      - choose:
          # WINTER (Oktober - März)
          - conditions:
              - condition: template
                value_template: "{{ now().month >= 10 or now().month < 4 }}"
            sequence:
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_conf_soc_off }
                data: { value: 20 }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_conf_soc_bypass }
                data: { value: 25 }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_conf_soc_emerg_start }
                data: { value: 10 }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_conf_soc_emerg_stop }
                data: { value: 15 }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_conf_calib_days }
                data: { value: 14 }

          # SOMMER (April - September)
          - conditions:
              - condition: template
                value_template: "{{ now().month >= 4 and now().month < 10 }}"
            sequence:
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_conf_soc_off }
                data: { value: 14 }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_conf_soc_bypass }
                data: { value: 16 }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_conf_soc_emerg_start }
                data: { value: 10 }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_conf_soc_emerg_stop }
                data: { value: 13 }
              - action: input_number.set_value
                target: { entity_id: input_number.zendure_conf_calib_days }
                data: { value: 14 }

      - action: input_number.set_value
        target: { entity_id: input_number.zendure_conf_grid_bias }
        data: { value: 10 }
      - action: input_number.set_value
        target: { entity_id: input_number.zendure_conf_hysteresis }
        data: { value: 10 }
      - action: input_number.set_value
        target: { entity_id: input_number.zendure_conf_min_change }
        data: { value: 8 }

      - delay: "00:00:05"
      - parallel:
        - if:
            - condition: template
              value_template: "{{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR'] }}"
          then:
            - action: mqtt.publish
              data: { topic: !secret zendure_topic_u1_switch_smartMode_set, payload: "ON", qos: 1 }
        - if:
            - condition: template
              value_template: "{{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR'] }}"
          then:
            - action: mqtt.publish
              data: { topic: !secret zendure_topic_u2_switch_smartMode_set, payload: "ON", qos: 1 }
      - delay: "00:00:02"
      - parallel:
        - if:
            - condition: template
              value_template: "{{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR'] }}"
          then:
            - action: mqtt.publish
              data: { topic: !secret zendure_topic_u1_switch_smartMode_set, payload: "ON", qos: 1 }
        - if:
            - condition: template
              value_template: "{{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR'] }}"
          then:
            - action: mqtt.publish
              data: { topic: !secret zendure_topic_u2_switch_smartMode_set, payload: "ON", qos: 1 }

  # --- 6.10 MONITORING ---
  - alias: "Zendure: Monitoring"
    id: "zendure_monitoring_dual"
    initial_state: true
    triggers:
      - trigger: template
        id: "shelly_fail"
        value_template: >-
          {% set s = states.sensor.zendure_grid_power %}
          {{ not (s is not none and s.state|upper not in ['UNAVAILABLE','UNKNOWN','NONE'] and is_number(s.state)) }}
        for: "00:00:30"
      - trigger: template
        id: "shelly_ok"
        value_template: >-
          {% set s = states.sensor.zendure_grid_power %}
          {{ s is not none and s.state|upper not in ['UNAVAILABLE','UNKNOWN','NONE'] and is_number(s.state) }}
        for: "00:01:00"

      - trigger: state
        entity_id: sensor.solarflow_1_status_raw
        to: "unavailable"
        for: "00:03:00"
        id: "u1_offline"
      - trigger: state
        entity_id: sensor.solarflow_2_status_raw
        to: "unavailable"
        for: "00:03:00"
        id: "u2_offline"

      - trigger: template
        id: "u1_fault"
        value_template: "{{ states('sensor.solarflow_1_status_raw')|upper in ['FAULT', 'ERROR'] }}"
        for: "00:03:00"
      - trigger: template
        id: "u2_fault"
        value_template: "{{ states('sensor.solarflow_2_status_raw')|upper in ['FAULT', 'ERROR'] }}"
        for: "00:03:00"

    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'shelly_fail' }}"
            sequence:
              - action: persistent_notification.create
                data: { title: "⚠️ Zendure Failsafe", message: "Netzdaten fehlen (Shelly offline). Grundlast aktiv.", notification_id: "sf_failsafe" }
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'shelly_ok' }}"
            sequence:
              - action: persistent_notification.dismiss
                data: { notification_id: "sf_failsafe" }

          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'u1_offline' }}"
            sequence:
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id1
                data:
                  message: "⚠️ *Zendure Warnung*\nUnit 1 ist offline/nicht erreichbar."
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'u2_offline' }}"
            sequence:
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id1
                data:
                  message: "⚠️ *Zendure Warnung*\nUnit 2 ist offline/nicht erreichbar."

          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'u1_fault' }}"
            sequence:
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id1
                data:
                  message: "❌ *Zendure Fehler*\nUnit 1 meldet Fehlerstatus (FAULT/ERROR)!"
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'u2_fault' }}"
            sequence:
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id1
                data:
                  message: "❌ *Zendure Fehler*\nUnit 2 meldet Fehlerstatus (FAULT/ERROR)!"


# --- 6.11 PROGNOSE: ÜBERFÜLLUNG ---
  - alias: "Zendure Info: Intelligente Tagesprognose (10 Uhr)"
    id: "zendure_info_smart_forecast"
    description: >-
      Berechnet, ob und wann der Akku voll wird, und gibt passgenaue
      Verbrauchs-Empfehlungen.
    mode: single
    triggers:
      - trigger: time
        at: "10:00:00"
    variables:
      total_capacity_wh: 3840
      target_soc: 95
      base_load_w: 180

      soc: "{{ states('sensor.solarflow_system_battery_level') | float(-1) }}"
      soc_valid: "{{ soc >= 0 }}"

      missing_wh: >
        {% if soc_valid %}
          {{ [(((target_soc - soc) / 100) * total_capacity_wh), 0] | max }}
        {% else %}
          0
        {% endif %}

      forecast_left_kwh: "{{ states('sensor.energy_production_today_remaining') | float(0) }}"
      forecast_left_wh: "{{ (forecast_left_kwh * 1000) | round(0) }}"

      now_ts: "{{ as_timestamp(now()) }}"
      sunset_ts: >-
        {{ as_timestamp(state_attr('sun.sun', 'next_setting'), default=now_ts + 8*3600) }}

      hours_to_sunset: "{{ [((sunset_ts - now_ts) / 3600), 0.1] | max }}"
      eff_sun_h: "{{ [hours_to_sunset * 0.7, 0.1] | max }}"

      avg_pv_power_w: "{{ (forecast_left_wh / eff_sun_h) | float(0) }}"
      net_avg_charge_w: "{{ [ (avg_pv_power_w - base_load_w), 0 ] | max }}"

      peak_ts: >-
        {{ as_timestamp(states('sensor.power_highest_peak_time_today'), default=now_ts + 4*3600) }}
      peak_ts_safe: "{{ [peak_ts, now_ts] | max }}"
      peak_time: "{{ peak_ts_safe | timestamp_custom('%H:%M') }}"

      hours_to_peak: "{{ [((peak_ts_safe - now_ts) / 3600), 0] | max }}"
      net_to_peak_wh: "{{ (net_avg_charge_w * hours_to_peak) | round(0) }}"

      full_before_peak: "{{ (missing_wh > 0) and (net_to_peak_wh >= missing_wh) }}"

      hours_to_full: >
        {% if net_avg_charge_w > 50 %}
          {{ missing_wh / net_avg_charge_w }}
        {% else %}
          99
        {% endif %}

      will_fill_today: >-
        {% if hours_to_full < 99 %}
          {{ forecast_left_wh > (missing_wh + (hours_to_full * base_load_w)) }}
        {% else %}
          false
        {% endif %}

      full_time: >
        {% if (hours_to_full | float(99)) < 8 %}
          {{ (now_ts + ((hours_to_full | float) * 3600)) | timestamp_custom('%H:%M') }}
        {% else %}
          später am Nachmittag
        {% endif %}

    conditions:
      - condition: template
        value_template: "{{ soc_valid and will_fill_today }}"
      - condition: numeric_state
        entity_id: sensor.solarflow_total_solar_input
        above: 50
      - condition: or
        conditions:
          - condition: state
            entity_id: !secret zendure_person.id1
            state: "home"
          - condition: state
            entity_id: !secret zendure_person.id2
            state: "home"

    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ full_before_peak }}"
            sequence:
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id2
                data:
                  message: >
                    Der PV Speicher ({{ soc | round(0) }}%) wird heute um **{{ full_time }} Uhr** voll sein.
                    👉 **Großgeräte am besten um {{ full_time }} Uhr starten**.

                    (Leistungs Peak ist um ca. {{ peak_time }} Uhr.)
          - conditions:
              - condition: template
                value_template: "{{ not full_before_peak }}"
            sequence:
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id2
                data:
                  message: >
                    Die PV Energie reicht, um den Akku ({{ soc | round(0) }}%) heute bis {{ target_soc }}% zu laden.
                    👉 **Großgeräte am besten um {{ peak_time }} Uhr starten.**


# --- 6.13 AUTO-NOTSTROM (USV) ---
  - alias: "Zendure: Auto-Notstrom (UPS Ausfall)"
    id: "zendure_auto_notstrom_usv"
    description: "Aktiviert Zendure Off-Grid via direktem MQTT-Publish (Bypass HA-Availability)."
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.ups_status
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
        id: "boot"
    actions:
      - if:
          - condition: template
            value_template: "{{ trigger.id == 'boot' }}"
        then:
          - wait_template: >
              {{ 'online' in states('sensor.ups_status')|lower or
                 'battery' in states('sensor.ups_status')|lower or
                 'ob' in states('sensor.ups_status')|lower or
                 'ol' in states('sensor.ups_status')|lower }}
            timeout: "00:00:30"
            continue_on_timeout: false

      - choose:
          # ==========================================
          # FALL 1: STROMAUSFALL (On Battery / OB)
          # ==========================================
          - conditions:
              - condition: template
                value_template: >
                  {% set ups = states('sensor.ups_status') | lower %}
                  {% set d1 = states(states('input_text.zendure_gridoffmode_entity_u1')) | lower %}
                  {% set d2 = states(states('input_text.zendure_gridoffmode_entity_u2')) | lower %}
                  {{ ('on battery' in ups or 'ob' in ups or 'discharging' in ups) and
                     (d1 == 'off' or d2 == 'off') }}
            sequence:
              - action: mqtt.publish
                data:
                  topic: !secret zendure_topic_u1_select_gridOffMode_set
                  payload: "Normal mode"
                  qos: 1
              - action: mqtt.publish
                data:
                  topic: !secret zendure_topic_u2_select_gridOffMode_set
                  payload: "Normal mode"
                  qos: 1
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id1
                data:
                  message: >
                    🚨 *ACHTUNG: STROMAUSFALL!*
                    Die USV meldet Netzverlust (On Battery).
                    🔌 Die Zendure Notstrom-Steckdosen wurden automatisch via MQTT **AKTIVIERT**.

          # ==========================================
          # FALL 2: STROM ZURÜCK (Online / OL)
          # ==========================================
          - conditions:
              - condition: template
                value_template: >
                  {% set ups = states('sensor.ups_status') | lower %}
                  {% set d1 = states(states('input_text.zendure_gridoffmode_entity_u1')) | lower %}
                  {% set d2 = states(states('input_text.zendure_gridoffmode_entity_u2')) | lower %}
                  {{ ('online' in ups or 'ol' in ups) and
                     (d1 == 'normal mode' or d2 == 'normal mode') }}
            sequence:
              - action: mqtt.publish
                data:
                  topic: !secret zendure_topic_u1_select_gridOffMode_set
                  payload: "OFF"
                  qos: 1
              - action: mqtt.publish
                data:
                  topic: !secret zendure_topic_u2_select_gridOffMode_set
                  payload: "OFF"
                  qos: 1
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id1
                data:
                  message: >
                    ✅ *STROM WIEDER DA!*
                    Die USV meldet Netzrückkehr (Online).
                    🔌 Die Zendure Notstrom-Steckdosen wurden via MQTT **DEAKTIVIERT**.

# --- 6.14 AC MODE RECONCILE WATCHDOG ---
  - alias: "Zendure: AC Mode Reconcile Watchdog"
    id: "zendure_ac_mode_reconcile_watchdog"
    mode: parallel
    initial_state: true
    triggers:
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: state
        entity_id: input_boolean.zendure_auto_mode
        state: "on"
    actions:
      - parallel:
          - if:
              - condition: template
                value_template: >
                  {% set ac1 = states.sensor.solarflow_1_ac_mode %}
                  {% set soc1 = states('sensor.solarflow_1_battery_level')|float(100) %}
                  {% set gin1 = states('sensor.solarflow_1_grid_input_power')|float(0) %}
                  {{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR']
                     and ac1 is not none
                     and ac1.state == 'Input mode'
                     and states('input_text.zendure_ac_mode_u1') == 'Output mode'
                     and is_state('input_boolean.zendure_calib_mode_u1','off')
                     and is_state('input_boolean.zendure_calib_discharge_u1','off')
                     and is_state('input_boolean.zendure_emergency_u1','off')
                     and (soc1 <= 10 or gin1 > 50) }}
            then:
              - action: input_text.set_value
                target: { entity_id: input_text.zendure_ac_mode_u1 }
                data: { value: "Input mode" }
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id1
                data:
                  message: >
                    ℹ️ *AC-Reconcile U1 übersprungen (Schutzladung erkannt)*\n
                    Gerät blieb in Input mode (SoC/Grid-Ladung-Schutz aktiv). Helper wurde auf Input mode nachgezogen.
          - if:
              - condition: template
                value_template: >
                  {% set ac1 = states.sensor.solarflow_1_ac_mode %}
                  {% set soc1 = states('sensor.solarflow_1_battery_level')|float(100) %}
                  {% set gin1 = states('sensor.solarflow_1_grid_input_power')|float(0) %}
                  {% set protect_charge = ac1 is not none and ac1.state == 'Input mode'
                     and is_state('input_text.zendure_ac_mode_u1','Output mode')
                     and is_state('input_boolean.zendure_calib_mode_u1','off')
                     and is_state('input_boolean.zendure_calib_discharge_u1','off')
                     and is_state('input_boolean.zendure_emergency_u1','off')
                     and (soc1 <= 10 or gin1 > 50) %}
                  {{ states('sensor.solarflow_1_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR']
                     and ac1 is not none
                     and ac1.state in ['Input mode', 'Output mode']
                     and states('input_text.zendure_ac_mode_u1') in ['Input mode', 'Output mode']
                     and ac1.state != states('input_text.zendure_ac_mode_u1')
                     and not protect_charge }}
            then:
              - variables:
                  ac1_is: "{{ states('sensor.solarflow_1_ac_mode') }}"
                  ac1_should: "{{ states('input_text.zendure_ac_mode_u1') }}"
              - action: script.zendure_dispatch_u1_ac_mode
                data:
                  mode: "{{ ac1_should }}"
                  force: true
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id1
                data:
                  message: >
                    ⚠️ *AC-Mode war falsch (U1) – Re-Sync ausgeführt*\n
                    Ist (vor Re-Sync): {{ ac1_is }}\n
                    Soll (vor Re-Sync): {{ ac1_should }}\n
                    Der Fehler wurde erkannt und via MQTT korrigiert.
          - if:
              - condition: template
                value_template: >
                  {% set ac2 = states.sensor.solarflow_2_ac_mode %}
                  {% set soc2 = states('sensor.solarflow_2_battery_level')|float(100) %}
                  {% set gin2 = states('sensor.solarflow_2_grid_input_power')|float(0) %}
                  {{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR']
                     and ac2 is not none
                     and ac2.state == 'Input mode'
                     and states('input_text.zendure_ac_mode_u2') == 'Output mode'
                     and is_state('input_boolean.zendure_calib_mode_u2','off')
                     and is_state('input_boolean.zendure_calib_discharge_u2','off')
                     and is_state('input_boolean.zendure_emergency_u2','off')
                     and (soc2 <= 10 or gin2 > 50) }}
            then:
              - action: input_text.set_value
                target: { entity_id: input_text.zendure_ac_mode_u2 }
                data: { value: "Input mode" }
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id1
                data:
                  message: >
                    ℹ️ *AC-Reconcile U2 übersprungen (Schutzladung erkannt)*\n
                    Gerät blieb in Input mode (SoC/Grid-Ladung-Schutz aktiv). Helper wurde auf Input mode nachgezogen.
          - if:
              - condition: template
                value_template: >
                  {% set ac2 = states.sensor.solarflow_2_ac_mode %}
                  {% set soc2 = states('sensor.solarflow_2_battery_level')|float(100) %}
                  {% set gin2 = states('sensor.solarflow_2_grid_input_power')|float(0) %}
                  {% set protect_charge = ac2 is not none and ac2.state == 'Input mode'
                     and is_state('input_text.zendure_ac_mode_u2','Output mode')
                     and is_state('input_boolean.zendure_calib_mode_u2','off')
                     and is_state('input_boolean.zendure_calib_discharge_u2','off')
                     and is_state('input_boolean.zendure_emergency_u2','off')
                     and (soc2 <= 10 or gin2 > 50) %}
                  {{ states('sensor.solarflow_2_status_raw')|upper not in ['UNAVAILABLE', 'UNKNOWN', 'FAULT', 'ERROR']
                     and ac2 is not none
                     and ac2.state in ['Input mode', 'Output mode']
                     and states('input_text.zendure_ac_mode_u2') in ['Input mode', 'Output mode']
                     and ac2.state != states('input_text.zendure_ac_mode_u2')
                     and not protect_charge }}
            then:
              - variables:
                  ac2_is: "{{ states('sensor.solarflow_2_ac_mode') }}"
                  ac2_should: "{{ states('input_text.zendure_ac_mode_u2') }}"
              - action: script.zendure_dispatch_u2_ac_mode
                data:
                  mode: "{{ ac2_should }}"
                  force: true
              - action: notify.send_message
                target:
                  entity_id: !secret telegram_id1
