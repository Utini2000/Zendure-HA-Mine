      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      entity_category: diagnostic
      value_template: >
        {% set v = value | float(none) %}
        {% if v is none %}{{ 'unavailable' }}{% else %}{{ [v, 0] | max | round(0) }}{% endif %}

    - name: "SolarFlow 2 Solar Power 2"
      unique_id: solarflow_2_solar_power_2_mqtt
      default_entity_id: sensor.solarflow_2_solar_power_2
      state_topic: !secret zendure_topic_u2_sensor_solarpower2
