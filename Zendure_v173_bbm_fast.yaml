            target: { entity_id: input_datetime.zendure_last_ac_mode_dispatch_ts_u2 }
            data: { timestamp: "{{ now().timestamp() }}" }

  zendure_dispatch_u1_inputlimit:
    alias: "Zendure: Dispatch U1 InputLimit"
    mode: queued
    fields:
      power:
        description: "Target input limit in W"
      force:
        description: "Send command immediately (ignore cooldown/check)"
    sequence:
      - variables:
          target: "{{ [0, [power | int(0), 800] | min] | max }}"
          force_mode: "{{ force | default(false) }}"
          mem: "{{ states('input_number.zendure_last_inputlimit_u1') | int(-1) }}"
          actual_raw: "{{ states('sensor.solarflow_1_input_limit') }}"
          actual: "{{ actual_raw | int(mem) if is_number(actual_raw) else mem }}"
          ts_base: "{{ as_timestamp(states.input_number.zendure_last_inputlimit_u1.last_updated, 0) }}"
          since_base: "{{ as_timestamp(now()) - ts_base }}"
          cmd_ok: "{{ since_base > 2.2 }}"
      # Wenn das echte Read-Topic vom internen Helper abweicht, Memory nachziehen.
      - if:
          - condition: template
            value_template: "{{ is_number(actual_raw) and actual | int(-1) != mem | int(-1) }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_last_inputlimit_u1 }
            data:
              value: "{{ actual | int(0) }}"
      # MQTT-Write nur, wenn der echte Hub-Wert oder, falls dieser fehlt, der Memory-Wert vom Ziel abweicht.
      - if:
          - condition: template
            value_template: >
              {{ (force_mode | bool)
                 or (
                   (cmd_ok | bool)
                   and (
                     (is_number(actual_raw) and (target | int(-2)) != (actual | int(-1)))
                     or (not is_number(actual_raw) and (target | int(-2)) != (mem | int(-1)))
                   )
                 ) }}
        then:
          - action: mqtt.publish
            data: { topic: !secret zendure_topic_u1_number_inputLimit_set, payload: "{{ target }}", qos: 1 }
          - action: input_number.set_value
            target: { entity_id: input_number.zendure_last_inputlimit_u1 }
            data:
              value: "{{ target }}"

